faqPageTitleSuffix=Veelgestelde vragen
faq=Veelgestelde vragen
summary=Overzicht

installing=Installeren

useexistingaccountsTitle=Moet ik nieuwe contactgegevens aan mijn vrienden geven?
useexistingaccountsText=Nee, met Instantbird kunt u al uw bestaande instant messaging-accounts in een enkele toepassing gebruiken. Als u al instant messaging gebruikt, hoeft u geen nieuwe account aan te maken om Instantbird te gaan gebruiken.

systreqTitle=Werkt Instantbird op mijn computer?
systreqText=Instantbird ondersteunt momenteel &sysReqWinVersion; of hoger, &sysReqMacVersion; of hoger, en Linux. Zie de pagina &systemRequirementsLink; voor details.
systemRequirementsLink=systeemvereisten

getlatestTitle=Wat moet ik downloaden om de nieuwste versie van Instantbird te bemachtigen?
getlatestText=Een downloadkoppeling op de &homePageLink; selecteert voor u automatisch de versie van Instantbird die het meest bij uw systeem lijkt te passen. Als u uw besturingssysteem en taal zelf wilt selecteren, ga dan naar de &downloadPageLink;.
homePageLink=homepage
downloadPageLink=downloadpagina

installasuserTitle=Kan ik Instantbird op mijn computer installeren zonder beheerdersrechten?
installasuserText=Absoluut!

sideinstallTitle=Kan ik Instantbird installeren en mijn voorgaande messaging-client op mijn computer behouden?
sideinstallText=Absoluut! Instantbird en andere clients kunnen naast elkaar op dezelfde computer bestaan zonder problemen te geven.

installwindowsTitle=Hoe installeer ik Instantbird in Windows?
installwindowsText=Instantbird is voor Windows in een uitvoerbaar installatiebestand ondergebracht. Start eenvoudig het bestand dat u hebt gedownload en laat u door het installatieproces leiden.

installmacTitle=Hoe installeer ik Instantbird op Mac OS X?
installmacText=Dubbelklik op het Instantbird-schijfkopiebestand dat u hebt gedownload (een bestand met een naam die op “.dmg” eindigt). Sleep vervolgens het Instantbird-pictogram naar de map Programma’s.

installlinuxTitle=Hoe installeer ik Instantbird in Linux?
installlinuxText1=Pak de inhoud van het gedownloade archief uit en start het bestand met de naam “instantbird”. Als een pop-up-dialoogvenster u vraagt het bestand te bewerken of te starten, selecteert u “starten”.
installlinuxText2=Op dit moment bieden we alleen 32-bits builds. Om deze op een 64-bits systeem te laten werken, moet u de 32-bits compatibiliteitsbibliotheken die door uw distributie worden verschaft installeren. In Ubuntu bijvoorbeeld installeert u het pakket <code>ia32-libs</code> door het volgende vanaf de opdrachtregel uit te voeren: <code>sudo apt-get install ia32-libs</code>

portableTitle=Is Instantbird portabel (te gebruiken vanaf een USB-stick)?
portableText1=Als u Instantbird start vanaf een USB-stick, zal het standaard uw gebruikersprofiel op de harde schijf opslaan.
# Do NOT translate '-profile' here, it's a command line parameter.
portableText2=U kunt Instantbird opdragen uw profiel op de USB-stick op te slaan door het opdrachtregelargument <code>-profile</code> te gebruiken.
portableText3=Klik hiervoor met de rechtermuisknop op het bestand <code>instantbird.exe</code> en selecteer “Snelkoppeling maken”, klik vervolgens op de eigenschappen van de snelkoppeling, bewerk het doel en voeg hieraan <code> -profile ./<em>mapnaam</em></code> toe.


updating=Bijwerken

autoupdateTitle=Is er iets dat ik moet weten om de nieuwste versie van Instantbird te blijven gebruiken?
autoupdateText1=Nee, standaard zal Instantbird regelmatig op updates controleren en uw toestemming vragen om zichzelf bij te werken als een nieuwere versie wordt aangetroffen.
autoupdateText2=Als dit gedrag u niet bevalt, kunt u dit aanpassen in het voorkeurenvenster.

forceupdateTitle=Wat als ik Instantbird nu wil bijwerken?
forceupdateText=Er is een menu-item genaamd <em>Controleren op updates</em> (te benaderen via het menu <em>Help</em>), zodat u niet op de updatevraag hoeft te wachten als u weet dat er een update bestaat.

overwriteTitle=Kan ik een nieuwere versie over een bestaande installeren?
overwriteText=Ja.

addonsafterupdateTitle=Werken mijn add-ons nog na een update?
addonsafterupdateText1=Compatibele add-ons zullen na een update nog steeds werken. Als een add-on niet compatibel is met de bijgewerkte versie van Instantbird, zal Instantbird voorstellen om te controleren of er een nieuwere versie van de add-on verkrijgbaar is en deze bijwerken.
addonsafterupdateText2=Als uw add-on na een update niet meer werkt, kunt u wellicht contact opnemen met de maker om erachter te komen of er een bijgewerkte versie in de maak is.


uninstalling=De-installeren

removeTitle=Hoe kan ik Instantbird verwijderen?
removeText1=Als u in Windows het installatieprogramma hebt gebruikt, kunt u Instantbird de-installeren via het configuratiescherm, zoals u dat bij andere toepassingen zou doen.
removeText2=In andere gevallen kunt u eenvoudig de map van Instantbird verwijderen.
removeText3=Het verwijderen van Instantbird zal uw accounts, chatgeschiedenis, extensies of andere add-ons niet verwijderen. Deze gegevens worden bewaard in uw &profileFolderLink;.
profileFolderLink=profielmap
removeText4=Iedere versie van Instantbird die u na het verwijderen ervan installeert zal de gegevens uit die map blijven gebruiken.

using=Gebruik
severalaccountsTitle=Kan ik meerdere accounts tegelijk gebruiken?
severalaccountsText1=Ja, u kunt met meerdere accounts van een willekeurig ondersteund protocol tegelijk verbonden zijn.
severalaccountsText2=Gebruik de <em>accountbeheerder</em> (te benaderen via het menu <em>Extra</em>) om een andere account toe te voegen.

supportedprotocolsTitle=Welke protocols worden ondersteund?
supportedprotocolsText3=Momenteel ondersteunt Instantbird standaard AIM, Bonjour, Facebook Chat, Gadu-Gadu, Google Talk, Groupwise, ICQ, IRC, MSN, MySpaceIM, Netsoul, Odnoklassniki, QQ, Simple, Twitter, VKontakte, XMPP, Yahoo en Yahoo JAPAN.
supportedprotocolsText2=Extra protocolplug-ins kunnen als &addonsLink; worden geïnstalleerd.
addonsLink=add-ons

facebookusernameTitle=Wanneer ik met mijn Facebook-account probeer te verbinden, krijg ik de foutmelding <code>Ongeldig XMPP-ID</code>. Wat is het probleem?
facebookusernameText=U hebt het e-mailadres dat u gebruikt om u bij de Facebook-website aan te melden ingevoerd als uw gebruikersnaam. Facebook Chat verwacht dat u uw unieke gebruikersnaam in dit veld gebruikt. Ga naar &facebookLink; om dit te controleren.

facebookauthorizationTitle=Wanneer ik met mijn Facebook-account probeer te verbinden, krijg ik de foutmelding <code>Geen toestemming</code>. Wat is het probleem?
facebookauthorizationText=U dient XMPP-verbindingen voor uw Facebook-account in te schakelen.
facebookauthorizationText1=Bezoek &facebookChatLink; terwijl u bij uw Facebook-account bent aangemeld om XMPP-toegang in te schakelen.
facebookChatLink=Facebook Chat
facebookauthorizationText2=Meld u af bij de Facebook-website.
facebookauthorizationText3=Meld u weer aan bij de Facebook-website.
facebookauthorizationText4=Maak verbinding met uw Facebook-account in Instantbird (“Extra” > “Accounts” en klik op de knop “Verbinden” voor uw Facebook-account). Het maken van een verbinding zou nu moeten lukken.

getaddonsTitle=Waar kan ik add-ons (extensies en thema’s) verkrijgen?
getaddonsText=U kunt naar add-ons zoeken vanuit het tabblad <em>Add-ons verkrijgen</em> van de add-onbeheerder (te benaderen via het menu <em>Extra</em>), waar u een aantal aanbevolen add-ons zult zien. Voor meer add-ons kunt u &addonsWebsiteLink; bezoeken, waar u ook experimentele add-ons kunt bekijken en beoordelingen kunt posten.
addonsWebsiteLink=de add-on-website van Instantbird

logsenabledTitle=Maakt Instantbird logbestanden van mijn conversaties en chats aan?
logsenabledText=Ja, Instantbird maakt standaard logbestanden aan. Gebruik de instellingen in het paneel <em>Privacy</em> in het dialoogvenster <em>Opties</em> om dit naar wens te configureren. Als u de bestanden zelf wilt bekijken, gebruik dan de knop <em>Logboekmap tonen…</em> in hetzelfde paneel.

logfolderTitle=Waar worden de logbestanden opgeslagen?
logfolderText=De naam en het pad van de logbestanden zijn als volgt: <code><em>&profileLink;</em>/logs/<em>protocol</em>/<em>buddy- of chatnaam</em>/<em>datum en tijd</em>.txt</code> (vervang de schuine delen door werkelijke waarden).
profileLink=pad naar profiel

profilefolderTitle=Waar is mijn profielmap?
profilefolderText1=Deze bevindt zich op een van de volgende locaties, afhankelijk van uw besturingssysteem:
profilefolderTextCopyAndPaste=kopieer en plak dit precies zo in de Windows Verkenner
profilefolderTextReuse=Iedere versie van Instantbird die u na het verwijderen ervan installeert zal de gegevens uit deze profielmap blijven gebruiken.

aboutconfigTitle=Kan ik about:config benaderen om enkele voorkeuren te optimaliseren?
aboutconfigText=Hoewel we het gebruik ervan afraden, is about:config te benaderen via het tabblad <em>Geavanceerd</em> van het voorkeurenvenster.


development=Ontwikkeling

whyTitle=Waarom maken jullie Instantbird?
whyText=We maken Instantbird omdat &weBelieveLink;.
weBelieveLink=we geloven dat instant messaging een belangrijk onderdeel van uw online leven is

licenseTitle=Hoe is Instantbird gelicentieerd?
licenseText1=Instantbird is aan u gelicentieerd onder de voorwaarden van de GNU GPL-licentie versie 2.0 of hoger (omdat het libpurple gebruikt, dat GPL-gelicentieerd is). Het grootste deel van de broncode is echter ook gelicentieerd met de Mozilla Public License (MPL), versie 2.0.

getthesourceTitle=Waar is de broncode?
getthesourceText=Er is een tarball van de broncode van elke uitgegeven versie beschikbaar vanaf de &downloadPageLink;. De meest recente ontwikkelaarscode is vanaf onze Mercurial-coderepository te verkrijgen door de &buildInstructionsLink; te volgen.
buildInstructionsLink=build-instructies

teamTitle=Wie maakt Instantbird?
teamText=We zijn &teamLink; van sterk gemotiveerde individuen, maar we hopen dat veel mensen (waaronder u) met ons meedoen om dit project nog beter te maken.
teamLink=een klein team

mozillaTitle=Sponsort Mozilla het project?
mozillaText1=De Mozilla foundation heeft ons niet financieel geholpen.
mozillaText2=Het “Powered by Mozilla”-logo op onze voorpagina betekent dat Instantbird afhankelijk is van code en technologie die door de Mozilla-gemeenschap is ontwikkeld. We zijn de gehele Mozilla-gemeenschap veel dank verschuldigd voor de geweldige technologie waarop Instantbird is gebaseerd.

getinvolvedTitle=Hoe kan ik meedoen?
getinvolvedText=Er zijn diverse manieren om aan het project deel te nemen. U hoeft geen computerprogrammeur te zijn om ons te helpen. Zie &getInvolvedLink; voor details.
getInvolvedLink=meehelpen

translateTitle=Kan ik helpen bij het vertalen in mijn taal?
translateText=Ja! Zie de &translationWikiPageLink; voor details.
translationWikiPageLink=wiki-pagina over vertaling

createaddonsTitle=Hoe kan ik add-ons maken?
createaddonsText=Zie de &extensionsWikiPageLink;.
extensionsWikiPageLink=wiki-pagina over extensies

fxaddonsTitle=Werken add-ons voor Firefox/Thunderbird in Instantbird?
fxaddonsText=Niet ‘out of the box’, maar de meeste ervan kunnen worden aangepast. Zie de &portingFirefoxExtensionsPageLink;.
portingFirefoxExtensionsPageLink=pagina over porteren van Firefox-extensies

followTitle=Hoe kan ik de huidige ontwikkelinspanningen volgen?
followText1=Om van belangrijk nieuws op de hoogte te blijven kunt u &blogLink; volgen.
blogLink=onze blog
followText2=Als u onze discussies wilt volgen, bent u welkom in onze IRC-chatroom &ircRoomLink;.
ircRoomLink=#instantbird op de server irc.mozilla.org
followText3=&nightlyBuildsLink; worden elke dag gemaakt, zodat mensen ons kunnen helpen bij het testen van de functies die pas zijn toegevoegd. Voel u vrij om ze te gebruiken, maar kijk uit! Mogelijk zijn ze niet stabiel, en als u besluit ze te gebruiken, verwachten we eigenlijk dat u ze gebruikt om ons te helpen de allernieuwste functies te testen, en niet dat u alleen cool wilt zijn door als eerste het nieuwste speeltje te hebben. Als er dus bugs zijn, &reportBugLink; (&filingABugLink;: wat een bugrapport zou moeten bevatten) in plaats van te klagen.
reportBugLink=meld ze dan
nightlyBuildsLink=Nightly builds
filingABugLink=een bug melden

whatsnextTitle=Wat komt er in de volgende versie?
whatsnextText=Zie de &roadmapLink;.
roadmapLink=roadmap

whenTitle=Wanneer wordt de volgende ‘grote’ versie uitgebracht?
whenText=We zijn erg enthousiast over dit project en blij dat u ons verlangen deelt om zo snel mogelijk verder te gaan. Gezien de aard van softwareontwikkeling echter kan het geven van deadlines problematisch worden, en het behoud van kwaliteit vinden we belangrijker.

futurefeaturesTitle=Gaat Instantbird bestandsoverdracht/videochat/<em>voer hier uw favoriete functie in</em> ondersteunen?
futurefeaturesText1=Zie de &roadmapLink;.
futurefeaturesText2=Voel u vrij om zaken die niet worden vermeld met ons te bespreken, zodat u weet of we hierin zijn geïnteresseerd, of dat ze als add-ons kunnen worden geïmplementeerd.
