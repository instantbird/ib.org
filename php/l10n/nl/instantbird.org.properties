instantbirdBecause=We brengen Instantbird uit omdat…
weBelieveImportantComponentOnlineLife=We geloven dat instant messaging een belangrijk onderdeel is van <em>uw</em> online leven.
weBelieve=We geloven:

deservesMoreAttention=Dat instant messaging-software meer aandacht verdient: gegeven de hoeveelheid tijd die dagelijks aan instant messaging wordt besteed, is het de moeite waard om een paar minuten de tijd te nemen voor het kiezen van de software die <strong>goed voor u aanvoelt</strong>.
solidAlternative=Dat er <strong>een degelijk alternatief</strong> zou moeten zijn voor de instant messaging-software die al gangbaar is.
reclaimControl=Instant messaging is een deel van uw online leven waarover <strong>u de controle kunt terugkrijgen</strong>.

shouldBeEasyReliableFunEmpowering=Het zou <strong>eenvoudig te gebruiken, betrouwbaar, prettig en inspirerend</strong> moeten zijn
shouldJustWork=Het <strong>moet gewoon werken</strong>! Het doel van instant messaging-software is u te laten communiceren zonder dat het u in de weg zit. U wilt het gebruiken, niet uw tijd verspillen aan een gevecht ermee.
relyOnIt=Instant messaging is niet langer een nieuw speeltje, maar een realiseerbaar communicatiemiddel voor kritieke zaken. Het zou dus <strong>zeer stabiel</strong> moeten zijn, zodat u <strong>er op kunt vertrouwen</strong>.
customizeIt=Of u er nu veel of weinig tijd aan besteedt, u zou het <strong>helemaal moeten kunnen personaliseren</strong>. U zou moeten kunnen <strong>bepalen hoe het eruitziet</strong> en <strong>&customizeItLink;</strong>.
customizeItLink=kunnen aanpassen

respectTheUser=Een instant messenger zou <strong>de gebruiker moeten respecteren</strong>
privacy=Privacy
privacyText=omdat het bij instant messaging om intieme of vertrouwelijke gegevens gaat, zou u de controle moeten hebben over hoe met uw gegevens wordt omgegaan.
freedom=Vrijheid
freedomText=er zouden <strong>geen verrassingen</strong> mogen zijn tijdens het gebruik. Het zou <strong>gewoon moeten doen wat u wilt</strong>.

openSource=Om te verzekeren dat dit altijd het geval is, zou de manier waarop het werkt <strong>open en transparant</strong> moeten zijn. Daarom is het van belang dat <strong>Instantbird opensourcesoftware is</strong>.

shouldBeAccessibleAdapted=Een instant messenger zou <strong>toegankelijk</strong> en <strong>aan de gebruiker aangepast</strong> moeten zijn
adaptedToYourNeeds=<strong>Uw taal, computerkennis, besturingssysteem of capaciteiten zouden geen barrière mogen zijn</strong>; de software zou eerder aan uw eisen moeten zijn aangepast dan dat het een aanpassing van u vereist.

bringBackInnovation=De gebruikersbeleving van instant messaging zou verrukkelijk moeten zijn, maar is de laatste jaren nauwelijks geëvolueerd. Het is <strong>tijd dat de innovatie wordt teruggebracht</strong>! Ons doel is om deze overtuiging in Instantbird onder te brengen, en alle input van onze gebruikers is daarbij welkom.


gettingInvolved=Meehelpen:

joiningUs=Als u onze overtuiging deelt, bent u waarschijnlijk geïnteresseerd om met ons mee te doen. Er zijn <strong>diverse manieren om betrokken te raken</strong>, en voor sommige daarvan hebt u geen enkele technische kennis nodig:

feedbackAndIdeas=Feedback geven, ideeën aandragen
knowHowItWorksForYou=Het is voor ons essentieel te weten hoe Instantbird voor u werkt, zodat we het zodanig kunnen verbeteren dat het nuttiger voor u wordt.
severalWaysToSendFeedback=Er zijn diverse manieren om feedback te geven, waaronder het verzenden van crashrapporten, &filingBugsLink;, of met ons praten. Als u een bepaalde vraag hebt, aarzel dan niet om &getInTouchWithUsLink;.
filingBugsLink=indienen van bugs
getInTouchWithUsLink=contact met ons op te nemen
comeDiscussYourIdeas=Aarzel niet en bespreek uw ideeën voor toekomstige verbeteringen met ons. Dit wordt echt gewaardeerd. Misschien worden ze in een toekomstige versie verwerkt, of vinden makers van add-ons ze interessant!

spreadTheWord=Vertel het verder!
talkAboutIt=Praat met uw vrienden, collega’s en familieleden over Instantbird: vertel ze wat u eraan bevalt en waarom u denkt dat ze geïnteresseerd zouden kunnen zijn. Help ze bij het installatieproces (in het bijzonder bij het instellen van hun accounts). Vraag ze een paar dagen later of ze het nog gebruiken en/of of ze er problemen mee hebben ervaren. Als ze problemen tegenkwamen, zorg er dan voor dat we hiervan weten (zie ‘Feedback geven’ hierboven).

testPreReleaseVersions=Test pre-release-versies
alphaBetaNightly=We brengen alfa- en bètaversies uit, zodat u feedback over de nieuwe functies kunt geven. Als u de ontwikkeling van dichtbij wilt volgen, kunt u onze nightly builds testen.
pleaseReportIssues=Rapporteer alle problemen die u mocht tegenkomen.

helpOtherInstantbirdUsers=Help andere Instantbird-gebruikers!
answerQuestionsOnIRC=Als u in onze IRC-chatroom aanwezig bent, ziet u mogelijk vragen van andere gebruikers die hulp nodig hebben. Aarzel niet om ze te helpen, ook al denkt u dat anderen meer kennis hebben. Als u iemand begint te helpen en erachter komt dat u de oplossing niet weet, geen zorgen! Anderen helpen u erbij!

translate=Vertalen
translateInstantbirdIntoYourLanguage=Om ons te helpen Instantbird bij een breder publiek aan te bieden, kunt u &translateInstantbirdLink; naar uw eigen taal.
translateInstantbirdLink=Instantbird vertalen

addonDevelopment=Add-on-ontwikkeling
createEditReviewAddons=&createAddonLink;, &reviewAddonsLink; en bewerk add-ons en geef daarmee anderen het gevoel dat hun Instantbird nog beter bij ze aansluit, dankzij u.
createAddonLink=Creëer
reviewAddonsLink=beoordeel

contributeCode=Bijdragen in de code
weCanHelpYou=Voor degenen onder u met meer technische kennis: ga uw gang en lever patches aan.</p><p>Waarschijnlijk wilt u beginnen door &compilingABuildYourselfLink;. Praat met ons tijdens het proces, we kunnen u sneller aan de gang helpen!
compilingABuildYourselfLink=zelf een build te compileren
