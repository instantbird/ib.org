whatsNew=Wat is er nieuw?

redesignedContactsWindow=Opnieuw ontworpen contactvenster:
contactMerging=Contacten samenvoegen
contactMergingDescription=Als u dezelfde persoon via meerdere IM-netwerken spreekt, kunt u de gebruikersnamen van die persoon van meerdere netwerken nu combineren naar één contact. Bij het openen van een nieuwe chat zal de gebruikersnaam die online is automatisch worden gekozen, en het conversatievenster naar de bijbehorende gebruikersnaam omschakelen als de persoon naar een andere IM-netwerk overschakelt.
tags=Labels
tagsDescription=Er worden labels gebruikt als vervanging voor de groepen in de buddylijst. Labels kunnen worden verborgen door op de “x” rechts van de buddylijst te klikken. Alle buddy’s van dit label worden automatisch naar een label “Overige contacten” verplaatst, die onderaan de buddylijst zichtbaar is.
contactsWindowCanNowBe=Het contactvenster kan nu worden…
closedOnMac=gesloten op een Mac zonder Instantbird af te sluiten; het kan weer worden geopend via het Dock.
minimizedToTrayOnWindowsAndLinux=<strong>geminimaliseerd naar het systeemvak</strong> in Windows en Linux. Standaard zal het sluiten van de buddylijst (de ‘x’ aanklikken) deze minimaliseren naar het systeemvak, wat kan worden gewijzigd in de voorkeuren.
buddyIcon=Gebruikers kunnen nu hun <strong>buddypictogram</strong> en de <strong>weergavenaam</strong> van hun accounts direct op de contactenlijst instellen.
contactListSorted=<strong>De contactenlijst wordt gesorteerd</strong> op alfabet (zowel groepen als contacten verschijnen gesorteerd).
nicerAnimations=Mooiere animaties.

twitterSupport=Ondersteuning voor Twitter
twitterSupportDescription=Wanneer de Twitter-account is verbonden, wordt automatisch een tijdlijnconversatie geopend. Als de conversatie door de gebruiker wordt gesloten, wordt dit bij de ontvangst van nieuwe berichten weer automatisch geopend. De gebruiker dient de account via de accountbeheerder te verbreken om het weergeven van nieuwe berichten tegen te gaan.<br />Er is een geavanceerde optie tot “volgen”, waarmee trefwoorden kunnen worden opgegeven die men kan volgen. Dit is een kommagescheiden lijst van trefwoorden. Een komma betekent OF, een spatie binnen een trefwoord betekent EN.

topConversationUI=Nieuwe <strong>informatiewerkbalk boven de conversatie-UI</strong> die het buddypictogram, de weergavenaam en de huidige status van uw contact weergeeft. Daarnaast kunt u het IM-netwerk dat u voor de conversatie gebruikt wijzigen door op het protocolpictogram te klikken.
updatedTabStyling=De <strong>tabbladstyling</strong> van conversaties is <strong>bijgewerkt</strong>, zodat deze overeenkomt met die van Firefox 4, en gebruikers van recente Windows-versies zullen enkele <strong>Aero glass-effecten</strong> kunnen waarderen.
timeBubbles=Bubbles, het standaard berichtthema, heeft nieuwe tijdgerelateerde functies gekregen. Zie onze &blogPostLink; voor details.
blogPostLink=blogpost

jumplist=(Alleen Windows 7) <strong>Jumplist-ondersteuning</strong> om snel van status te kunnen wisselen.

jsProto=Onder de motorkap: protocolplug-ins kunnen nu in JavaScript worden geïmplementeerd.

minorImprovements=Veel kleine verbeteringen, waaronder:
jumpToTab=U kunt nu snel naar het n-e tabblad omschakelen via &lt;modifier&gt;+&lt;n&gt; in het conversatievenster, waarin &lt;modifier&gt; ctrl is in Windows/Linux, en command op Mac.
helpCommand=Er is een helpopdracht (‘/help’) toegevoegd, waarmee snel en eenvoudig is te zien welke opdrachten voor de huidige conversatie beschikbaar zijn.
unknownStatus=Status Onbekend wordt nu anders weergegeven dan status Online, via verschillende pictogrammen.
darkSimple=Donkere variant van de “Simple”-skin.

updated=Bijgewerkt
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; is gebaseerd op libpurple &libpurpleVersion; en Mozilla &mozillaVersion;, wat fantastische &newPossibilitiesForAddonsDevelopersLink; (&restartLessAddonsLink;) brengt.
newPossibilitiesForAddonsDevelopersLink=nieuwe mogelijkheden voor ontwikkelaars van add-ons
restartLessAddonsLink=zoals herstartloze add-ons

improvedStability=Verbeterde stabiliteit
improvedStabilityDescription=we hebben de crashrapporten gebruikt die we van de 0.2- en 0.3-releases en nightly builds hebben ontvangen voor het verhelpen van bugs die resulteerden in crashes.

andMore=En meer… Lees de volledige &changeLogLink; voor details over de &codeChangesCount; codewijzigingen sinds Instantbird 0.2.
changeLogLink=lijst met wijzigingen

knownIssues=Bekende problemen
cannotReopenTwitterTimeline=Na het sluiten van de Twitter-tijdlijn kan deze niet handmatig worden geopend om een tweet te verzenden; deze zal zichzelf automatisch openen als een tweet wordt ontvangen.
