keyFeaturesNotesPageTitleSuffix=belangrijkste functies

instantbirdFeatures=Functies van Instantbird
awesomenessToMakeIMBetterForYou=Samenbrengen van alles wat geweldig is om instant messaging voor u te verbeteren.

allYourFriendsTitle=Praten met al uw vrienden
allYourFriendsDesc1=Met Instantbird kunt u nu via één toepassing met al uw vrienden praten!
allYourFriendsDesc2=AIM, Yahoo, MSN, Google Talk, Facebook en zelfs Twitter worden ondersteund!

troubleFreeTitle=Probleemloos
troubleFreeDesc1=Instantbird is met stabiliteit en eenvoud in gedachten ontworpen.
troubleFreeDesc2=De schone en rommelvrije interface zal u bevallen: niets zal u van uw conversaties afleiden!
troubleFreeDesc3=Geen advertenties, u zult zich niet ergeren aan ongewilde inhoud.

conversationsInTabsTitle=Conversaties in tabbladen
conversationsInTabsDesc1=Conversaties worden in tabbladen gegroepeerd, zodat u nooit wordt overstelpt door overal verschijnende conversatievensters.
conversationsInTabsDesc2=De tabbladen zijn eenvoudig te gebruiken: u kunt ze verslepen om te herschikken, of een conversatie naar een nieuw venster verplaatsen.

customizableConversationsTitle=Aanpasbare conversaties
customizableConversationsDesc1=Met enkele zorgvuldig ontworpen en standaard beschikbare berichtthema’s en honderden andere die als add-ons verkrijgbaar zijn hebt u alles wat nodig is om uw conversaties persoonlijk te laten aanvoelen.
customizableConversationsDesc2=Bouw ze om naar een kleurrijke, geweldige ervaring!

smartContactsTitle=Slimme contacten
smartContactsDesc1=Gebruikt u meerdere manieren om dezelfde persoon te bereiken?
smartContactsDesc2=Geen probleem, sleep gewoon een contact naar een ander contact en Instantbird weet dat het dezelfde persoon is.

alwaysHereForYouTitle=Altijd voor u beschikbaar
alwaysHereForYouDesc1=Instantbird werkt op al uw computers, of ze nu Windows, Mac OS X of Linux gebruiken.
alwaysHereForYouDesc2=Omdat het gratis en Open-Source is, hoeft u nooit te betalen voor het gebruik.
alwaysHereForYouDesc3=U zult nooit meer een andere IM-client hoeven te leren gebruiken!

limitlessExtensibilityTitle=Grenzeloze uitbreidbaarheid
limitlessExtensibilityDesc1=Ingebouwde krachtige hulpmiddelen zoals intern zoeken of inzoomen helpen u het meeste uit uw conversaties te halen.
limitlessExtensibilityDesc2=Dankzij Instantbirds grenzeloze uitbreidbaarheid zijn er nog meer verkrijgbaar als add-ons!
