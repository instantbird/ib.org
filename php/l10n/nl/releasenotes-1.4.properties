whatsNew=Wat is er nieuw?

logViewerDateTree=De logviewer groepeert uw conversaties nu op datum.

twitterImprovements=Twitter-verbeteringen
characterCounter=De tekenteller voor Twitter is verbeterd, zodat rekening wordt gehouden met automatische verkorting van koppelingen, waardoor u <strong>makkelijk koppelingen kunt tweeten</strong> zonder u druk te maken over hun lengte!
twitterAPIUpgrade=Bijgewerkt naar de Twitter-API v1.1; houd er rekening mee dat Instantbird 1.3 na 11 juni 2013 mogelijk niet meer met Twitter werkt!
followedPeopleInTimeline=Twitter bevat nu iedereen die u volgt als deelnemer in uw tijdlijn.

ircAuthImprovements=<strong>IRC-authenticatie</strong> werkt beter met bouncers (bv. ZNC).
ircOverrideCerts=U kunt nu eenvoudig <strong>zelfondertekende/ongeldige/verouderde certificaten</strong> voor IRC-servers negeren.
debugLogs=Elke account houdt nu <strong>debuglogboeken</strong> bij, die u kunt benaderen door met de rechtermuisknop op de account in de Accountbeheerder te klikken en “Debuglogboek kopiëren” te kiezen. Deze logboeken bevatten belangrijke informatie voor ontwikkelaars om problemen van gebruikers te onderzoeken. (Houd er rekening mee dat debuglogboeken gevoelige informatie KUNNEN bevatten.)

underTheHood=Onder de motorkap
basedOnLibpurpleAndMozilla=<strong>Bijgewerkt:</strong> Instantbird &versionNumber; is gebaseerd op Mozilla &mozillaVersion; en gebruikt libpurple &libpurpleVersion;!
droppedOldMacOSSupport=Mac OS X < 10.6 wordt niet meer ondersteund. Upgrade uw besturingssysteem of blijf Instantbird 1.3 gebruiken.
andMore=En meer… Lees de volledige &changeLogLink; voor details over all codewijzigingen sinds Instantbird 1.3.
