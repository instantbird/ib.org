whatsNew=Wat is er nieuw?

improvedAccessibility=Belangrijke <strong>toegankelijkheidsverbeteringen</strong>.

ircImprovements=IRC-verbeteringen
longMessages=Lange berichten worden nu in meerdere delen verzonden in plaats van dat ze worden afgebroken.
SASLAuth=SASL-authenticatie wordt nu ondersteund, wat vereist is voor bepaalde IP-reeksen of bij het gebruik van Tor en het verbinden met Freenode.

twitterImprovements=Twitter-verbeteringen
ownDescription=Uw eigen omschrijving (die te bewerken is) wordt nu boven de tijdlijn getoond.
replyToAll=Het beantwoorden van een tweet beantwoordt nu alle gebruikers, net als op de Twitter-website!
twitterTabIcon=Het tabbladpictogram voor Twitter-tijdlijnen is nu de Twitter-vogel, zodat een tijdlijn duidelijker van een chatvenster is te onderscheiden.

showNick=De add-on “Show Nick” is geïntegreerd. Deze add-on markeert wanneer de bijnaam van een gebruiker in een chatgesprek wordt genoemd, zodat conversaties makkelijk kunnen worden opgemerkt. Hopelijk bevalt deze nieuwe functie, maar als dit niet zo is, kunt u deze uitschakelen door de geavanceerde voorkeursinstelling “messenger.conversations.showNicks” in about:config op false te zetten.

newXMPPNetworks=Er zijn twee nieuwe sociale netwerken toegevoegd via XMPP: <strong>Odnoklassniki</strong> en <strong>VKontakte</strong>.

underTheHood=Onder de motorkap
basedOnLibpurpleAndMozilla=<strong>Bijgewerkt:</strong> Instantbird &versionNumber; is gebaseerd op Mozilla &mozillaVersion;, dat geweldige &newPossibilitiesForAddonsDevelopersLink; brengt en libpurple &libpurpleVersion; gebruikt. Dit is de laatste versie van Instantbird die Mac OS 10.5 en PPC ondersteunt, aangezien ondersteuning van Mozilla 17 hiervoor niet mogelijk is.
newPossibilitiesForAddonsDevelopersLink=nieuwe mogelijkheden voor add-on-ontwikkelaars
memoryReporters=Het door libpurple gebruikte geheugen en de afhankelijkheden ervan worden nu bijgehouden in about:memory.
andMore=En meer… Lees de volledige &changeLogLink; voor details over de &codeChangesCount; codewijzigingen sinds Instantbird 1.2.
changeLogLink=changeLog
