whatsNew=Что нового?

improvedAccessibility=Серьёзно <strong>улучшена поддержка доступности</strong>.

ircImprovements=Улучшена поддержка IRC
longMessages=Длинные сообщения теперь будут отправляться в виде нескольких частей, а не обрезаться.
SASLAuth=Добавлена поддержка аутентификации SASL, что требуется для определенных диапазонов IP-адресов или при использовании Tor и подключении к Freenode.

twitterImprovements=Улучшена поддержка Твиттер
ownDescription=Ваше собственное описание теперь отображается (и редактируется) над лентой.
replyToAll=Отвечая на твит, вы теперь отвечаете всем пользователям, как это сделано на веб-сайте Твиттер!
twitterTabIcon=В качестве значка вкладки для лент Твиттер теперь используется птица Твиттер, чтобы лучше отличать ленты от окна чата.

showNick=Было интегрировано дополнение "Show Nick". Оно обеспечивает подсветку ника пользователя в чате, если в нём упоминается ник пользователя, что позволяет легко увидеть ведущиеся в настоящее время беседы. Мы надеемся, что вам понравится эта новая функция, но если хотите, вы можете легко её отключить, установив в about:config параметр "messenger.conversations.showNicks" в false.

newXMPPNetworks=Добавлены две новые социальные сети, работающие через XMPP: <strong>ВКонтакте</strong> и <strong>Одноклассники</strong>.

underTheHood=Под капотом
basedOnLibpurpleAndMozilla=<strong>Обновление движка:</strong> Instantbird &versionNumber; создан на основе Mozilla &mozillaVersion;, предоставляющем множество &newPossibilitiesForAddonsDevelopersLink;, и использует libpurple &libpurpleVersion;. Это последний релиз Instantbird, поддерживающий Mac OS 10.5 и PPC, так как начиная с Mozilla 17 их поддержка более невозможна.
newPossibilitiesForAddonsDevelopersLink=новых возможностей для разработчиков дополнений
memoryReporters=Память, потребляемую libpurple и его зависимостями, теперь можно отследить через страницу about:memory.
andMore=И многое другое... Для получения большей информации о &codeChangesCount; изменениях в коде, произошедших с момента выхода Instantbird 1.2, прочтите полный &changeLogLink;.
changeLogLink=список изменений
