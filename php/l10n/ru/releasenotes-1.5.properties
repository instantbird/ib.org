whatsNew=Что нового?

newTabIntro=Упрощено открытие <strong>новой вкладки с беседой</strong>.
newTabOpeningTheTab=Щелчок по кнопке '+' в окне бесед отобразит список собеседников, которые могут быть запущены всего одним щелчком.
newTabFrecency=Список сортируется по алгоритму frecency, учитывающему, как часто и насколько недавно вы разговаривали с каждым контактом.
newTabChannelList=Этот список также автоматически включает список каналов, отправляемый IRC -серверами, к которым вы сейчас подключены.

newTooltips=<strong>Улучшены всплывающие подсказки</strong>, которые теперь лучше соответствуют стилю, используемому Instantbird

improvedMUCsIntro=Улучшен интерфейс Многопользовательских чатов:
improvedMUCsContextMenu=У каждого участника теперь имеется контекстное меню, которое позволяет открывать с ним приватные беседы или добавлять его в список друзей.
improvedMUCsHighlightedNicks=Подсвеченные псевдонимы в комнатах чатов теперь имеют подсказки и контекстные меню.

improvedRTLSupport=В беседах улучшена поддержка отображения RTL языков.

hangoutMobileStatus=Пользователи Google Talk и Android Hangouts теперь отображаются со значком мобильного телефона.

ircAlternateNicks=Добавлена возможность настройки альтернативных псевдонимов для IRC, в случае, если предпочитаемый вами псевдоним окажется уже занят при подключении.

retinaSupport=Добавлена поддержка дисплея Retina на Mac OS X.

autojoinToHold=Чаты, к которым производится автоматическое присоединение и которые были поставлены на hold, останутся поставленными на hold и после перезапуска.

aboutPagesInTabs=Страницы about: (например, about:config) теперь можно легко открыть с помощью команды /about (например, /about config).

hangoutTypingFix=Пользователи Google Hangouts больше не будут выглядеть как всегда набирающие текст.

variousFixes=Устранены разные мелкие ошибки и несколько багов приводящих к падениям.

mozilla25=Движок обновлен до Mozilla 25.

vkontakteDropped=Удалена поддержка протокола ВКонтакте, так как служба ВКонтакте прекратила поддержку подключения с помощью клиента XMPP.

tabbrowserAPILinkText=документация в коде
tabbrowserAPI=Новости для разработчиков: Добавлен новый API для добавления панелей вкладок с произвольным содержанием в окнах бесед: &tabbrowserAPILink;.

knownIssues=Известные проблемы:

nvdaMozillaBug=Пользователям NVDA необходимо обновиться до 2014.1, чтобы обойти ошибку в платформе Mozilla, приводящую к тому, что при прокрутке списка контактов выводится сообщение "Неизвестно".

bug1995LinkText=ошибке 1995
linkHandlerLinux=Щелчки по ссылкам не работают в некоторых новых дистрибутивах Linux. Чтобы обойти эту проблему, откройте about:config (наберите в беседе /about config), найдите параметры network.protocol-handler.warn-external, и установите все их значения в true. После щелчка по этим ссылкам вам будет предложено выбрать программу для их открытия. Подробнее в &bug1995Link;.

andMore=И многое другое... Для получения информации обо всех изменениях в коде, произошедших с момента выхода Instantbird 1.4, прочтите полный &changeLogLink;.
changeLogLink=список изменений
