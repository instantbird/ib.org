keyFeaturesNotesPageTitleSuffix=ключевые возможности

instantbirdFeatures=Возможности Instantbird
awesomenessToMakeIMBetterForYou=Instantbird объединяет в себе множество удивительных возможностей, чтобы сделать для вас обмен мгновенными сообщениями ещё лучше.

allYourFriendsTitle=Общение со всеми своими друзьями
allYourFriendsDesc1=С Instantbird, вы можете разговаривать со всеми своими друзьями через одно приложение!
allYourFriendsDesc2=Поддерживаются AIM, Yahoo, MSN, Google Talk, Facebook и даже Twitter!

troubleFreeTitle=Бесперебойная работа
troubleFreeDesc1=При разработке Instantbird большое внимание уделялось стабильности и простоте.
troubleFreeDesc2=Вы сможете насладиться чистым, незахламленным интерфейсом: ничто не будет отвлекать вас от вашего разговора!
troubleFreeDesc3=Никакой рекламы, никакого раздражающего нежелательного контента.

conversationsInTabsTitle=Беседы во вкладках
conversationsInTabsDesc1=Беседы сгруппированы во вкладки, гарантируя вам, что вы никогда не будете завалены всплывающими повсюду окнами.
conversationsInTabsDesc2=Вкладки легки в использовании: вы можете перетащить их, чтобы изменить их порядок, или переместить беседу в новое окно.

customizableConversationsTitle=Настраиваемые беседы
customizableConversationsDesc1=С несколькими тщательно разработанными темами для сообщений, доступными по умолчанию, и сотнями доступных дополнений, у вас есть всё, что нужно, чтобы сделать ваши беседы более личными.
customizableConversationsDesc2=Давайте сделаем их более красочными и доставляющими удовольствие!

smartContactsTitle=Умные контакты
smartContactsDesc1=Есть несколько способов связаться с одним человеком?
smartContactsDesc2=Нет проблем. Просто перетащите и бросьте один контакт на другой, и Instantbird будет знать, что это один и тот же человек.

alwaysHereForYouTitle=Постоянная доступность
alwaysHereForYouDesc1=Instantbird будет работать на всех ваших компьютерах, будь они под управлением Windows, Mac OS X или Linux.
alwaysHereForYouDesc2=Будучи свободным и открытым, вам никогда не придется платить за его использование.
alwaysHereForYouDesc3=Вам никогда не придётся снова учиться пользоваться другим IM клиентом!

limitlessExtensibilityTitle=Безграничная расширяемость
limitlessExtensibilityDesc1=Мощные встроенные инструменты, такие как поиск или масштабирование текста, помогут вам получить максимальную отдачу от ваших бесед.
limitlessExtensibilityDesc2=Ещё больше возможностей доступно в виде дополнений, благодаря безграничной расширяемости Instantbird!

