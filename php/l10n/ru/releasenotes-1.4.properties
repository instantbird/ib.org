whatsNew=Что нового?

logViewerDateTree=Средство просмотра логов теперь группирует ваши разговоры по дате.

twitterImprovements=Улучшена поддержка Твиттер
characterCounter=Счетчик символов для Твиттер теперь учитывает автоматическое сокращение ссылок, позволяя вам <strong>легко твитить ссылки</strong>, не беспокоясь об их длине!
twitterAPIUpgrade=Произведено обновление до Twitter API v1.1. Обратите внимание, что Instantbird 1.3 может перестать работать с Твиттером начиная с 11 июня 2013 года!
followedPeopleInTimeline=Твиттер теперь включает всех, кого вы читаете, в качестве участников вашей хронологии.

ircAuthImprovements=Улучшена работа <strong>IRC-аутентификации</strong> с боунсерами (например ZNC).
ircOverrideCerts=Теперь вы можете легко проигнорировать предупреждения о <strong>самоподписанных/некорректных/истёкших сертификатах</strong> для серверов IRC.
debugLogs=Каждая учетная запись теперь хранит <strong>логи отладки</strong>, который можно получить, щёлкнув правой кнопкой мыши по учётной записи в Окне управления учётными записями и выбрав пункт "Копировать лог отладки". Они содержат важную информацию для разработчиков, помогающую им диагностировать проблемы у пользователей. (Обратите внимание, что логи отладки МОГУТ содержать конфиденциальную информацию).

underTheHood=Под капотом
basedOnLibpurpleAndMozilla=<strong>Обновление движка:</strong> Instantbird &versionNumber; создан на основе Mozilla &mozillaVersion; и использует libpurple &libpurpleVersion;!
droppedOldMacOSSupport=Mac OS X < 10.6 более не поддерживается. Пожалуйста, обновите свою операционную систему или продолжите использовать Instantbird 1.3.
andMore=И многое другое... Для получения информации обо всех изменениях в коде, произошедших с момента выхода Instantbird 1.3, прочтите полный &changeLogLink;.
changeLogLink=список изменений
