instantbirdBecause=Мы создали для вас Instantbird, так как...
weBelieveImportantComponentOnlineLife=Мы верим, что обмен мгновенными сообщениями является важной частью <em>вашей</em> жизни в Интернете.
weBelieve=Мы убеждены:

deservesMoreAttention=Что программы мгновенного обмена сообщениями заслуживают большего внимания: Учитывая всё то время, которое каждый день затрачивается на обмен мгновенными сообщениями, стоит потратить несколько минут, чтобы выбрать программу, которая <strong>подойдёт именно вам</strong>.
solidAlternative=Что должна быть <strong>серьёзная альтернатива</strong> для программ мгновенного обмена сообщениями, которые уже являются популярными.
reclaimControl=Что мгновенный обмен сообщениями является той частью жизни в Интернете, которую <strong>вы можете контролировать</strong>.

shouldBeEasyReliableFunEmpowering=Программа должна быть <strong>проста в использовании, надежна, приносить радость и иметь множество возможностей</strong>
shouldJustWork=Она должна <strong>просто работать</strong>! Цель программы обмена сообщениями - дать вам возможность общаться, а не вставать у вас на пути. Вы ставите её, чтобы использовать, а не тратить время на борьбу.
relyOnIt=Обмен мгновенными сообщениями больше не является новой игрушкой, а является реальным средством связи для решения критичных вопросов, поэтому она должна быть <strong>очень стабильна</strong>, чтобы вы были уверены, что <strong>можете на неё положиться</strong>.
customizeIt=Часто ли вы с ней работаете или нет, вы должны быть в состоянии <strong>сделать программу такой, какой вам нужно</strong>. Вы должны <strong>иметь возможность решить, какой она должна быть</strong>, чтобы <strong>&customizeItLink;</strong>.
customizeItLink=её настроить

respectTheUser=Программа обмена мгновенными сообщениями должна <strong>уважать своих пользователей</strong>
privacy=Приватность
privacyText=так как мгновенный обмен сообщениями включает в себя личные или конфиденциальные данные, вы должны контролировать обработку своих данных.
freedom=Свобода
freedomText=при её использовании <strong>не должно быть сюрпризов</strong>. Она должна <strong>делать только то, что вы хотите</strong>.

openSource=Чтобы обеспечить постоянное соблюдение этих принципов, работа программы должна быть <strong>открытой и прозрачной</strong>. Вот почему так важно, что <strong>Instantbird является программой с открытым исходным кодом</strong>.

shouldBeAccessibleAdapted=Программа обмена мгновенными сообщениями должна <strong>обеспечивать равные возможности</strong> и <strong>быть адаптирована для пользователя</strong>
adaptedToYourNeeds=<strong>Ваш язык, знание компьютера, операционной системы или ваши возможности не должны быть препятствием</strong>; программное обеспечение должно быть адаптировано к вашим потребностям, а не требовать, чтобы вы к нему адаптировались.

bringBackInnovation=Работа с мгновенными сообщениями должна приносить пользователям удовольствие, хотя в последние годы это направление развивалось очень мало. Пришло <strong>время новых свершений</strong>! Нашей целью является воплощение всех наших убеждений в форме Instantbird, и мы с радостью примем любые отзывы от наших пользователей.


gettingInvolved=Как принять участие:

joiningUs=Если вы разделяете наши убеждения, то, возможно, что вы захотите к нам присоединиться. Есть <strong>много способов принять участие в нашем проекте</strong> и некоторые из них не требуют от вас никаких технических знаний:

feedbackAndIdeas=Отправляйте отзывы, вносите идеи
knowHowItWorksForYou=Очень важно, чтобы мы знали, как у вас работает Instantbird, чтобы мы могли его улучшить и сделать более полезным.
severalWaysToSendFeedback=Есть несколько способов отправки отзывов. Вы можете отправлять сообщения о падениях, &filingBugsLink; или просто с нами поговорить. Если у вас есть вопросы, вы всегда можете &getInTouchWithUsLink;.
filingBugsLink=отправлять сообщения об ошибках
getInTouchWithUsLink=с нами связаться
comeDiscussYourIdeas=Если у вас есть идеи о том, как улучшить Instantbird, вы всегда можете их с нами обсудить. Мы очень ценим ваше мнение. Ваши идеи могут быть воплощены в будущем релизе или заинтересовать некоторых авторов дополнений!

spreadTheWord=Расскажите о нас!
talkAboutIt=Расскажите о Instantbird своим друзьям, коллегам и родственникам: объясните им, что вам нравится, и почему вы думаете, что они могут им заинтересоваться. Помогите им в процессе установки (особенно при настройке их учётных записей). Через несколько дней поинтересуйтесь у них, используют ли они его и/или есть ли у них с ним проблемы. Если они столкнулись с проблемами, дайте нам о них знать (см. выше «Отправляйте отзывы»).

testPreReleaseVersions=Тестируйте предварительные версии
alphaBetaNightly=Мы выпускаем альфа-и бета-версии, так что вы отправить нам отзывы о новых возможностях. Если вы хотите внимательно следить за разработкой, то для тестирования у нас есть ночные сборки.
pleaseReportIssues=Пожалуйста, сообщайте нам о любых найденных вами проблемах.

helpOtherInstantbirdUsers=Помогите другим пользователям Instantbird!
answerQuestionsOnIRC=Если вы заходите в наш IRC-чат, то вы можете увидеть вопросы от других пользователей, которым нужна помощь. Вы всегда можете попробовать им помочь, даже если вы считаете, что другие люди знают больше. Если вы начнете кому-нибудь помогать и поймете, что не знаете решение, не волнуйтесь! Им помогут другие!

translate=Займитесь переводом
translateInstantbirdIntoYourLanguage=Чтобы помочь нам предложить Instantbird для более широкого круга людей, вы можете &translateInstantbirdLink; на свой родной язык.
translateInstantbirdLink=перевести Instantbird

addonDevelopment=Разрабатывайте дополнения
createEditReviewAddons=&createAddonLink;, &reviewAddonsLink; и редактируя дополнения, вы даете другим людям возможность почувствовать, что, благодаря вам, Instantbird подходит им ещё лучше.
createAddonLink=Создавая
reviewAddonsLink=проверяя

contributeCode=Вносите свой код
weCanHelpYou=Если у вас есть больше технических знаний, чем у других пользователей, вы можете предложить для включения в код свои патчи.</p><p>Возможно, вы захотите начать со &compilingABuildYourselfLink;. Во время этого процесса вы можете с нами пообщаться, и возможно мы сможем помочь вам ускорить свою работу!
compilingABuildYourselfLink=самостоятельной сборки Instantbird
