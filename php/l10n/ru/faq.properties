faqPageTitleSuffix=Часто задаваемые вопросы
faq=Часто задаваемые вопросы
summary=Оглавление

installing=Установка

useexistingaccountsTitle=Нужно ли отправлять моим друзьям новую контактную информацию?
useexistingaccountsText=Нет. С Instantbird вы можете использовать все имеющиеся у вас учётные записи мгновенного обмена сообщениями в одном приложении. Если вы уже используете мгновенный  обмен сообщениями, то вам не нужно создавать новую учетную запись для того, чтобы начать использовать Instantbird.

systreqTitle=Будет ли Instantbird работать на моем компьютере?
systreqText=Instantbird в настоящее время поддерживает &sysReqWinVersion; или выше, &sysReqMacVersion; или выше, и Linux. Для получения более подробной информации прочтите страницу &systemRequirementsLink;.
systemRequirementsLink=системных требований

getlatestTitle=Что мне следует загрузить, чтобы получить последнюю версию Instantbird?
getlatestText=Щёлкнув по ссылке загрузки на &homePageLink;, вы автоматически загрузите наиболее подходящую для вашей системы версию Instantbird. Если вы хотите сами выбрать свой язык и свою операционную систему, вам следует перейти на &downloadPageLink;.
homePageLink=домашней странице
downloadPageLink=страницу загрузки

installasuserTitle=Могу ли я установить Instantbird, не будучи администратором на своем компьютере?
installasuserText=Да!

sideinstallTitle=Могу ли я установить Instantbird и сохранить мой предыдущий клиент обмена сообщениями на моем компьютере?
sideinstallText=Да! Instantbird и другие клиенты могут быть установлены на одном компьютере. Это не вызовет никаких проблем.

installwindowsTitle=Как мне установить Instantbird на Windows?
installwindowsText=Для ОС Windows Instantbird представлен в виде исполняемого файла инсталлятора. Просто запустите загруженный вами файл и мастер установки проведёт вас через процесс установки.

installmacTitle=Как мне установить Instantbird на Mac OS X?
installmacText=Дважды щёлкните по скачанному вами образу диска Instantbird (файл с именем, заканчивающимся на ".dmg"). Затем перетащите значок Instantbird в папку Applications.

installlinuxTitle=Как мне установить Instantbird на Linux?
installlinuxText1=Извлеките содержимое загруженного архива и запустите файл с именем "instantbird". Если появится всплывающее диалоговое окно, спрашивающее вас, хотите ли вы изменить или запустить этот файл, выберите "запустить".
installlinuxText2=В настоящее время мы предоставляем только 32-битные сборки. Для того, чтобы запустить их на 64-битной системе, вам необходимо установить 32-битные библиотеки совместимости, предоставляемые вашим дистрибутивом. Например, в Ubuntu, установите пакет <code>ia32-libs</code>, выполнив в эмуляторе терминала команду <code>sudo apt-get install ia32-libs</code>.

portableTitle=Является ли Instantbird портативным (можно ли его запускать с USB-флэшки)?
portableText1=Если вы запустите Instantbird с USB-флэшки, то он, по умолчанию, сохранит ваш профиль пользователя на жестком диске.
# Do NOT translate '-profile' here, it's a command line parameter.
portableText2=Вы можете попросить Instantbird сохранить ваш профиль пользователя на USB-флэшке, использовав для этого параметр командной строки <code>-profile</code>.
portableText3=Для этого щёлкните правой кнопкой мыши по файлу <code>instantbird.exe</code> и выберите "Создать ярлык". Затем, в свойствах ярлыка отредактируйте поле объект, дописав в его конец <code> -profile ./<em>имяпапки</em></code>.


updating=Обновление

autoupdateTitle=Нужно ли мне что-либо делать, чтобы всегда использовать последнюю версию Instantbird?
autoupdateText1=Нет. По умолчанию Instantbird будет периодически проверять наличие обновлений и, если будет найдена новая версия, запрашивать у вас разрешение на установку обновления.
autoupdateText2=Если вам это не нравится, вы можете изменить его поведение в отношении проверки обновлений в диалоговом окне настроек.

forceupdateTitle=Что если я хочу произвести обновление прямо сейчас?
forceupdateText=Вы можете использовать пункт <em>Проверить наличие обновлений</em> (расположенный в меню <em>Справка</em>), чтобы не ждать запроса на обновление, если вы знаете, что оно существует.

overwriteTitle=Могу ли я установить новую версию поверх уже существующей?
overwriteText=Да.

addonsafterupdateTitle=Будут ли работать мои дополнения после обновления?
addonsafterupdateText1=Совместимые дополнения продолжат свою работу после обновления. Если дополнение не совместимо с обновленной версией Instantbird, то Instantbird предложит проверить, не появилась ли новая версия дополнения, и обновить его.
addonsafterupdateText2=Если дополнение больше не работает после обновления, то вы можете связаться с его автором, чтобы узнать, не планируется ли выпустить обновленную версию дополнения.


uninstalling=Удаление

removeTitle=Как мне удалить Instantbird?
removeText1=Если вы использовали программу установки в Windows, то вы можете удалить Instantbird через панель управления, так же, как вы удаляете любое другое приложение.
removeText2=В других случаях вы можете просто удалить папку Instantbird.
removeText3=Удаление Instantbird не приведёт к удалению ваших учётных записей, истории чатов, расширений или других дополнений. Эти данные хранятся в вашей &profileFolderLink;.
profileFolderLink=папке профиля
removeText4=Любая версия Instantbird, установленная вами после удаления Instantbird, продолжит использовать данные из этой папки.

using=Использование
severalaccountsTitle=Могу ли я использовать одновременно несколько учётных записей?
severalaccountsText1=Да, вы можете подключиться сразу к нескольким учётным записям, используя любой из поддерживаемых протоколов.
severalaccountsText2=Для добавления ещё одной учётной записи откройте меню <em>Инструменты</em> и выберите пункт <em>Учётные записи</em>.

supportedprotocolsTitle=Какие протоколы поддерживаются?
supportedprotocolsText3=В настоящее время Instantbird  поддерживает по умолчанию: AIM, Bonjour, Facebook Chat, Gadu-Gadu, Google Talk, Groupwise, ICQ, IRC, MSN, MySpaceIM, Netsoul, QQ, Simple, Twitter, XMPP, Yahoo, Yahoo JAPAN, ВКонтакте и Одноклассники.
supportedprotocolsText2=Плагины для добавления дополнительных протоколов могут быть установлены через &addonsLink;.
addonsLink=дополнения

facebookusernameTitle=Когда я пытаюсь подключиться к своей учетной записи Facebook, я получаю сообщение об ошибке <code>Неверный XMPP ID</code>. В чём проблема?
facebookusernameText=Вы ввели в качестве имени пользователя адрес электронной почты, который вы используете для входа на сайт Facebook. Чат Facebook ожидает, что вы введёте в это поле ваше уникальное имя пользователя. Чтобы узнать его, перейдите по адресу &facebookLink;.

facebookauthorizationTitle=Когда я пытаюсь подключиться к своей учетной записи Facebook, я получаю сообщение об ошибке <code>Не авторизован</code>. В чём проблема?
facebookauthorizationText=Вам необходимо включить XMPP-соединения в вашей учетной записи Facebook.
facebookauthorizationText1=Для включения доступа через XMPP, войдите в вашу учетную запись Facebook и перейдите по адресу &facebookChatLink;.
facebookChatLink=Чат Facebook
facebookauthorizationText2=Выйдите из вашей учетной записи на веб-сайте Facebook.
facebookauthorizationText3=Снова войдите в вашу учетную запись на веб-сайте Facebook.
facebookauthorizationText4=Подключите вашу учетную запись в Facebook в Instantbird (откройте меню "Инструменты", выберите пункт "Учетные записи" и нажмите на кнопку "Включить" в вашей учетной записи Facebook), и Instantbird должен успешно соединиться с Facebook.

getaddonsTitle=Где я могу получить дополнения (расширения и темы)?
getaddonsText=Вы можете произвести поиск дополнений через вкладку <em>Получить дополнения</em> окна управления дополнениями (которое можно открыть из меню <em>Инструменты</em>), где вы увидите некоторые из рекомендуемых дополнений. Ещё больше дополнений можно найти на &addonsWebsiteLink;, где вы также можете найти экспериментальные дополнения и оставить свои отзывы.
addonsWebsiteLink=веб-сайте дополнений Instantbird

logsenabledTitle=Ведёт ли Instantbird логи моих разговоров и чатов?
logsenabledText=Да, по умолчанию Instantbird сохраняет логи в файлах. Для отключения или включения ведения логов используйте настройки на панели <em>Приватность</em> в диалоговом окне <em>Настройки</em>. Если вы хотите посмотреть сами файлы, нажмите на кнопку <em>Открыть архив...</em> на той же панели.

logfolderTitle=Где хранятся логи?
logfolderText=Имя файла журнала и путь к нему строятся по следующему принципу: <code><em>&profileLink;</em>/logs/<em>protocol</em>/<em>имя приятеля или чата</em><em>дата и время</em>.txt</code> (замените части выделенные курсивом на реальные значения).
profileLink=путь к профилю

profilefolderTitle=Где расположена моя папка профиля?
profilefolderText1=Она расположена в одной из следующих папок в зависимости от вашей операционной системы:
profilefolderTextCopyAndPaste=ничего не меняя, скопируйте и вставьте это в Windows Explorer
profilefolderTextReuse=Любая версия Instantbird, установленная вами после удаления Instantbird, продолжит использовать данные из этой папки профиля.

aboutconfigTitle=Могу ли я получить доступ к about:config, чтобы подстроить некоторые настройки?
aboutconfigText=Хотя мы не рекомендуем делать это, вы можете открыть about:config из вкладки <em>Дополнительные</em> диалогового окна настроек.


development=Разработка

whyTitle=Почему вы делаете Instantbird?
whyText=Мы предлагаем вам Instantbird, потому что &weBelieveLink;.
weBelieveLink=мы верим, что обмен мгновенными сообщениями является важной частью вашей жизни в Интернете

licenseTitle=На условиях какой лицензии распространяется Instantbird?
licenseText1=Instantbird лицензирован для вас на условиях лицензии GNU GPL версии 2.0 или более поздней (потому что он использует libpurple, лицензированный под GPL). Тем не менее, большая часть исходного кода лицензирована также на условиях публичной лицензии Mozilla (MPL) версии 2.0.

getthesourceTitle=Откуда можно загрузить исходный код?
getthesourceText=Если вы хотите загрузить архив исходного кода (для любой из выпущенных версий) в формате tarball, вам следует перейти на &downloadPageLink;. Последнюю версию разрабатываемого кода можно получить из нашего репозитория кода Mercurial, следуя &buildInstructionsLink;.
buildInstructionsLink=инструкциям по сборке

teamTitle=Кто разрабатывает Instantbird?
teamText=Мы являемся &teamLink; высокомотивированных индивидуумов, но мы надеемся, что множество других людей, включая вас, присоединятся к нам, чтобы сделать этот проект ещё лучше.
teamLink=небольшой командой

mozillaTitle=Является ли Mozilla спонсором проекта?
mozillaText1=Mozilla foundation не является нашим финансовым спонсором.
mozillaText2=Логотип "Powered by Mozilla" на нашей главной странице означает, что Instantbird использует код и технологии, разработанные сообществом Mozilla. Мы очень благодарны всему сообществу Mozilla за удивительные технологии, на которых основан Instantbird.

getinvolvedTitle=Как я могу принять участие в проекте?
getinvolvedText=Есть несколько путей для принятия участия в проекте. Чтобы помочь нам, вам не нужно быть программистом. Для получения более подробной информации, прочтите страницу &getInvolvedLink;.
getInvolvedLink=Как принять участие

translateTitle=Могу ли я помочь в переводе на мой язык?
translateText=Да! Для получения более подробной информации, прочтите &translationWikiPageLink;.
translationWikiPageLink=страницу в вики, посвященную переводу

createaddonsTitle=Как я могу создавать дополнения?
createaddonsText=Прочтите &extensionsWikiPageLink;.
extensionsWikiPageLink=страницу в вики, посвященную расширениям

fxaddonsTitle=Могут ли дополнения для Firefox/Thunderbird работать в Instantbird?
fxaddonsText="Из коробки" — нет, но большинство из них могут быть адаптированы. Прочтите &portingFirefoxExtensionsPageLink;.
portingFirefoxExtensionsPageLink=страницу по портированию расширений Firefox

followTitle=Как я могу следить за текущей разработкой?
followText1=Чтобы быть в курсе важных новостей, вам, вероятно, нужно следовать за &blogLink;.
blogLink=нашим блогом
followText2=Если вы хотите следить за нашими дискуссиями, вы можете присоединиться к нам в нашем IRC чате: &ircRoomLink;.
ircRoomLink=#instantbird на сервере irc.mozilla.org
followText3=Для тестирования только что добавленных нами функций каждый день выпускаются &nightlyBuildsLink;. Вы можете использовать их, но будьте осторожны! Они могут быть нестабильны, и, если вы решите их использовать, вы должны понимать, что мы ожидаем, что вы будете помогать нам тестировать новейшие функции, а не вести себя как ребёнок, первым получивший новую игрушку. Поэтому, если вы обнаружили ошибки, пожалуйста, &reportBugLink; (&filingABugLink;: что должно содержать сообщение об ошибке), а не жалуйтесь.
reportBugLink=сообщите о них
nightlyBuildsLink=ночные сборки
filingABugLink=Создание сообщения об ошибке

whatsnextTitle=Что ожидается в следующей версии?
whatsnextText=Прочтите &roadmapLink;.
roadmapLink=план по развитию

whenTitle=Когда выйдет следующая версия?
whenText=Нам очень нравится этот проект и мы рады, что вы разделяете наше желание как можно быстрее двигаться вперед. Однако, в связи с природой разработки программного обеспечения, назначение точной даты выпуска новой версии может быть проблематичным, к тому же мы ставим обеспечение качества выше выпуска новой версии к определенной дате.

futurefeaturesTitle=Будет ли Instantbird поддерживает передачу файлов/видео-чат/<em>вставьте сюда вашу любимую функцию</em>?
futurefeaturesText1=Прочтите &roadmapLink;.
futurefeaturesText2=Вы можете всегда обсудить с нами не перечисленные там функции, если хотите узнать, заинтересованы ли мы в их реализации или могут ли они быть реализованы в виде дополнений.
