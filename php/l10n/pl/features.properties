allYourFriendsDesc1=Korzystając z Instantbirda możesz rozmawiać ze wszystkimi znajomymi przez jedną aplikację!
allYourFriendsDesc2=Wspierane są sieci takie jak Gadu-Gadu, AIM, Yahoo, MSN, Google Talk, Facebook oraz nawet Twitter!
allYourFriendsTitle=Rozmawiaj ze wszystkimi znajomymi
alwaysHereForYouDesc1=Instantbird będzie działał na każdym komputerze, niezależnie czy jest na systemie Windows, Mac OS X lub Linux.
alwaysHereForYouDesc2=Będąc projektem Open-Source, nigdy nie będziesz zmuszony do zapłaty za korzystanie z niego.
alwaysHereForYouDesc3=Nigdy nie będziesz musiał uczyć się korzystać z innego komunikatora!
alwaysHereForYouTitle=Zawsze dla ciebie
awesomenessToMakeIMBetterForYou=Łączy w sobie wszystkie niesamowite możliwości, w celu ulepszenia jakości komunikacji ze znajomymi.
conversationsInTabsDesc1=Rozmowy pogrupowane są w kartach, dzięki czemu twoja przestrzeń nigdy nie będzie zapchana wyskakującymi oknami.
conversationsInTabsDesc2=Karty są łatwe w użyciu: możesz przeciągać je w celu zmiany porządku wyświetlania, lub przenieść rozmowę do nowego okna.
conversationsInTabsTitle=Rozmowy w kartach
customizableConversationsDesc1=Dzięki kilku starannie zaprojektowanych stylach wiadomości dostępnych domyślnie w programie oraz wieloma dostępnymi jako dodatki, masz wszystko aby twoje rozmowy były osobiste.
customizableConversationsDesc2=Zamieńmy je w kolorowe i wspaniałe doświadczenie!
customizableConversationsTitle=Dostosowania rozmów
instantbirdFeatures=Funkcje programu Instantbird
keyFeaturesNotesPageTitleSuffix=kluczowe cechy
limitlessExtensibilityDesc1=Zaawansowane narzędzia jak bezpośrednia wyszukiwarka czy lupa są wbudowane w aplikację, aby pomóc ci w pełni korzystać z rozmowy.
limitlessExtensibilityDesc2=Więcej możliwości możesz uzyskać korzystając z dodatków, dzięki nieograniczonym możliwościom rozszerzania programu Instantbird!
limitlessExtensibilityTitle=Nieograniczone możliwości rozszerzania
smartContactsDesc1=Masz kilka dróg kontaktu z tą samą osobą?
smartContactsDesc2=Żaden problem, po prostu przenieś jeden kontakt na drugi, a Instantbird będzie wiedział, że to ta sama osoba.
smartContactsTitle=Zgrabne kontakty
troubleFreeDesc1=Instantbird został zaprojektowany z myślą o stabilność i prostocie.
troubleFreeDesc2=Będziesz cieszyć się z czystego, bezproblemowego, interfejsu użytkownika: nic nie będzie rozpraszało cię podczas rozmowy!
troubleFreeDesc3=Brak reklam, przez co nie będziesz denerwować się niepożądanymi treściami.
troubleFreeTitle=Bezproblemowy