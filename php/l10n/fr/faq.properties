faqPageTitleSuffix=Foire Aux Questions
faq=Foire Aux Questions
summary=Résumé

installing=Installation

useexistingaccountsTitle=Est-ce qu'il faudra que je fournisse de nouvelles coordonnées à mes amis ?
useexistingaccountsText=Non, avec Instantbird vous pouvez utiliser tous vos comptes de messagerie instantanée existants avec une seule application. Si vous utilisez déjà la messagerie instantanée, vous n'aurez pas à créer de nouveau compte pour commencer à utiliser Instantbird.

systreqTitle=Est-ce qu'Instantbird fonctionnera sur mon ordinateur ?
systreqText=Instantbird supporte actuellement &sysReqWinVersion; ou ultérieur, &sysReqMacVersion; ou ultérieur, et Linux. Voir la &systemRequirementsLink; pour plus de détails.
systemRequirementsLink=configuration minimale requise

getlatestTitle=Que devrais-je télécharger pour obtenir la dernière version d'Instantbird ?
getlatestText=Un lien de téléchargement sur la &homePageLink; choisira automatiquement pour vous la version d'Instantbird qui semble la plus adaptée à votre système. Si vous voulez sélectionner manuellement votre système d'exploitation et votre langue, rendez-vous sur la &downloadPageLink;.
homePageLink=page d'accueil
downloadPageLink=page des téléchargements

installasuserTitle=Est-ce que je peux installer Instantbird sans être administrateur sur mon ordinateur ?
installasuserText=Absolument !

sideinstallTitle=Est-ce que je peux installer Instantbird et garder mon client de messagerie instantanée précédent sur mon ordinateur ?
sideinstallText=Absolument ! Instantbird et les autres clients de messagerie instantanée peuvent coexister sur le même ordinateur sans poser de problèmes.

installwindowsTitle=Comment faire pour installer Instantbird sous Windows ?
installwindowsText=Instantbird pour Windows est livré sous forme d'installeur exécutable. Lancez simplement le ficher que vous aurez téléchargé, et laissez-le vous guider à travers le processus d'installation.

installmacTitle=Comment faire pour installer Instantbird sous Mac OS X ?
installmacText=Double-cliquez sur l'image disque Instantbird (un fichier dont le nom se termine en « .dmg ») que vous aurez téléchargé. Faites ensuite glisser l'icône d'Instantbird dans le dossier « Applications. »

installlinuxTitle=Comment faire pour installer Instantbird sous Linux ?
installlinuxText=Extrayez le contenu de l'archive téléchargée, puis lancez le fichier nommé « instantbird. » Si une boîte de dialogue vous demandant si vous voulez éditer ou exécuter le ficher apparaît, sélectionnez « exécuter. »

portableTitle=Instantbird est-il portable (utilisable à partir d'une clé USB ?)
portableText1=Si vous lancez Instantbird à partir d'une clé USB, il enregistrera votre profil d'utilisateur sur le disque dur par défaut.
# Do NOT translate '-profile' here, it's a command line parameter.
portableText2=Vous pouvez dire à Instantbird d'enregistrer votre profil d'utilisateur sur la clé USB en utilisant l'argument <code>-profile</code> sur la ligne de commande.
portableText3=Pour ce faire, faites un clic droit sur le fichier <code>instantbird.exe</code> et sélectionnez « Créer un Raccourci, » puis dans les propriétés du raccourci, éditez la cible et ajoutez-y <code> -profile ./<em>nom du dossier</em></code>


updating=Mises à jour

autoupdateTitle=Que dois-je faire pour continuer d'utiliser la dernière version d'Instantbird ?
autoupdateText1=Rien. Par défaut, Instantbird recherchera automatiquement des mises à jour et demandera votre permission de se mettre à jour si une nouvelle version est trouvée.
autoupdateText2=Si cela ne vous plaît pas, vous pouvez le changer dans la fenêtre de préférences.

forceupdateTitle=Et si je veux mettre à jour tout de suite ?
forceupdateText=Il y a une option <em>Rechercher des mises à jour</em> dans le menu (accessible à partir du menu <em>Aide</em>) pour que vous n'ayez pas à attendre le message de mise à jour si vous savez qu'une mise à jour existe.

overwriteTitle=Est-ce que je peux remplacer une version existante avec une version plus récente ?
overwriteText=Oui.

addonsafterupdateTitle=Mes modules complémentaires fonctionneront-ils encore après une mise à jour ?
addonsafterupdateText1=Les modules compatibles fonctionneront toujours après une mise à jour. Si un module complémentaire n'est pas compatible avec la nouvelle version d'Instantbird, celui-ci vous proposera de rechercher une version plus récente du module et de le mettre à jour.
addonsafterupdateText2=Si votre module complémentaire ne fonctionne plus après une mise à jour, vous pouvez en contacter l'auteur afin de savoir si une mise à jour est prévue.


uninstalling=Désinstallation

removeTitle=Comment désinstaller Instantbird ?
removeText1=Sous Windows, si vous avez utilisé l'installeur, vous pouvez désinstaller Instantbird à partir du panneau de configuration, tout comme n'importe quelle autre application.
removeText2=Dans certains cas, vous pouvez simplement supprimer le dossier Instantbird.
removeText3=La désinstallation d'Instantbird ne supprimera pas vos comptes, historiques, extensions ou autres modules complémentaires. Ces données sont stockées dans votre &profileFolderLink;.
profileFolderLink=dossier de profil
removeText4=Toute version d'Instantbird installée après la suppression d'Instantbird continuera d'utiliser les données dans ce dossier.

using=Utilisation
severalaccountsTitle=Est-ce que je peux utiliser plusieurs comptes à la fois ?
severalaccountsText1=Oui, vous pouvez être connecté à plusieurs comptes sur tous les protocoles supportés à la fois.
severalaccountsText2=Utilisez le <em>gestionnaire des comptes</em> (accessible à partir du menu <em>Outils</em>) pour ajouter un autre compte.

supportedprotocolsTitle=Quels sont les protocoles supportés ?
supportedprotocolsText1=Actuellement, Instantbird supporte les protocoles suivants par défaut : AIM, Facebook Chat, Gadu-Gadu, Google Talk, Groupwise, ICQ, IRC, MSN, MySpaceIM, Netsoul, QQ, Simple, Twitter, XMPP, Yahoo et Yahoo JAPAN.
supportedprotocolsText2=Des protocoles supplémentaires peuvent être installés comme &addonsLink;.
addonsLink=modules complémentaires

facebookusernameTitle=Quand j'essaie de me connecter à mon compte Facebook, je reçois le message d'erreur <code>Identifiant XMPP non valide</code>. Quel est le problème ?
facebookusernameText=Vous avez entré comme nom d'utilisateur l'adresse e-mail que vous utilisez pour vous enregistrer sur le site de Facebook. Facebook chat s'attend à ce que vous utilisiez votre nom d'utilisateur unique dans ce champ. Vous pourrez le trouver sur &facebookLink;.

facebookauthorizationTitle=Quand j'essaie de connecter mon compte Facebook, je reçois le message d'erreur <code>Non Autorisé</code>. Quel est le problème ?
facebookauthorizationText=Vous devez activer les connexions XMPP à votre compte Facebook.
facebookauthorizationText1=Visitez &facebookChatLink; en étant connecté à votre compte Facebook pour activer l'accès XMPP.
facebookChatLink=Facebook Chat
facebookauthorizationText2=Fermez votre session sur le site de Facebook.
facebookauthorizationText3=Rouvrez votre session sur le site de Facebook.
facebookauthorizationText4=Connectez votre compte Facebook dans Instantbird (« Outils » > « Comptes » et cliquez sur le bouton « connecter » de votre compte Facebook) et la connexion devrait alors s'établir avec succès.

getaddonsTitle=Où est-ce que je peux trouver des modules complémentaires (extensions et thèmes ?)
getaddonsText=Vous pouvez rechercher des modules complémentaires à partir de l'onglet <em>Obtenir des modules complémentaires</em> du gestionnaire de modules complémentaires (accessible à partir du menu <em>Outils</em>) où vous trouverez quelques modules recommandés. Pour plus de modules, vous pouvez vous rendre sur &addonsWebsiteLink;, où vous pourrez également trouver des modules complémentaires expérimentaux et écrire des critiques.
addonsWebsiteLink=le site des modules complémentaires d'Instantbird

logsenabledTitle=Est-ce qu'Instantbird conserve un historique de mes conversations ?
logsenabledText=Oui, Instantbird crée des fichiers d'historique par défaut. Utilisez les options dans l'onglet <em>vie privée</em> dans le menu <em>Préférences</em> afin de les configurer à votre goût. Si vous voulez jeter un œil aux fichiers, vous pouvez utiliser le bouton <em>ouvrir le dossier...</em> dans le même onglet.

logfolderTitle=Où sont les historiques conservés ?
logfolderText=Le nom et chemin des fichiers d'historiques sont comme suit : <code><em>&profileLink;</em>/logs/<em>protocole</em>/<em>contact ou nom d'utilisateur</em>/<em>date et heure</em>.txt</code> (remplacez les parties en italique avec les valeurs correspondantes).
profileLink=chemin du profil

profilefolderTitle=Où est mon dossier de profil ?
profilefolderText1=Il se trouve à l'un des endroits suivants, selon votre système d'exploitation :
profilefolderTextCopyAndPaste=copiez et collez ceci exactement dans le navigateur de fichiers de Windows
profilefolderTextReuse=Toute version d'Instantbird installée après avoir supprimé Instantbird continuera d'utiliser les donnés contenues dans ce dossier de profil.

aboutconfigTitle=Est-ce que je peux accéder about:config pour ajuster certaines option?
aboutconfigText=Bien que nous en décourageons l'usage, about:config est disponible à partir de l'onglet <em>Avancé</em> de la fenêtre de préférences.


development=Développement

whyTitle=Pourquoi faites-vous Instantbird ?
whyText=Nous vous offrons Instantbird parce que &weBelieveLink;.
weBelieveLink=nous croyons que la messagerie instantanée est une partie importante de votre vie en ligne

licenseTitle=Quelle est la licence utilisée par Instantbird ?
licenseText=Vous pouvez utiliser Instantbird selon les termes de la Licence publique générale GNU version 2.0 ou ultérieure (parce qu'il utilise libpurple, qui utilise la licence GPL). Toutefois, une majeure partie du code source utilise également la licence triple de Mozilla (MPL 1.1/GPL 2.0/LGPL 2.1).

getthesourceTitle=Où se trouve le code source ?
getthesourceText=Un tarball du code source de chaque version publiée est disponible à partir de la &downloadPageLink;. Le code de développement le plus récent peut s'obtenir à partir de notre dépôt Mercurial en suivant les &buildInstructionsLink;.
buildInstructionsLink=instructions de compilation

teamTitle=Qui fait Instantbird ?
teamText=Nous sommes &teamLink; d'individus très motivés, mais nous espérons que beaucoup de gens, vous y compris, nous joindront pour améliorer davantage ce projet.
teamLink=une petite équipe

mozillaTitle=Est-ce que Mozilla parraine le projet ?
mozillaText1=La fondation Mozilla ne nous a pas aidés financièrement.
mozillaText2=Le logo « Propulsé par Mozilla » sur notre page d'accueil signifie qu'Instantbird se sert de code et de technologies développés par la communauté Mozilla. Nous sommes très reconnaissants envers la communauté Mozilla en général pour les technologies extraordinaires sur lesquelles Instantbird se base.

getinvolvedTitle=Comment puis-je participer ?
getinvolvedText=Il y a plusieurs façons de participer au projet. Vous n'avez pas besoin d'être un programmeur pour nous aider. Voir &getInvolvedLink;.
getInvolvedLink=nous aider

translateTitle=Est-ce que je peux vous aider à traduire dans ma langue ?
translateText=Oui ! Voir la &translationWikiPageLink; pour plus de détails.
translationWikiPageLink=page de wiki à propos de la traduction

createaddonsTitle=Comment faire pour créer des modules complémentaires ?
createaddonsText=Voir la &extensionsWikiPageLink;.
extensionsWikiPageLink=page de wiki à propos des extensions

fxaddonsTitle=Est-ce que les modules complémentaires pour Firefox/Thunderbird peuvent fonctionner sur Instantbird ?
fxaddonsText=Pas en tant que tel, mais la plupart peuvent être adaptés. Voir la &portingFirefoxExtensionsPageLink;.
portingFirefoxExtensionsPageLink=page sur le port d'extensions Firefox

followTitle=Comment puis-je suivre les travaux de développement ?
followText1=Pour être informé des nouvelles importantes, vous pouvez suivre &blogLink;.
blogLink=notre blog
followText2=Si vous désirez suivre nos discussions, n'hésitez pas à nous joindre sur notre salon de discussion IRC : &ircRoomLink;.
ircRoomLink=#instantbird sur le serveur irc.mozilla.org
followText3=Les &nightlyBuildsLink; sont produites chaque jour afin que les utilisateurs puissent nous aider à tester les fonctionnalités qui viennent d'être ajoutées. N'hésitez pas à les utiliser, mais faites attention ! Il se peut qu'elles ne soient pas stables, et si vous décidez de les utiliser, c'est pour nous aider à tester les nouvelles fonctionnalités, et non pas simplement pour vous vanter d'être le premier à avoir un nouveau jouet. Alors si vous y trouvez des bugs, veuillez &reportBugLink; (&filingABugLink; : ce qu'un rapport de bug devrait contenir) au lieu de vous plaindre.
reportBugLink=les rapporter
nightlyBuildsLink=versions quotidiennes
filingABugLink=rapporter un bug

whatsnextTitle=Qu'est-ce qui sera dans la prochaine version ?
whatsnextText=Voir le &roadmapLink;.
roadmapLink=plan d'action

whenTitle=Quand-est-ce que la prochaine version majeure sortira ?
whenText=Nous sommes très enthousiastes à propos de ce projet, et heureux que vous partagiez notre désir d'avancer aussi vite que possible. Toutefois, étant donnée la nature du développement de logiciels, il pourrait poser problème d'annoncer des délais, et nous pensons que le maintien de la qualité est plus important.

futurefeaturesTitle=Est-ce qu'Instantbird supportera le transfert de fichiers/la visioconférence/<em>insérer votre fonctionnalité favorite ici</em> ?
futurefeaturesText1=Voir le &roadmapLink;.
futurefeaturesText2=N'hésitez pas à nous parler de choses qui ne sont pas listées afin de savoir si nous sommes intéressés ou si les fonctionnalités en question peuvent être implémentées en tant que modules complémentaires.
