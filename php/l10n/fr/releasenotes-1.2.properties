whatsNew=Quoi de neuf ?

logViewer=Le <strong>visionneur d'historique</strong> montre désormais les conversations telles qu'elles apparaissent dans leur fenêtre de discussion, grâce à un nouveau format de fichiers d'historique basé sur JSON qui enregistre des métadonnées avec le texte de la conversation.
bonjour=<strong>Bonjour</strong> est désormais supporté (requiert les &bonjourPrintServicesLink; sur Windows or &avahiLink; sur Linux).
bonjourPrintServicesLink=Services d’impression Bonjour

mucInterface=L'interface des <strong>salons de discussion</strong> a été améliorée :
tabComplete=<strong>Meilleur complètement avec la touche Tab</strong>, voir l'&tabCompleteBlogPostLink; pour plus de détails.
tabCompleteBlogPostLink=article sur notre blog
activeNicks=Il est plus facile de voir qui est actif, du fait que seuls les pseudos ds participants qui ont parlé sont colorés dans la liste des participants.

ircEnhancements=Améliorations d'IRC :
channelsReconnect=Les canaux sont automatiquement rejoints après les reconnexions.
ircStatus=Instatbird suit le statut des contacts IRC de manière plus précise en utilisant les commandes WATCH et MONITOR, si elles sont supportées.
ircChanServ=Les messages de ChanServ sont montrés dans le canal auquel ils se rapportent.
ircNickServ=Plus de messages bruyant de NickServ qui vous interrompent après une identification automatique à la suite de la connexion.

encryptedPasswords=Les mots de passe sont désormais enregistrés dans le gestionnaire de mots de passe de Mozilla pour plus de sécurité. Tout comme dans Firefox, il est possible de les protéger en utilisant un mot de passe principal.
popularAccounts=Créez de nouveaux comptes plus facilement maintenant que l'assistant de création de compte offre une liste des réseaux les plus populaires, avec l'option de montrer tous les réseaux supportés.
systemTrayStatus=Meilleure intégration dans la <strong>barre des tâches</strong> : vous pouvez désormais changer votre statut directement à partir du menu contextuel de l'icône de la barre des tâches.
lastReadMarker=Reprenez facilement vos conversations là où vous les avez laissées : la position du premier message non lu est marquée visuellement (et vous pouvez y accéder rapidement en pressant Alt-PgPrec/PgSuiv ou avec un glissement de doigts).
conversationRestore=Lorsqu'une longue conversation est restaurée, une barre de progrès s'affichera désormais au lieu de bloquer l'interface jusqu'à ce que tous les messages soient chargés..
contextMessages=Les messages déjà lus (ou « de contexte » sont maintenant différenciés des nouveaux messages (lorsque la conversation est restaurée après avoir été mise en attente) dans tous les styles de messages fournis par défaut. Aussi, ces styles respectent désormais les réglages de police définis dans Préférences > Contenu.
keyboardNavigation=La navigation avec le clavier a été améliorée en permettant le défilement à partir d'une boîte de texte (vide) : utilisez simplement les touches fléchées, Page Précédente/Suivante, ou Début/Fin ! Il y a également de nouveaux raccourcis pour mettre une discussion en attente (Échap) et pour afficher l'historique (Ctrl+Shift+H, comme pour afficher l'historique sur Firefox).
accessibilityImprovements=De majeures améliorations d' l'<strong>accessibilité</strong> ont été apportées aux nouveaus messages, aux groupes de contacts, et aux contacts.

addonDevelopers=Pour les développeurs de modules complémentaires :
soundPreferences=Contrôle plus précis des préférences de son : par exemple &advancedSoundControlsLink;.
advancedSoundControlsLink=Advanced Sound Controls
reorderContacts=Possibilité de réarranger la liste de contacts : par exemple &sortByStatusLink;.
sortByStatusLink=Sort By Status
addNewProtocols=Il est maintenant possible d'ajouter de nouveaux protocoles en utilisant JavaScript : par exemple &vznetChatsLink;.
vznetChatsLink=VZnet Chats

underTheHood=Sous le capot
extensibleProtocols=Nous avons désormais nos propres implémentations extensibles en JavaScript pour :
facebookAndGoogleProtocols=<strong>Facebook Chat</strong> et <strong>Google Talk</strong>, basés sur notre propre plugin de protocole <strong>XMPP</strong> (de Google Summer of Code 2011).
ircProtocol=IRC
basedOnLibpurpleAndMozilla=<strong>Mises à jour :</strong> Instantbird &versionNumber; est basé sur Mozilla &mozillaVersion; qui apporte de &newPossibilitiesForAddonsDevelopersLink; et utilise libpurple &libpurpleVersion;.
newPossibilitiesForAddonsDevelopersLink=nouvelles possibilités pour les développeurs de modules complémentaires
mplLicense=La licence pour la majorité du code a été mise à jour vers la &mplLink;, les compilations officielles d'Instantbird &versionNumber; sont distribuées en accord avec les termes de la &gplLink;.
mplLink=Mozilla Public License (MPL) 2.0
gplLink=Licence publique générale GNU 2.0 ou ultérieure
libqq=Nous utilisons désormais libqq-pidgin pour <strong>QQ</strong> étant donné que QQ n'est plus inclut dans libpurple.
platformChanges=Des changements de plate-forme nous ont forcés à cesser le support de Windows 2000 et Windows XP jusqu'au Service Pack 2. Veuillez passer à Windows XP SP2 ou à une version ultérieure.

andMore=Et plus… Lisez le &changeLogLink; complet pour plus de détails à propos des &codeChangesCount; changements de code depuis Instantbird 1.1.
changeLogLink=ChangeLog

knownIssues=Problème connus
freenodeSSL=Problèmes de reconnexion SSL sur freenode (&bug1100Link;).
bug1100Link=bug 1100
selfSignedCerts=Gestion des certificats auto-signés et invalides (&bug1292Link;).
bug1292Link=bug 1292
