whatsNew=Quoi de neuf ?

conversationsCanBePutOnHold=Les discussions peuvent désormais être mises en attente :
putOnHoldFromContextMenu=Une discussion peut être mise en attente à partir du menu contextuel de l'onglet de la discussion. Les discussions en attente sont listées en haut de la fenêtre des contacts, où il est facile de les rouvrir avec un double clic.
noMoreMissedMessages=La fermeture d'un onglet de conversation ne peut plus vous faire manquer des messages : lorsque l'onglet d'une discussion avec des messages non lus est fermé, la discussion est automatiquement mise en attente au lieu d'être fermée.
closingChatPutsOnHold=La fermeture d'un onglet de salon de discussion vous permettra de mettre sa discussion en attente au lieu de la quitter.
newMessageReopens=Si un nouveau message arrive dans une discussion en attente, son onglet réapparaîtra automatiquement. (Pour les salons de discussion, ceci ne se produira que si votre pseudo est mentionné.)
unreadCount=Le nombre de messages non lus dans chaque discussion en attente est clairement indiqué, ce qui sera utile pour les salons IRC sur lesquels vous n'êtes pas actif !

improvedTraySupport=Support de la barre des tâches amélioré pour Linux et Windows :
singleClickRestore=Restaurez la liste de contacts avec un clic simple sous Linux.
trayIconEvenWhenNotMinimized=L'icône d'Instantbird est visible dans la barre des tâches même lorsque l'application n'est pas minimisée.

improvedTwitterSupport=Support de Twitter amélioré :
twitterEntities=Les entités de Twitter (@mentions, #hashtags, et liens raccourcis) sont désormais supportées.
retweetAndReply=Vous pouvez maintenant retweeter et répondre aux messages (en utilisant le menu contextuel).
followUnfollow=Vous pouvez vous abonner et vous désabonner aux twitteurs directement à partir du menu contextuel de leurs tweets.

sametimeSupport=IBM Lotus <strong>Sametime</strong> est désormais supporté, suite à la demande générale.

chatParticipantsTooltip=Les participants aux discussions ont désormais des infobulles.
whoisInfo=Les informations whois sur IRC sont obtenues et affichées automatiquement.

tabCompletion=Le complètement des pseudos IRC, des noms d'utilisateurs de Twitter, et des commandes avec la touche Tab.

interruptionsManagerAPI=La nouvelle <strong>API du gestionnaire d'interruptions</strong> permet aux développeurs de modules complémentaires de facilement réduire les nuisances :
eventsFiltered=Les événements peuvent être filtrés en fonction de leurs détails (type, source, etc.) afin de déterminer les actions qui peuvent se produire.

fixedICQSettings=Les paramètres par défaut d'ICQ ont été mis à jour pour fonctionner avec leurs nouveaux serveurs.

unknownCommandsNoLongerSent=Les commandes inconnues ne sont désormais plus envoyées dans les salons de discussion IRC/XMPP.

updated=Mises à jour
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; se est basé sur libpurple &libpurpleVersion; et Mozilla &mozillaVersion;, ce qui apporte d'intéressantes &newPossibilitiesForAddonsDevelopersLink;.
newPossibilitiesForAddonsDevelopersLink=nouvelles possibilités pour les développeurs de modules complémentaires

improvedStability=Stabilité améliorée
improvedStabilityDescription=les rapports d'incidents de la version 1.0 et des compilations nocturnes ont été pris en compte pour corriger des bugs qui causaient de fréquents plantages.

andMore=Et plus encore… lisez le &changeLogLink; complet pour plus de détails à propos des &codeChangesCount; changements de code depuis Instantbird 1.0.
changeLogLink=ChangeLog
