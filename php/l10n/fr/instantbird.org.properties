instantbirdBecause=Nous vous offrons Instantbird parce que…
weBelieveImportantComponentOnlineLife=Nous croyons que la messagerie instantanée est une partie importante de <em>votre</em> vie en ligne.
weBelieve=Nous croyons :

deservesMoreAttention=Que les logiciels de messagerie instantanées méritent plus d'attention : étant donné le temps passé chaque jour à utiliser la messagerie instantanée, il est normal de prendre quelques minutes pour choisir un logiciel qui <strong>vous correspond</strong>.
solidAlternative=Qu'il devrait y avoir <strong>une solide alternative</strong> aux logiciels de messagerie instantanée qui sont déjà populaires.
reclaimControl=Que la messagerie instantanée est une partie de votre vie dont <strong>vous pouvez reprendre le contrôle</strong>.

shouldBeEasyReliableFunEmpowering=Qu'il devrait être <strong>facile à utiliser, fiable, amusant, et vous mettre aux commandes</strong>
shouldJustWork=Il devrait <strong>simplement fonctionner</strong> ! Le but d'un logiciel de messagerie est de vous permettre de communiquer, sans vous mettre de bâtons dans les roues. Vous voulez l'utiliser, pas perdre votre temps à le combattre.
relyOnIt=La messagerie instantanée n'est plus un nouveau jouet, mais un moyen de communication viable pour des usages cruciaux ; par conséquent il devrait être <strong>très stable</strong>, pour que <strong>vous puissiez compter dessus</strong>.
customizeIt=Que vous passiez beaucoup de temps avec ou non, vous devriez pouvoir <strong>vous l'approprier</strong>. Vous avez besoin du <strong>pouvoir de le façonner</strong>, de <strong>&customizeItLink;</strong>.
customizeItLink=le personnaliser

respectTheUser=Un client de messagerie instantanée devrait <strong>respecter l'utilisateur</strong>
privacy=Vie privée
privacyText=étant donné que la messagerie instantanée implique des données intimes ou confidentielles, vous devriez pouvoir contrôler la façon dont laquelle vos données sont traitées.
freedom=Liberté
freedomText=Il ne devrait y avoir <strong>aucune surprise</strong> pendant l'utilisation. Il devrait <strong>faire exactement ce que vous voulez</strong>.

openSource=Pour s'assurer que cela soit toujours le cas, la façon dont il fonctionne devrait être <strong>ouverte, transparente</strong>. C'est pourquoi il est important qu'<strong>Instantbird soit un logiciel open-source</strong>.

shouldBeAccessibleAdapted=Un logiciel de messagerie instantanée devrait être <strong>accessible</strong>, <strong>adapté à l'utilisateur</strong>
adaptedToYourNeeds=<strong>Votre langue, niveau d'informatique, système d'exploitation, ou capacités ne devraient pas faire obstacle</strong> ; le logiciel devrait être adapté à vos besoins, plutôt que d'exiger que vous vous y adaptiez.

bringBackInnovation=L'expérience de l'utilisateur de la messagerie instantanée devrait être plaisante, mais elle a très peu évolué durant ces dernières années. Il est <strong>temps de réintroduire l'innovation</strong> ! Notre but est de livrer toutes ces convictions avec Instantbird, et nous accueillons tout commentaire de nos utilisateurs.


gettingInvolved=Participer :

joiningUs=Si vous partagez nos convictions, il y a des chances que vous vouliez nous joindre. Il y a <strong>diverses façons de participer</strong>, et certaines d'entre elles ne requièrent pas de connaissances techniques :

feedbackAndIdeas=Donnez-nous votre avis, partagez vos idées
knowHowItWorksForYou=Il est très important que nous sachions ce que vous pensez d'Instantbird, pour que nous puissions l'améliorer de façon à le rendre plus utile pour vous.
severalWaysToSendFeedback=Il y a plusieurs façons de nous faire part de votre avis, y compris : envoyer des rapports d'arrêts soudains, &filingBugsLink;, ou discuter avec nous. Si vous avez des questions, n'hésitez pas à &getInTouchWithUsLink;.
filingBugsLink=rapporter des bugs
getInTouchWithUsLink=nous contacter
comeDiscussYourIdeas=N'hésitez pas à venir discuter avec nous à propos de vos idées d'améliorations futures. Cela nous fait très plaisir. Vos idées pourraient être incluses dans une prochaine version, ou intéresser des auteurs de modules complémentaires !

spreadTheWord=Passez le message !
talkAboutIt=Parlez à vos amis, collègues et proches à propos d'Instantbird : dites-leur pourquoi vous l'aimez et pourquoi vous pensez qu'ils seraient intéressés. Aidez-les à l'installer (en particulier pour configurer leurs comptes.) Demandez-leur quelques jours plus tard s'ils l'utilisent toujours et/ou s'ils ont des problèmes. S'ils ont rencontré des problèmes, assurez-vous que nous sommes au courant (voir « Donner votre avis » ci-dessus.)

testPreReleaseVersions=Mettes les versions de test à l'épreuve
alphaBetaNightly=Nous publions des versions de alpha et bêta pour que vous puissiez nous donner votre avis à propos des nouvelles fonctionnalités. Si vous voulez suivre le développement de près, vous pouvez tester nos versions quotidiennes.
pleaseReportIssues=Veuillez rapporter tout problème rencontré.

helpOtherInstantbirdUsers=Aidez d'autres utilisateurs d'Instantbird !
answerQuestionsOnIRC=Si vous traînez sur notre salon de discussion IRC, vous verrez peut-être des questions d'autres utilisateurs qui ont besoin d'aide. N'hésitez pas à les aider, même si vous pensez que d'autres personnes ont plus de connaissances. Si vous commencez à aider quelqu'un, puis découvrez que vous ne connaissez pas la solution, pas de soucis ! D'autres personnes vous aideront !

translate=Traduisez
translateInstantbirdIntoYourLanguage=Pour nous aider à offrir Instantbird à un public plus large, vous pouvez &translateInstantbirdLink; dans votre langue.
translateInstantbirdLink=traduire Instantbird

addonDevelopment=Développement de modules complémentaires
createEditReviewAddons=&createAddonLink;, &reviewAddonsLink; et éditez des modules complémentaires et donnez aux autres la possibilité de rendre leur Instantbird encore plus adapté à leurs besoins, et ce grâce à vous.
createAddonLink=Créez
reviewAddonsLink=notez

contributeCode=Contribuez du code
weCanHelpYou=Pour ceux d'entre vous avec plus de connaissances techniques, vous pouvez nous fournir des patchs.</p><p>Vous voudrez probablement commencer par &compilingABuildYourselfLink;. Parlez-nous pendant le processus, nous pouvons vous aider à démarrer plus rapidement !
compilingABuildYourselfLink=compiler une version vous-même
