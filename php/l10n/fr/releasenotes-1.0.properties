whatsNew=Quoi de neuf ?

redesignedContactsWindow=Fenêtre de contacts rénovée :
contactMerging=Fusion de contacts
contactMergingDescription=Si vous parlez à la même personne sur plusieurs réseaux de messagerie instantanée, vous pouvez désormais combiner les noms d'utilisateur de chaque réseau de cette personne en un seul contact. Lorsque vous ouvrez une nouvelle conversation, le nom d'utilisateur qui est en ligne sera sélectionné automatiquement et la fenêtre de discussion basculera automatiquement vers le nom d'utilisateur correspondant si la personne change de réseau de messagerie instantanée.
tags=Tags
tagsDescription=Les tags seront utilisés pour remplacer les groupes dans la liste de contacts. Les tags peuvent être cachés en cliquant le « x » sur la droite de la liste de contacts, tous les contacts de cette liste seront transférés automatiquement ver le tag « Autres Contacts, » qui est affiché en bas de la liste de contacts
contactsWindowCanNowBe=La liste de contacts peut désormais être…
closedOnMac=fermée sur Mac sans quitter Instantbird ; elle peut être réouverte à partir du Dock.
minimizedToTrayOnWindowsAndLinux=<strong>minimisée</strong> sous Windows et Linux. Par défaut fermer (cliquer sur le « x ») la liste de contacts la minimisera dans la barre des tâches, ce qui peut être changé dans les préférences.
buddyIcon=Les utilisateurs peuvent désormais changer leur <strong>icône de contact</strong> ainsi que le <strong>nom à afficher</strong> de leurs comptes directement à partir de la liste de contacts.
contactListSorted=<strong>La liste de contacts est rangée</strong> par ordre alphabétique (les groupes et les contacts sont rangés.)
nicerAnimations=Meilleures animations.

twitterSupport=Support de Twitter
twitterSupportDescription=Lorsque le compte Twitter est connecté, une conversation s'ouvre automatiquement pour l'historique. Si la conversation est fermée par l'utilisateur, elle est rouverte automatiquement lorsqu'un nouveau message est reçu. L'utilisateur devrait déconnecter le compte à partir du gestionnaire des comptes afin d'éviter que les nouveaux messages soient affichés.<br />Il y a une option avancée de « suivi » vous permettant de spécifier des mots-clés à suivre. C'est une liste de mots-clés séparés par des virgules. Les virgules signifient OU, une espace à l'intérieur d'un mot-clé signifie ET.

topConversationUI=Nouvelle <strong>barre d'outils d'information en haut de l'interface de conversations</strong>, montrant l'icône du contact, le nom à afficher et le statut actuel de votre contact. De plus, vous pouvez changer le réseau de messagerie instantanée utilisé pour la conversation en cliquant sur l'icône de protocole.
updatedTabStyling=Le <strong>style des onglets</strong> de conversations a été <strong>mis à jour</strong> pour correspondre à celui de Firefox 4, et les utilisateurs de versions récentes de Windows apprécieront des <strong>effets de verre Aero</strong>.
timeBubbles=Bubbles, le thème de messages par défaut, a reçu de nouvelles caractéristiques relatives au temps, voir notre &blogPostLink; pour plus de détails.
blogPostLink=article de blog

jumplist=(Windows 7 uniquement) <strong>Support de la jumplist</strong> pour changer de statut rapidement.

jsProto=Sous le capot : les plugins de Protocole peuvent désormais être implémentés en JavaScript.

minorImprovements=Tout un tas d'améliorations mineures, parmi lesquelles :
jumpToTab=Vous pouvez désormais allez à l'onglet n en utilisant &lt;modifieur&gt;+&lt;n&gt; sur la fenêtre de discussion, où &lt;modifieur&gt; est Contrôle sous Windows/Linux et Commande sur Mac.
helpCommand=Une commande d'aide ('/help') a été ajoutée afin de voir rapidement et facilement les commandes disponibles dans la conversation actuelle.
unknownStatus=Un statut inconnu est désormais différencié d'un statut hors ligne avec des icônes différentes.
darkSimple=Variante sombre du skin « Simple. »

updated=Mis à jour
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; se base sur libpurple &libpurpleVersion; et Mozilla &mozillaVersion; ce qui apporte de superbes &newPossibilitiesForAddonsDevelopersLink; (&restartLessAddonsLink;).
newPossibilitiesForAddonsDevelopersLink=nouvelles possibilités pour les développeurs de modules complémentaires
restartLessAddonsLink=par exemple, les modules sans redémarrage

improvedStability=Stabilité améliorée
improvedStabilityDescription=nous avons utilisé les rapports d'arrêts soudains que nous avons reçus des versions 0.2 et 0.3, ainsi que des versions quotidiennes pour corriger des bugs qui engendraient des arrêts soudains.

andMore=Et plus encore… lisez la &changeLogLink; complet pour plus de détails à propos des &codeChangesCount; changements de code depuis Instantbird 0.2).
changeLogLink=Liste de changements

knownIssues=Problème connus
cannotReopenTwitterTimeline=Après avoir fermé l'historique Twitter, il ne peut pas être rouvert manuellement pour envoyer un tweet, il se rouvrira automatiquement lorsqu'un tweet sera reçu.
