keyFeaturesNotesPageTitleSuffix=caractéristiques principales

instantbirdFeatures=Caractéristiques d'Instantbird
awesomenessToMakeIMBetterForYou=Réunir toutes sortes de choses géniales afin d'améliorer votre messagerie instantanée.

allYourFriendsTitle=Discutez avec tous vous amis
allYourFriendsDesc1=Avec Instantbird, vous pouvez désormais discuter avec tous vos amis avec une seule application !
allYourFriendsDesc2=AIM, Yahoo, MSN, Google Talk, Facebook et même Twitter sont supportés !

troubleFreeTitle=Convivial
troubleFreeDesc1=Instantbird a été créé en gardant à l'esprit la stabilité et la simplicité.
troubleFreeDesc2=Vous apprécierez son interface utilisateur propre et sans désordre : rien ne vous distraira de vos conversations !
troubleFreeDesc3=Pas de publicité, aucun contenu indésirable ne vous dérangera.

conversationsInTabsTitle=Conversations dans des Onglets
conversationsInTabsDesc1=Les conversations sont groupées dans des Onglets, afin que des fenêtres de conversations s'ouvrant de partout ne vous submergent pas.
conversationsInTabsDesc2=Les onglets sont faciles à utiliser : vous pouvez les faire glisser pour les déplacer, ou déplacer une conversation vers une nouvelle fenêtre.

customizableConversationsTitle=Conversations personnalisables
customizableConversationsDesc1=Avec quelques thèmes de messages créés soigneusement offerts par défaut, et des centaines disponibles en tant que modules complémentaires, vous avez tout ce qu'il vous faut pour personnaliser vos conversations.
customizableConversationsDesc2=Transformons-les en expériences charmantes et colorées !

smartContactsTitle=Contacts intelligents
smartContactsDesc1=Plusieurs moyens de contacter la même personne ?
smartContactsDesc2=Pas de problème, faites simplement glisser un contact sur un autre et Instantbird saura qu'il s'agit de la même personne.

alwaysHereForYouTitle=Toujours là pour vous
alwaysHereForYouDesc1=Instantbird fonctionnera sur tous vos ordinateurs, qu'ils utilisent Windows, Mac OS X ou Linux.
alwaysHereForYouDesc2=Étant donné qu'il est libre et Open-Source, vous n'aurez jamais à payer pour l'utiliser.
alwaysHereForYouDesc3=Vous n'aurez plus jamais besoin d'utiliser un autre client de messagerie instantanée !

limitlessExtensibilityTitle=Extensibilité sans limites
limitlessExtensibilityDesc1=Des outils puissants tels que la recherche de texte ou le zoom sont intégrés pour vous aider à tirer un maximum de vos conversations.
limitlessExtensibilityDesc2=Et bien d'autres sont disponibles en tant que modules complémentaires, grâce à l'extensibilité sans limites d'Instantbird !

