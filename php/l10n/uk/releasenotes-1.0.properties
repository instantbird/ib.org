whatsNew=Що нового?

redesignedContactsWindow=Перероблене вікно контактів:
contactMerging=Злиття контаків
contactMergingDescription=Якщо Ви спілкуєтесь з однією особою в кількох ІМ-мережах, тепер Ви можете поєднати імена цієї людини з різних мереж в єдиний контакт. При відкритті нової балачки, ім'я користувача, яке знаходиться в мережі, буде вибране автоматично і вікно розмов автоматично перемкнеться на придатне ім'я користувача, якщо людина перейде в іншу IM-мережу.
tags=Теги
tagsDescription=Теги заміняють групи в списку контактів. Теги можуть бути приховані натисканням "x" в правій стороні списку контактів, всі контакти з цього тегу автоматично перейдуть до тегу "Інші Контакти", який відображається внизу списку контактів.
contactsWindowCanNowBe=Вікно контактів тепер може бути ...
closedOnMac=закрите в Mac без виходу з Instantbird; воно може бути знову відкрите з Доку.
minimizedToTrayOnWindowsAndLinux=<strong>мінімізоване в трей</strong> в Windows та Linux. За замовчуванням закриття (натиснення 'x') в списку контактів мінімізує його в трей, але це може бути змінене в налаштуваннях.
buddyIcon=Тепер користувачі можуть встановити свій <strong>значок співрозмовника</strong> та <strong>псевдонім</strong> їхніх акаунтів прямо в списку контактів.
contactListSorted=<strong>Список контактів впорядкований</strong> за алфавітом (і групи і контакти).
nicerAnimations=Краща анімація.

twitterSupport=Підтримка Twitter
twitterSupportDescription=Після під'єднання twitter-акаунта бесіда в стрічці відкривається автоматично. Якщо розмова закривається користувачем, вона буде знову відкрита автоматично при надходженні нових повідомлень. Користувач повинен відключити обліковий запис з менеджера облікових записів, щоб запобігти відображенню нових повідомлень.<br />Також наявна передова опція "відстеження" який дозволяє вказати ключові слова для відстеження. Це розділений комами список ключових слів. Кома означає OR, пробіл всередині ключового слова означає AND.

topConversationUI=Нова <strong>інформаційна панель у верхній частині інтерфейсу розмов</strong>, яка показує значок співрозмовника, псевдонім та поточний статус вашого контакту. Крім того, Ви можете змінити ІМ-мережу, яку Ви використовуєте для розмови, натиснувши на значок протоколу.
updatedTabStyling=<strong>Стиль вкладок</strong> балачок був <strong>оновлений</strong> щоб відповідати Firefox 4, і користувачі останніх версій Windows оцінять деякі <strong>ефекти Aero glass</strong>.
timeBubbles=Бульбашки, стандартна тема повідомлень, отримала нові функції, пов'язані з часом, дивіться нашу &blogPostLink; за подробицями.
blogPostLink=статтю в блозі

jumplist=(лише Windows 7) <strong>Підтримка стрибаючого списку</strong> для швидкої зміни статусу.

jsProto=Під капотом: Плагіни протоколів тепер можуть бути реалізовані на JavaScript.

minorImprovements=Багато дрібних поліпшень, серед них:
jumpToTab=Тепер ви можете швидко перейти до n-ої вкладки використовуючи &lt;modifier&gt;+&lt;n&gt; в вікні розмов, де &lt;modifier&gt; це ctrl в Windows/Linux та Command в Mac.
helpCommand=Була додана команда довідки ('/help') щоб можна було швидко і легко побачити, які команди доступні для поточної розмови.
unknownStatus=Невідомий статус тепер відрізняється від офлайн статусу завдяки різним значкам.
darkSimple=Темний варіант "Простої" обкладинки.

updated=Оновлено
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; оснований на libpurple &libpurpleVersion; та Mozilla &mozillaVersion; що приносить величезні &newPossibilitiesForAddonsDevelopersLink; (&restartLessAddonsLink;).
newPossibilitiesForAddonsDevelopersLink=нові можливості для розробників доповнень
restartLessAddonsLink=наприклад доповнення, що не вимагають перезавантаження

improvedStability=Покращена стабільність
improvedStabilityDescription=ми використовували звіти про збої, які ми отримали з релізів 0.2 і 0.3 і нічних збірок для виправлення помилок, які призводили до аварій.

andMore=І багато іншого... читайте повний &changeLogLink; щоб дізнатись подробиці &codeChangesCount; змін в коді з моменту виходу Instantbird 0.2).
changeLogLink=Перелік змін

knownIssues=Відомі проблеми
cannotReopenTwitterTimeline=Після закриття стрічки в Twitter, вона не може бути знову відкрита вручну, щоб відправити твіт, вона буде відкрита автоматично після отримання твіту.
