faqPageTitleSuffix=Часті Питання
faq=Часті Питання
summary=Зміст

installing=Встановлення

useexistingaccountsTitle=Чи потрібно мені надавати нову контактну інформацію моїм друзям?
useexistingaccountsText=Ні, з Instantbird ви можете використовувати всі існуючі акаунти в рамках єдиного додатка. Якщо ви вже використовуєте обмін миттєвими повідомленнями, вам не потрібно створювати новий акаунт, щоб почати використовувати Instantbird.

systreqTitle=Чи Буде Instantbird працює на моєму комп'ютері?
systreqText=Instantbird в даний час підтримує Windows 2000 та пізніші версії, Mac OS X 10.4 ата пізніші версії та Linux. Перейдіть на сторінку &systemRequirementsLink; для отримання детальнішої інформації.
systemRequirementsLink=системних вимог

getlatestTitle=Що потрібно завантажити для встановлення останньої версії Instantbird?
getlatestText=Посилання на завантаження на &homePageLink; автоматично вибере для вас версію Instantbird, яка, вірогідно, найбільш підходить для вашої системи. Якщо ви хочете самі вибрати операційну систему та мову, зробіть це на &downloadPageLink;.
homePageLink=головній сторінці
downloadPageLink=сторінці завантаження

installasuserTitle=Чи можу я встановити Instantbird на моєму комп'ютері не будучи адміністратором?
installasuserText=Безумовно!

sideinstallTitle=Чи можу я встановити Instantbird і залишити мій попередній клієнт обміну повідомленнями на моєму комп'ютері?
sideinstallText=Безумовно! Instantbird та інші клієнти можуть співіснувати на одному комп'ютері, не викликаючи жодних проблем.

installwindowsTitle=Як мені встановити Instantbird на Windows?
installwindowsText=Instantbird запакований для Windows як виконуваний інсталятор. Просто запустіть файл, який Ви завантажили, і нехай він проведе Вас через процес встановлення.

installmacTitle=Як мені встановити Instantbird на Mac OS X?
installmacText=Клацніть двічі на образ диску Instantbird (файл з ім'ям, що закінчується на ".dmg") який ви завантажили. Потім перетягніть значок Instantbird в теку Програм.

installlinuxTitle=Як мені встановити Instantbird на Linux?
installlinuxText=Розпакуйте вміст завантаженого архіву, і запустіть файл з іменем "instantbird". Якщо спливаюче діалогове вікно запитає Вас, що Ви хочете - змінити чи запустити файл, виберіть "запустити".

portableTitle=Чи є Instantbird портативним (чи працює він з USB-флешки)?
portableText1=Якщо ви запустите Instantbird з USB-флешки, він, за замовчуванням, збереже Ваш профіль користувача на жорсткому диску.
# Do NOT translate '-profile' here, it's a command line parameter.
portableText2=Ви можете вказати Instantbird, щоб він зберігав профіль користувача на флешку використавши аргумент командного рядка <code>-profile</code>.
portableText3=Щоб це зробити, клацніть правою кнопкою миші на файл <code>instantbird.exe</code> і виберіть "Створити Ярлик", потім у властивостях ярлика змініть ціль додавши в кінець <code> -profile ./<em>назва_теки</em></code>.


updating=Оновлення

autoupdateTitle=Що мені потрібно робити, щоб завжди користуватись останньою версією Instantbird?
autoupdateText1=Нічого, за замовчуванням Instantbird буде періодично перевіряти наявність оновлень і просити вашого дозволу на своє оновлення при наявності нової версії.
autoupdateText2=Якщо вам не подобається така поведінка, ви можете змінити її в діалоговому вікні налаштувань.

forceupdateTitle=Що робити, якщо я хочу оновити програму зараз?
forceupdateText=В меню є пункт <em>Перевірити на оновлення</em> (доступний з меню <em>Довідка</em>) так що вам не доведеться чекати запит на оновлення, якщо ви знаєте, що оновлення існує.

overwriteTitle=Чи можу я встановити новішу версію поверх вже існуючої?
overwriteText=Так.

addonsafterupdateTitle=Чи будуть мої доповнення працювати після оновлення?
addonsafterupdateText1=Сумісні доповнення будуть працювати після оновлення. Якщо доповнення не сумісне з оновленою версією Instantbird, Instantbird запропонує перевірити, чи існує нова версія доповнення а також оновити його.
addonsafterupdateText2=Якщо ваше доповнення більше не працює після оновлення, ви можете зв'язатися з автором, щоб дізнатися, чи оновлена версія знаходиться в процесі створення.


uninstalling=Видалення

removeTitle=Як мені видалити Instantbird?
removeText1=У Windows, якщо Ви використовували встановлювач, Ви можете видалити Instantbird з панелі управління, як Ви б видалили будь-який інший додаток.
removeText2=В інших випадках, Ви можете просто видалити теку Instantbird.
removeText3=Видалення Instantbird не видалить ваші акаунти, історію розмов, розширення чи інші доповнення. Ці дані зберігаються в вашій &profileFolderLink;.
profileFolderLink=теці профілю
removeText4=Будь-яка версія Instantbird, яку ви встановите після видалення Instantbird продовжить використовувати дані з цієї теки.

using=Користування
severalaccountsTitle=Чи можу я використовувати кілька акаунтів одночасно?
severalaccountsText1=Так, Ви можете бути одночасно під'єднані до декількох акаунтів для будь-якого з підтримуваних протоколів.
severalaccountsText2=Використовуйте <em>Менеджер облікових записів</em> (доступний з меню <em>Інструменти</em>) щоб додати інший акаунт.

supportedprotocolsTitle=Які протоколи підтримуються?
supportedprotocolsText1=В даний час Instantbird підтримує за замовчуванням: AIM, Facebook Chat, Gadu-Gadu, Google Talk, Groupwise, ICQ, IRC, MSN, MySpaceIM, Netsoul, QQ, Simple, Twitter, XMPP, Yahoo та Yahoo JAPAN.
supportedprotocolsText2=Додаткові плагіни протоколів можуть бути встановлені як &addonsLink;.
addonsLink=доповнення

facebookusernameTitle=Коли я намагаюся підключитися до свого акаунту Facebook, я отримую повідомлення про помилку <code>Invalid XMPP ID</code>. У чому проблема?
facebookusernameText=Ви ввели в якості імені користувача адресу електронної пошти, яку Ви використовуєте для входу на веб-сайт Facebook. Чат Facebook очікує введення в поле Вашого унікального імені користувача. Перейдіть на &facebookLink; для його перевірки.

facebookauthorizationTitle=Коли я намагаюся підключитися до свого акаунту Facebook, я отримую повідомлення про помилку <code>Не Авторизовано</code>. У чому проблема?
facebookauthorizationText=Вам необхідно включити XMPP під'єднання до вашого акаунту Facebook.
facebookauthorizationText1=Відвідайте &facebookChatLink; в той час як увійшли в свій акаунт Facebook для ввімкнення XMPP-доступу.
facebookChatLink=Чат Facebook
facebookauthorizationText2=Вийдіть з веб-сайту Facebook.
facebookauthorizationText3=Ввійдіть на сайт Facebook знову.
facebookauthorizationText4=Підключіть ваш Facebook акаунт в Instantbird ("Інструменти" > "Облікові записи" та натисніть кнопку "З'єднати" на Вашому акаунті Facebook), і з'єднання повинне завершитись успішно.

getaddonsTitle=Де я можу отримати доповнення (розширення та теми)?
getaddonsText=Ви можете здійснити пошук доповнень в закладці <em>Ще Додатки</em> менеджера Додатків (доступного з меню <em>Інструменти</em>) де Ви побачите рекомендовані доповнення. Також Ви можете перейти на &addonsWebsiteLink; да Ви зможете переглянути експериментальні доповнення та залишити коментарі.
addonsWebsiteLink=веб-сайт доповнень для Instantbird

logsenabledTitle=Чи створює Instantbird журнали моїх розмов і чатів?
logsenabledText=Так, Instantbird створює журнали за замовчуванням. Використайте налаштування на панелі <em>Приватність</em> в діалозі <em>Параметри</em> щоб змінити це на свій смак. Якщо ви хочете поглянути на власне файли, скористайтесь кнопкою <em>Показати теку журналів...</em> на тій же панелі.

logfolderTitle=Де зберігаються журнали?
logfolderText=Ім'я та шлях до лог-файлів є наступним: <code><em>&profileLink;</em>/logs/<em>протокол</em>/<em>ім'я_приятеля_або_назва_чату</em>/<em>дата_і_час</em>.txt</code> (замініть частини курсивом фактичними значеннями).
profileLink=шлях_до_профілю

profilefolderTitle=Де знаходиться тека з моїм профілем?
profilefolderText1=Вона розташована в одному з наступних місць в залежності від вашої операційної системи:
profilefolderTextCopyAndPaste=точно скопіюйте і вставте це в провіднику Windows
profilefolderTextReuse=Будь-яка версія Instantbird, яку ви встановите після видалення Instantbird продовжить використовувати дані з цієї теки профілю.

aboutconfigTitle=Чи можна отримати доступ до about:config для тонкої зміни налаштувань?
aboutconfigText=Хоча ми не рекомендуємо використовувати його, about:config доступний з закладки <em>Розширені</em> в діалозі налаштувань.


development=Розробка

whyTitle=Чому ви розробляєте Instantbird?
whyText=Ми пропонуємо вам Instantbird тому що &weBelieveLink;.
weBelieveLink=ми вважаємо, що миттєвий обмін повідомленнями є важливою складовою при роботі в Інтернеті

licenseTitle=Як Instantbird ліцензовано?
licenseText=Instantbird ліцензовано відповідно до умов ліцензії GNU GPL версії 2.0 або більш пізньої версії (тому що він використовує libpurple який ліцензований згідно GPL). Проте, велика частина вихідного коду також ліцензована згідно потрійної ліцензії Mozilla (MPL 1.1/GPL 2.0/LGPL 2.1).

getthesourceTitle=Де знаходиться вихідний код?
getthesourceText=Архів вихідних текстів кожної випущеної версії можна отримати на &downloadPageLink;. Останній код можна отримати з нашого репозиторію Mercurial, слідуючи &buildInstructionsLink;.
buildInstructionsLink=інструкціям для побудови

teamTitle=Хто розробляє Instantbird?
teamText=Ми є &teamLink; високо мотивованих людей, але ми сподіваємося, багато людей, включаючи Вас, приєднаються до нас, щоб зробити цей проект ще кращим.
teamLink=маленькою командою

mozillaTitle=Чи спонсорує Mozilla цей проект?
mozillaText1=Mozilla Foundation не допомагала нам матеріально.
mozillaText2=Логотип "Працює на Mozilla" на нашій головній сторінці означає, що Instantbird залежить від коду і технологій, які розробляються спільнотою Mozilla. Ми дуже вдячні спільноті Mozilla в цілому за дивовижні технології, на яких основана Instantbird.

getinvolvedTitle=Як я можу взяти участь?
getinvolvedText=Існує кілька способів, щоб взяти участь у проекті. Вам не потрібно бути програмістом, щоб допомогти нам. Дивіться &getInvolvedLink; за детальною інформацією.
getInvolvedLink=взяти участь

translateTitle=Чи можу я допомогти в перекладі на мою мову?
translateText=Так! Дивіться &translationWikiPageLink; за подробицями.
translationWikiPageLink=сторінку в вікі по перекладу

createaddonsTitle=Як я можу створити доповнення?
createaddonsText=Дивіться &extensionsWikiPageLink;.
extensionsWikiPageLink=сторінку в вікі по доповненнях

fxaddonsTitle=Чи можуть доповнення Firefox/Thunderbird працювати в Instantbird?
fxaddonsText=Не 'з коробки', але більшість з них можуть бути адаптовані. Дивіться &portingFirefoxExtensionsPageLink;.
portingFirefoxExtensionsPageLink=сторінку адаптації розширень Firefox

followTitle=Як я можу стежити за поточним станом розробки?
followText1=Щоб залишатися в курсі найважливіших новин, Ви можете відвідувати &blogLink;.
blogLink=наш блог
followText2=Якщо Ви хочете слідувати нашій дискусії, то Ви можете приєднатися до нас в нашому IRC-чаті: &ircRoomLink;.
ircRoomLink=#instantbird на сервері irc.mozilla.org
followText3=&nightlyBuildsLink; будуються кожного дня, тому люди можуть допомогти нам тестування функції, які тільки що були додані. Ви можете вільно використовувати їх, але будьте обережні! Вони можуть бути нестабільними, і якщо Ви вирішите використовувати їх, передбачається, що Ви допоможете нам у тестуванні недосконалих функцій, а не просто будете як та зухвала дитина, яка отримала нову іграшку першою. Тому якщо Ви знайшли помилки, будь ласка &reportBugLink; (&filingABugLink;: те, що повинен містити звіт про помилку) замість того щоб скаржитися.
reportBugLink=повідомляйте про них
nightlyBuildsLink=Нічні збірки
filingABugLink=Заповнення звіту про помилку

whatsnextTitle=Що буде в наступній версії?
whatsnextText=Дивіться &roadmapLink;.
roadmapLink=план розвитку

whenTitle=Коли буде випущена наступна основна версія?
whenText=Ми в захваті від цього проекту і раді, що Ви поділяєте наше бажання рухатися вперед як можна швидше. Однак через характер розробки програмного забезпечення, визначення термінів є проблематичним, і ми вважаємо якість підтримки важливішою.

futurefeaturesTitle=Чи буде Instantbird підтримувати передачу файлів/відео-чат/<em>вставте вашу улюблену функцію тут</em>?
futurefeaturesText1=Дивіться &roadmapLink;.
futurefeaturesText2=Не соромтесь обговорювати з нами речі, які не перераховані в плані, щоб дізнатись, чи вони нас цікавить, або чи вони можуть бути реалізовані у вигляді доповнень.
