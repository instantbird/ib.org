instantbirdBecause=Ми пропонуємо вам Instantbird тому що...
weBelieveImportantComponentOnlineLife=Ми вважаємо, що миттєвий обмін повідомленнями є важливим компонентом <em>вашого</em> онлайн-життя.
weBelieve=Ми вважаємо:

deservesMoreAttention=Що програми миттєвого обміну повідомленнями заслуговують більше уваги: Враховуючи кількість часу, що витрачається на обмін миттєвими повідомленнями щодня, варто витратити кілька хвилин, щоб вибрати програмне забезпечення, яке <strong>вам підходить</strong>.
solidAlternative=Що повинна бути <strong>міцна альтернатива</strong> для програм миттєвого обміну повідомленнями, які набули великого поширення.
reclaimControl=Миттєвий обмін повідомленнями є частиною вашого життя в мережі, над якою <strong>Ви можете повернути собі контроль</strong>.

shouldBeEasyReliableFunEmpowering=Програма повинна бути <strong>простою у використанні, надійною, веселою і розширюваною</strong>
shouldJustWork=Вона повинна <strong>просто працювати</strong>! Метою програм для обміну повідомленнями є дозволити Вам спілкуватися без перешкод. Ви хочете використовувати його, а не витрачати свій час на боротьбу з ним.
relyOnIt=Миттєвий обмін повідомленнями вже не нова іграшка, а життєздатний засіб зв'язку для критичних питань, тому програма повинна бути <strong>дуже стабільною</strong>, щоб бути впевненим, що <strong>на неї можна покластись</strong>.
customizeIt=Незалежно від того скільки часу Ви проводите з нею, ви повинні бути в змозі <strong>зробити її своєю</strong>. Вам необхідне <strong>право вирішувати, як це повинно бути</strong>, щоб <strong>&customizeItLink;</strong>.
customizeItLink=налаштувати її

respectTheUser=Програма обміну миттєвими повідомленнями повинна <strong>поважати користувача</strong>
privacy=Приватність
privacyText=тому що обмін миттєвими повідомленнями залучає в себе інтимні або конфіденційні дані, і Ви повинні тримати це під контролем.
freedom=Свобода
freedomText=не повниино бути <strong>несподіванок</strong> при користуванні програмою. Вона повннна <strong>робити те, що Ви хочете</strong>.

openSource=Щоб це завжди було так, робота програми повинна бути <strong>відкритою, прозорою</strong>. Ось чому має значення те, що <strong>Instantbird є відкритим ПЗ</strong>.

shouldBeAccessibleAdapted=Програма обміну миттєвими повідомленнями повинна бути <strong>зручною</strong>, <strong>адаптованою до користувача</strong>
adaptedToYourNeeds=<strong>Ваша мова, знання комп'ютера, операційної системи, або можливості не повинні бути бар'єром</strong>; програмне забезпечення повинне бути адаптоване до ваших потреб, а не вимагати у вас адаптування.

bringBackInnovation=Обмін миттєвими повідомленнями повинен бути захоплюючим, але він не дуже сильно розвивався протягом останніх кількох років. <strong>Час повернути інновації</strong>! Нашою метою є реалізація всіх цих поглядів в Instantbird, і ми вітаємо всі надходження від наших користувачів.


gettingInvolved=Як взяти участь:

joiningUs=Якщо ви поділяєте наші переконання, Ви, ймовірно, зацікавлені в приєднанні до нас. Існує <strong>багато способів взяти участь</strong> і деякі з них не вимагають від Вас жодних технічних знань:

feedbackAndIdeas=Надавайте відгуки, діліться ідеями
knowHowItWorksForYou=Важливо, щоб ми знали, як Instantbird працює для Вас, так щоб ми могли поліпшити його таким чином, щоб зробити його зручнішим для Вас.
severalWaysToSendFeedback=Є кілька способів відправити певний відгук, у тому числі:  надсилання звітів про крахи, &filingBugsLink;, або спілкування з нами. Якщо у вас є питання, не соромтеся &getInTouchWithUsLink;.
filingBugsLink=заповнення звітів про помилки
getInTouchWithUsLink=зв'язатись з нами
comeDiscussYourIdeas=Не соромтеся прийти і обговорити з нами Ваші ідеї для майбутніх поліпшень. Ми дуже цінуємо це. Вони можуть бути реалізовані в наступній версії або зацікавити певних авторів доповнень!

spreadTheWord=Розкажіть про нас!
talkAboutIt=Поговоріть зі своїми друзями, колегами та родичами про Instantbird: Скажіть їм, що Вам сподобалось в ньому і чому Ви думаєте, що вони можуть бути зацікавлені. Допоможіть їм в процесі встановлення (зокрема, встановлення акаунтів). Спитайте у них за кілька днів чи вони до цих пір використовують її та чи виникли у них проблеми з нею. Якщо вони стикалися з проблемами, переконайтеся, що ми знаємо про них (див. 'Надавайте відгуки' вище).

testPreReleaseVersions=Тестуйте проміжні версії
alphaBetaNightly=Ми випускаєм альфа та бета версії тому Ви можете надати відгук про нові можливості. Якщо Ви хочете пильно стежити за розвитком, у нас є нічні збірки для тестування.
pleaseReportIssues=Будь ласка повідомляйте про знайдені вами пролеми.

helpOtherInstantbirdUsers=Допоможіть іншим користувачам Instantbird!
answerQuestionsOnIRC=Якщо ви стирчите в нашому IRC-чаті, ви можете побачити питання інших користувачів, які потребують допомоги. Не соромтеся, щоб допомогти їм, навіть якщо Ви вважаєте, що інші люди знають більше. Якщо Ви почнете допомагати комусь і виявиться, що Ви не знаєте рішення, не хвилюйтеся! Інші допоможуть у цьому!

translate=Перекладайте
translateInstantbirdIntoYourLanguage=Щоб допомогти нам запропонувати Instantbird для більш широкої аудиторії, ви можете &translateInstantbirdLink; на Вашу мову.
translateInstantbirdLink=перекласти Instantbird

addonDevelopment=Розробка доповнень
createEditReviewAddons=&createAddonLink;, &reviewAddonsLink; та змінюйте доповнення і тим самим дайте іншим можливість відчути, що їх Instantbird підходить їм ще більше, завдяки Вам.
createAddonLink=Створюйте
reviewAddonsLink=переглядайте

contributeCode=Вносіть код
weCanHelpYou=Для тих з Вас, хто володіє великою кількістю технічних знань - Ви можете піти далі і надавати патчі.</p><p>Ви, ймовірно, захочете почати з &compilingABuildYourselfLink;. Поговоріть з нами під час процесу, ми можемо допомогти Вам почати роботу швидше!
compilingABuildYourselfLink=компілювання збірки самостійно
