keyFeaturesNotesPageTitleSuffix=ключові можливості

instantbirdFeatures=Особливості Instantbird
awesomenessToMakeIMBetterForYou=Об'єднання всіх видів дивовижностей, щоб зробити для Вас миттєвий обмін повідомленнями кращим.

allYourFriendsTitle=Спілкуйтесь зі всіма вашими друзями
allYourFriendsDesc1=З Instantbird тепер Ви можете спілкуватись з усіма друзями в одній програмі!
allYourFriendsDesc2=Підтримуються AIM, Yahoo, MSN, Google Talk, Facebook і навіть Twitter!

troubleFreeTitle=Без проблем
troubleFreeDesc1=Instantbird був розроблений з врахуванням стабільності та простоти.
troubleFreeDesc2=Ви будете насолоджуватися чистим та незахаращеним користувацьким інтерфейсом: ніщо не буде відволікати Вас від ваших розмов!
troubleFreeDesc3=Ніякої реклами, Вас не буде дратувати небажаний контент.

conversationsInTabsTitle=Бесіди в Вкладках
conversationsInTabsDesc1=Розмови групуються в Вкладки, гарантуючи, що ви ніколи не відчуєте себе заваленим вікнами розмов, які вискакують всюди.
conversationsInTabsDesc2=Вкладки прості у використанні: ви можете перетягнути їх для зміни порядку, або перемістити розмову в нове вікно.

customizableConversationsTitle=Налаштовувані розмови
customizableConversationsDesc1=З кількома ретельно розробленими темами повідомлень, що доступні за умовчанням, і сотнями доступних у виді додатків, є все, що потрібно, щоб зробити ваші розмови дійсно особистими.
customizableConversationsDesc2=Давайте перетворимо їх у барвисте, чудове переживання!

smartContactsTitle=Розумні контакти
smartContactsDesc1=Ви знаєте кілька способів, щоб зв'язатись з тією ж особою?
smartContactsDesc2=Без проблем, просто киньте один контакт на інший і Instantbird буде знати, що це та ж особа.

alwaysHereForYouTitle=Завжди тут для Вас
alwaysHereForYouDesc1=Instantbird буде працювати на всіх ваших комп'ютерах, які працюють під керуванням Windows, Mac OS X чи Linux.
alwaysHereForYouDesc2=Він є вільним та має відкритий початковий код, тому Вам ніколи не доведеться платити за його використання.
alwaysHereForYouDesc3=Вам ніколи не доведеться навчатися використовувати інший IM-клієнт знову!

limitlessExtensibilityTitle=Безмежна розширюваність
limitlessExtensibilityDesc1=Потужні інструменти, такі як вбудований пошук або масштабування є вбудованими щоб допомогти вам отримати максимальну віддачу від ваших розмов.
limitlessExtensibilityDesc2=Ще більше є доступними як додатки, завдяки безмежній розширюваності Instantbird!

