keyFeaturesNotesPageTitleSuffix=Características principais

instantbirdFeatures=Características do Instantbird
awesomenessToMakeIMBetterForYou=Reunidos todos os tipos de melhorias para fazer de Instantbird o melhor mensageiro para você.

allYourFriendsTitle=Coverse com todos os seus amigos
allYourFriendsDesc1=Com Instantbird, você pode conversar com todos os seus amigos em uma única aplicativo!
allYourFriendsDesc2=AIM, Yahoo, MSN, Google Talk, Facebook e também Twitter são suportados!

troubleFreeTitle=Livre de problemas
troubleFreeDesc1=Instantbird foi desenvolvido pensando na estabilidade e simplicidade.
troubleFreeDesc2=Curta a interface limpa do Instantbird: nada vai te distrair durante suas conversas!
troubleFreeDesc3=Sem propaganda, sem pertubação com material indesejado.

conversationsInTabsTitle=Conversas em abas
conversationsInTabsDesc1=Conversas são agrupadas em abas, garantindo que nunca se sinta confuso com janelas de conversa em todo lugar.
conversationsInTabsDesc2=As abas são simples: você pode movê-las e reordená-las ou criar uma nova janela.

customizableConversationsTitle=Conversas personalizáveis
customizableConversationsDesc1=Com alguns temas padrão, e muitas outras extensões, você tem tudo para deixar sua conversa cada vez mais pessoal.
customizableConversationsDesc2=Transforme sua conversa em uma experiência prazerosa!

smartContactsTitle=Contatos inteligentes
smartContactsDesc1=Existe varios contatos da mesma pessoa?
smartContactsDesc2=Sem problemas, basta agrupar os contatos e Instantbird vai saber que se referem a mesma pessoa.

alwaysHereForYouTitle=Sempre presente
alwaysHereForYouDesc1=Instantbird vai funcionar em todos os computadores, indepedente de executar Windows, Mac OS X ou Linux.
alwaysHereForYouDesc2=Como um software gratuito e Open-Source, você não precisa pagar para usá-lo.
alwaysHereForYouDesc3=Nunca mais vai precisar usar outro Mensageiro Instantâneo novamente!

limitlessExtensibilityTitle=Extensibilidade ilimitada
limitlessExtensibilityDesc1=Ferramentas poderosas como a Linha de Pesquisa ou Zoom estão embutidas no Instantbird para ajudá-lo a tirar proveito de suas conversas.
limitlessExtensibilityDesc2=Mais ferramentas estão disponíveis como extensões, graças a extensibilidade ilimitada do Instantbird!

