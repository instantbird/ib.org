twitterImprovements=Melhorias no Twitter
characterCounter=O contador de caracteres para o Twitter foi melhorado para encurtar os links inseridos no tweet, permitindo <strong> inserir links facilmente</strong> sem aborrecimentos com o seu tamanho!
twitterAPIUpgrade=O API do Twitter foi atualizado para a versão <strong>1.1 </strong>. Fique atento: A versão do API do Instantbird 1.3 pode deixar de funcionar a partir de 11 de Junho de 2013!
followedPeopleInTimeline=Agora o protocolo do Twitter inclui todos os usuários que você segue como um participante na sua linha de tempo.

ircAuthImprovements=A <strong>autenticação do IRC</strong> foi melhorada para funcionar melhor com bouncers (segurança)(ex.: ZNC).
ircOverrideCerts=Você pode facilmente substituir <strong>certificados autoassinados/inválidos/desatualizados</strong> para servidores IRC.
debugLogs=Cada conta de usuário possui <strong>histórico de depuração</strong> que podem ser acessados ao clicar com o botão direito do mouse em qualquer protocolo na janela Contas e clicando em "Copiar Debug Logs", onde estão as informações essenciais para os desenvolvedores diagnosticarem falhas. (Observe que os históricos de diagnóstico PODEM conter informações confidenciais.)

underTheHood=Por dentro de Instantbird
