whatsNew=Novidades?

improvedAccessibility=Grandes <strong>melhorias de acessibilidade</strong>.

ircImprovements=Melhorias no protocolo IRC
longMessages=Mensagens longas serão enviadas em várias partes ao invés de serem cortadas
SASLAuth=Autenticação SASL passa a ser suportada, necessário para certas faixas de IP ou quando usar Tor e conectar-se para Freenode.

twitterImprovements=Melhorias no protocolo Twitter
ownDescription=Sua descrição pessoal passa a ser mostrada (e pode ser editada) acima da linha do tempo.
replyToAll=Responder um tweet agora responde para todos os usuários, como no site do Twitter!
twitterTabIcon=O ícone guia para a linha de tempo do Twitter é agora o Twitter bird para diferenciar explicitamente a linha de tempo e a janela de chat.

showNick=A extensão "Show Nick" foi incorporado ao Instantbird. Isso destaca quando apelido de um usuário é mencionado em um bate-papo para ver facilmente as conversas que estão acontecendo. Esperamos que aproveite essa melhoria, mas é possível desabilitá-lo indo em "Preferências", clique no botão "Avançado", depois "Editor de Configurações", digite "messenger.conversations.showNicks", e mude o valor para "false".

newXMPPNetworks=Dois novos protocolos foram adicionados via XMPP: <strong>Odnoklassniki</strong> e <strong>VKontakte</strong>.

underTheHood=Por dentro de Instantbird
basedOnLibpurpleAndMozilla=<strong>Atualização:</strong> Instantbird &versionNumber; é baseado no Mozilla &mozillaVersion; que traz grande &newPossibilitiesForAddonsDevelopersLink; e usa libpurple &libpurpleVersion;. Esta versão é a última que é suportado no Mac OS 10.5 e PPC, uma vez que estas não será possível o suporte com Mozilla 17.
newPossibilitiesForAddonsDevelopersLink=novas possibilidades para desenvolvedores de extensões
memoryReporters=A memória consumida por libpurple e das suas dependências é rastreada em about:memory.
andMore=E mais... leia a lista completa de &changeLogLink; para mais detalhes das &codeChangesCount; mudanças de código desde Instantbird 1.2.
