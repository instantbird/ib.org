whatsNew=O que há de novo?

logViewer=O <strong>visualizador de registros</strong> mostra as conversas como um visualizador de conversas, graças ao novo formato JSON-based log file que armazena meta-dados junto ao texto da conversa.
bonjour=Foi adicionado o suporte ao <strong>Bonjour</strong> (é necessário o &bonjourPrintServicesLink; no Windows ou &avahiLink; no Linux).
bonjourPrintServicesLink=Serviço de impressão do Bonjour

mucInterface=Interface aprimorada para <strong>chats multi-usuários</strong>:
tabComplete=<strong>Integração com a tecla tab melhorada</strong>. Leia o nosso &tabCompleteBlogPostLink; para detalhes.
tabCompleteBlogPostLink=post no blog
activeNicks=Saiba quem está participando na conversa, com a identificação dos participantes por cores.

ircEnhancements=Melhorias no IRC:
channelsReconnect=Canais são reconectados automaticamente após a conexão com o servidor.
ircStatus=Instantbird rastreia o status dos contatos do IRC usando os comandos WATCH ou MONITOR, se for suportado.
ircChanServ=Mensagens de ChanServ messages são mostrados no canal em que fazem referência.
ircNickServ=Nenhuma mensagem de NickServ te interrompendo depois do logon.

encryptedPasswords=Para aprimorar sua segurança, as senhas são armazenadas no gerenciador de senhas do Mozilla. É possível protegê-las, como no Firefox e Thunderbird, usando uma senha mestre.
popularAccounts=O Assistente de Contas facilita a criação de novas contas por meio de uma lista de protocolos mais populares. Pode-se ter acesso também a todos os outros protocolos.
systemTrayStatus=Integração com o <strong>ícone de bandeja</strong> foi melhorado: você pode mudar o seu status diretamente no menu de contexto do sistema.
lastReadMarker=Encontre rapidamente o último diálgo de conversa: A posição da primeira mensagem não-lida está marcada visualmente (e pode-se rapidamente saltar pressionando Alt-PgUp/PgDn ou passando).
conversationRestore=Ao restaurar conversas antigas, será mostrada uma barra de progresso ao invés de congelar a interface do usuário.
contextMessages=As mensagens já lidas serão distinguidas das não-lidas em todas os estilos de mensagem padrão. Esses estilos também respeitarão as configurações de fonte em "Preferencias->Conteúdo".
keyboardNavigation=A navegação de conversa pelo teclado foi aprimorado por permitir deslizamento através de uma caixa de texto de entrada(vazia): Use as setas, Page Up/Down, ou Home/End! Existem novos atalhos para colocar a conversa em espera (ESC) e acessar o visualizador de log (Ctrl+Shift+H, similar ao "Histórico" no Firefox).
accessibilityImprovements=Melhorias na <strong>acessibilidade</strong> foram feitas para novas mensagens, contatos e grupos de contatos.

addonDevelopers=Para desenvolvedores de Extensões:
soundPreferences=Preferências de controles de sons mais precisos: por exemplo &advancedSoundControlsLink;.
advancedSoundControlsLink=Controles Avançado de Sons (Advanced Sound Controls)
reorderContacts=Reorganização da lista de contatos: por exemplo &sortByStatusLink;.
sortByStatusLink=Organizar por Status (Sorty by Status)
addNewProtocols=É possível adicionar facilmente novos protocolos usando JavaScript: por exemplo &vznetChatsLink;.
vznetChatsLink=Protocolo VZnet (VZnet Chats)

underTheHood=Instantbird por dentro
extensibleProtocols=Temos as nossas próprias implementações de JavaScript extensíveis para:
facebookAndGoogleProtocols=<strong>Chat do Facebook</strong> e do <strong>Google Talk</strong>, baseado em nosso plugin do protocolo <strong>XMPP</strong> (do Google Summer of Code 2011).
ircProtocol=IRC
basedOnLibpurpleAndMozilla=<strong>Atualizado:</strong> Instantbird &versionNumber; é baseado em Mozilla &mozillaVersion; que trazem  &newPossibilitiesForAddonsDevelopersLink; e usa libpurple &libpurpleVersion;.
newPossibilitiesForAddonsDevelopersLink=novas possibilidades para desenvolvedores de extensão
mplLicense=The license of most of the code was updated to the &mplLink;, official builds of Instantbird &versionNumber; are distributed under the &gplLink;.
mplLink=Mozilla Public License (MPL) 2.0
gplLink=GNU Public License 2.0 ou superior
libqq=Estamos usando libqq-pidgin para <strong>QQ</strong> porque o protocolo QQ não estar mais incluído no libpurple.
platformChanges=Mudanças de platforma fizeram com que perdessemos o suporte para Windows 2000 e do Windows XP inferior ao Service Pack 2. Recomendamos a atualização para o Windows XP SP2 ou superior.

andMore=E mais... leia a nossa &changeLogLink; para detalhes das &codeChangesCount; mudanças de código desde o Instantbird 1.1.
changeLogLink=Log de mudanças completa

knownIssues=Problemas conhecidos
freenodeSSL=Falhas na reconexão SSL no freenode (&bug1100Link;).
bug1100Link=bug 1100
selfSignedCerts=certificado autoassinado ou manuseio de certificado inválido (&bug1292Link;).
bug1292Link=bug 1292
