whatsNew=Novidades

newTabIntro=Criar uma <strong>nova aba de conversa</strong> ficou mais fácil.
newTabOpeningTheTab=Ao clicar no botão '+' numa janela de conversa, será mostrado uma lista de conversas que pode ser iniciado com um simples clique.
newTabFrecency=A lista é sorteada com um algoritmo de frequência, exibindo os contatos pela ordem em que você conversa com frequência.
newTabChannelList=Essa lista inclui também os canais de aviso dos serviddores IRC dos quais você está conectado.

newTooltips=<strong>Novas ferramentas</strong> que melhor se adapte ao estilo de Instantbird

improvedMUCsIntro=Interface de chat multi-usuário melhorada:
improvedMUCsContextMenu=É possível iniciar um chat privado ou adicionar participantes de uma sala de chat através do menu de contexto. 

improvedMUCsHighlightedNicks=Contatos destacados nas salas de chat tem agora ferramentas e menus de contexto.

improvedRTLSupport=Melhor suporte para a exibição de idiomas RTL (que são escritos da </strong>direita para a esquerda</strong>, como o arábe, hebraico, etc.) nas conversas.

hangoutMobileStatus=Contatos do Google Talk e usuários do app Hangouts para Android são mostrados, no status, como "pelo celular".

ircAlternateNicks=Uma lista de nicks alternativos para IRC pode ser configurado, no caso de você preferir, seu nickname favorito será exibido quando se conectar.

retinaSupport=Suporte à tecnologia Retina display no Mac OS X.

autojoinToHold=As salas de chat que forem unidas automaticamente ficarão no espaço das Conversas em Espera, mesmo que você reinicie Instantbird.

aboutPagesInTabs=Páginas about: (ex.: <strong>about:config</strong>) podem ser executadas facilmente, pelo comando /about (ex.: /about config).

hangoutTypingFix=Usuários do Google Hangouts não serão mais exibidos como se estiveessem sempre digitação.

variousFixes=Varios pequenos bugs e crashers foram resolvidos.

mozilla25=Atualizado para Mozilla 25.

vkontakteDropped=O protocolo <strong>vKontakte</strong> foi removido porque o suporte da rede social ao cliente XMPP foi desativado.

tabbrowserAPILinkText=Documentação in-code
tabbrowserAPI=New for developers: Novo API para adicionar painéis de abas com conteúdo arbitrário para janelas de conversas: &tabbrowserAPILink;.

knownIssues=Erros conhecidos:

nvdaMozillaBug=Usuários NVDA deverão atualizar para a versão 2014.1 para trabalhar com bugs na plataforma da Mozilla que leva para "Unknown" being said when scrolling through the contact list.

bug1995LinkText=bug 1995
linkHandlerLinux=Ao clicar em URLs em algumas distribuições Linux mais novas, para resolver essa falha, execute o comando /about config numa janela de conversa e procure pela registro <strong>network.protocol-handler.warn-external</strong>, e mude o valor para true (verdadeiro). Voce será avisado para selecionar um aplicativo após clicar nesses links. Veja o &bug1995Link;.

andMore=E muito mais... leia toda a &changeLogLink; (em inglês) para mais detalhes sobre as mudanças de código de Instantbird 1.4 para a versão atual.
changeLogLink=ChangeLog
