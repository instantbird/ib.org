faqPageTitleSuffix=Frequently Asked Questions
faq=Frequently Asked Questions
summary=Sumário

installing=Instalando

useexistingaccountsTitle=Preciso fornecer novas informações de contato para meus amigos?
useexistingaccountsText=Não, com Instantbird você pode usar as suas contas de mensageitos existentes em um único aplicativo. Se você já possui algum mensageiro instalado em seu computador, não precisa criar uma nova conta para usar no Instantbird.

systreqTitle=Será que Instantbird funciona no meu computador?
systreqText=Instantbird é suportado atualmente no &sysReqWinVersion; ou superior, no &sysReqMacVersion; ou superior, e em distribuições Linux. Leia os &systemRequirementsLink; para mais informações.
systemRequirementsLink=requiositos do sistema

getlatestTitle=Como eu baixo a versão mais recente de Instantbird?
getlatestText=Na &homePageLink; será mostrado um link para baixar a versão e o idioma disponível para você. Caso queira escolher baixar Instantbird em outros idiomas e sistemas operacionais, clique em _ logo abaixo da opção principal. 
homePageLink=página inicial do site
downloadPageLink=<b>Outros Sistemas e Idiomas</b>

installasuserTitle=Posso instalar Instantbird sem permissão de administrador do meu computador?
installasuserText=Com certeza!

sideinstallTitle=Posso instalar Instantbird e manter meu outros mensaheiros instantâneos no meu computador?
sideinstallText=Sim! Instantbird pode coexistr com outros mensageiros no mesmo computador sem problemas.

installwindowsTitle=Como instalar Instantbird no Windows?
installwindowsText=Existe um instalador de Instantbird para Windows. Você deve executar o arquivo que baixou do site, e siga as instruções do instalador.

installmacTitle=Como instalar Instantbird no Mac OS X?
installmacText=Dê um clique duplo no Instantbird disk image (um arquivo com o final".dmg") que você baixou. Mova o ícone do Instantbird para a pasta Aplicativos.

installlinuxTitle=Como instalar Instantbird no Linux?
installlinuxText1=Extraia o conteúdo do arquivo baixado, e execute o arquivo chamado instantbird. Se uma caixa de diálogo perguntá-lo se deseja editar ou executar o arquivo, selecione "Executar".
installlinuxText2=Nós disponibilizamos Instantbird somente na arquitetura de 32-bits. Caso queira executálo em um Sistema Operacinal de 64-bits, você terá que instalar as bibliotecas de compatibilidade disponibilizados pela sua distribuição. Por exemplo, no Ubuntu, instale o pacote <code>ia32-libs</code> por digitar no terminal <code>sudo apt-get install ia32-libs</code> .
 

portableTitle=Existe alguma versão portável de Instantbird (que possa ser usado em um dispositivo USB)?
portableText1=Se desejar usar Instantbird em um dispositivo USB, ele irá armazenar seu perfil de usuário no disco rígido, por padrão.
# Do NOT translate '-profile' here, it's a command line parameter.
portableText2=Você pode fazer que Instantbird armazene seu perfil de usuário em um dispositivo USB usando o argumento de linha de comando <code>-profile</code>.
portableText3=Para isso, clique com o botão direito do mouse no arquivo <code>instantbird.exe</code> e clique em "Criar Atalho". Nas propriedades do atalho, edite e insira o parâmetro <code> -profile ./<em>foldername</em></code>.


updating=Atualização

autoupdateTitle=Existe algo que preciso fazer para continar usando a última versão de Instantbird?
autoupdateText1=Não. Por padrão, Instantbird pesquisará por atualizações e pedirá sua permissão para atualizar você mesmo se encontrar uma nova versão.
autoupdateText2=Se não gostar desse comportamento, você pode modificá-lo em preferências.

forceupdateTitle=O que faço se desejo atualizar Instantbird agora?
forceupdateText=Clique em <em>Buscar atualizações</em>, dentro do menu <em>Ajuda</em>. Quando existir uma atualização, ela aparecerá na janela. Basta clicar no link exibido e seguir as instruções.

overwriteTitle=Posso instalar uma nova versão com uma já instalada?
overwriteText=Sim.

addonsafterupdateTitle=Minhas extensões funcionarão depois de uma atualização?
addonsafterupdateText1=Extensões compatíveis funcionarão depois de uma atualização. Com as extensões não compatíveis, Instantbird irá conferir se existe uma versão compatível para esta versão para atualzação.
addonsafterupdateText2=Se sua extensão não funcionar depois da atualização, você pode contatar o seu autor para encontrar uma versão em desenvolvimento.


uninstalling=Desinstalando

removeTitle=Como desinstalo Instantbird?
removeText1=Se você usou um instalador para Windows, basta executar o desinstalador que está no Painel de Controle.
removeText2=Nos outros casos, você deve excluir a pasta onde está Instantbird.
removeText3=Quando você remove Instantbird, suas contas de usuários, históricos de conversas e extensões estão armazenados na sua &profileFolderLink;.
profileFolderLink=pasta de perfil
removeText4=Qualquer versão de Instantbird, que você possa instalar depois, irá utilizar os dados presentes nessa pasta.

using=Utilizando
severalaccountsTitle=Posso utilizar diversas contas ao mesmo tempo?
severalaccountsText1=Sim, você pode usar diversas contas dos protocolos suportados ao mesmo tempo.
severalaccountsText2=Utilize o <em>Gerenciador de Contas</em>, no menu <em>Ferramentas</em>, para adicionar uma outra conta.

supportedprotocolsTitle=Quais protocolos são suportados?
supportedprotocolsText3=Instantbird suporta estes protocolos: AIM, Bonjour, Facebook Chat, Gadu-Gadu, Google Talk, Groupwise, ICQ, IRC, MSN, MySpaceIM, Netsoul, Odnoklassniki, QQ, Simple, Twitter, VKontakte, XMPP, Yahoo e Yahoo JAPAN.
supportedprotocolsText2=Protocolos Adicionais podem ser instalados por &addonsLink;.
addonsLink=extensões

facebookusernameTitle=Quando tento conectar minha conta do Facebook, aparece uma mensagem de erro <code>Invalid XMPP ID</code>. Qual é o problema?
facebookusernameText=Você inseriu no nome do usuário dessa conta o email que utiliza para entrar no Facebook. O que você deve inserir no nome do usuário do Facebook é o seu nome de usuário único. Visite &facebookLink; para mais informações.

facebookauthorizationTitle=Quando tento conectar minha conta do Facebook, aparece uma mensagem de erro <code>Não Autorizado</code>. Qual é o problema?
facebookauthorizationText=Você precisa habilitar, no Facebook, as conexões XMPP.
facebookauthorizationText1=Acesse o &facebookChatLink; enquanto estiver logado em sua conta, e habilite o acesso ao protocolo XMPP.
facebookChatLink=Chat do Facebook
facebookauthorizationText2=Desconecte-se do Facebook.
facebookauthorizationText3=E reconecte-se ao Facebook.
facebookauthorizationText4=Conecte sua conta do Facebook no Instantbird ("Ferramentas" > "Contas" e clique no botão "Conectar" em sua conta do Facebook).

getaddonsTitle=Onde obtenho extensõoes (e temas) para Instantbird?
getaddonsText=Você pode buscar extensões na aba <em>Adicionar</em> no gerenciador de extensões (clicando no menu <em>Ferramentas</em>) serão mostrados algumas extensões rewcomendadas. Caso queira mais extensções, você pode visitar &addonsWebsiteLink; onde irá pesquisar por extensões experimentais e revisões.
addonsWebsiteLink=o site de extensões para Instantbird (Instantbird's add-on)

logsenabledTitle=Instantbird cria logs das minhas conversas e chats?
logsenabledText=SIm, Instantbird cria logs por padrão. Use as configurações do painel <em>Privacidade</em> pane no diálogo <em>Opções/Preferências</em> para configurá-lo do jeito que quiser. Se deseja ter acesso aos logs, clique no botão <em>Mostrar pasta de registro...</em>.

logfolderTitle=Onde estão armazenados os logs?
logfolderText=O nome e endereço dos logs estão: <code><em>&profileLink;</em>/logs/<em>protocol</em>/<em>buddy ou chat name</em>/<em>date and time</em>.txt</code> (mude as partes em itálico pelos valores atuais).
profileLink=pasta de usuário

profilefolderTitle=Onde está minha pasta de usuário?
profilefolderText1=Está localizado nesses locais, dependendo do seu sistema operacional:
profilefolderTextCopyAndPaste=copie e cole isso exatamente no Windows explorer
profilefolderTextReuse=Qualquer versão de Instantbird que instalar, após remover uma versão anterior, continuará usando os dados desta pasta de usuário.

aboutconfigTitle=Como acesso about:config para ajustar algumas preferências?
aboutconfigText=Apesar de desencorajarmos a usá-lo, about:config pode ser acessado clicando em <em>Ferramentas</em>, <em>Preferências</em>, em seguida, clique na aba <em>Avançado</em> e, por fim, no botão <em>Editor de configurações</em>.


development=Desenvolvimento

whyTitle=Por que vocês fazem Instantbird?
whyText=Produzimos Instantbird porque &weBelieveLink;.
weBelieveLink=nós acreditamos que mensageiros instantâneos torna-se fundamental na sua vida digital

licenseTitle=Como é licenciado Instantbird?
licenseText1=Instantbird está licenciado sob os termos da licença GNU GPL version 2.0 ou superior (porque usamos libpurple, que está sob a licença GPL). No entanto, grande parte do código fonte está licenciado sob a licença tripla Mozilla (MPL 1.1/GPL 2.0/LGPL 2.1).

getthesourceTitle=Onde está o código fonte?
getthesourceText=O pacote tarball com o código fonte de cada versão disponível está disponível em &downloadPageLink;. O último código de desenvolvimento pode ser obtido no nosso repositório de códigos do Mercurial e seguir as &buildInstructionsLink;.
buildInstructionsLink=instruções de construção

teamTitle=Quem fez Instantbird?
teamText=Somos &teamLink; de indivíduos altamente motivados, mas esperamos uma ajuda de muitas pessoas - inclusive a sua - para fazer este projeto cada vez melhor.
teamLink=um pequeno time

mozillaTitle=Mozilla está financiando o projeto?
mozillaText1=A fundação Mozilla não nos ajuda financeiramente.
mozillaText2=A logo "Powered by Mozilla" que está em nossa página inicial representa que Instantbird utiliza códigos e tecnologias desenvolvidas pela comunidade Mozilla. Somos muito gratos à comunidade Mozilla como um todo pela incrível tecnologia na qual which Instantbird é baseado.

getinvolvedTitle=Como posso fazer parte?
getinvolvedText=Existem diversas maneiras de fazer parte deste projeto. Não é exigido conhecimento de programação para nos ajudar. Veja mais detalhes na seção &getInvolvedLink;.
getInvolvedLink=Faça Parte

translateTitle=Posso ajudar na tradução de Instantbird para o meu idioma?
translateText=Sim! Veja como fazer isso na &translationWikiPageLink;.
translationWikiPageLink=seção de tradução em nossa página Wiki(em inglês)

createaddonsTitle=Como posso criar extensões?
createaddonsText=Veja detalhes na &extensionsWikiPageLink;.
extensionsWikiPageLink=seção de extensões em nossa página Wiki

fxaddonsTitle=As extensões de Firefox/Thunderbird podem funcionar no Instantbird?
fxaddonsText=Não diretamente, mas elas podem ser adaptadas (portadas). Veja detalhes na seção &portingFirefoxExtensionsPageLink;.
portingFirefoxExtensionsPageLink="porting Firefox"

followTitle=Como posso seguir processo de desenvolvimento atual?
followText1=Para estar informado das novidades, você provavelmente pode seguir &blogLink;.
blogLink=nosso blog
followText2=Se desejar acompanhar nossas discussões, sinta-se bem-vindo para se juntar ao nosso canal no IRC: &ircRoomLink;.
ircRoomLink=#instantbird em irc.mozilla.org server
followText3=&nightlyBuildsLink; são produzidos diaraimente, portanto todos são bem-vindos para nos ajudar a testar os recursos adicionados. Sinta-se a vontade para usá-los, mas fique atento! Eles ainda não estão estáveis, e se decidir usá-lo, espera-se que faça isso para nos ajudar a testar os recursos do aplicativo, ao invés de "brincar com o brinquedo novo". Caso encontre algum bug, por favor, &reportBugLink; (&filingABugLink;: Com o que um relatório de bug deve conter) em vez de ficar resmungando.
reportBugLink=relate-o
nightlyBuildsLink=Nightly builds
filingABugLink=Arquive um bug

whatsnextTitle=O que se deve esperar na próxima versão de Instantbird?
whatsnextText=Veja detalhes em &roadmapLink;.
roadmapLink=roadmap

whenTitle=Quando será lançado uma versão mais recente?
whenText=Estamos muito empolgados com este projeto e gratos com o seu interersse de avançarmos o mais rápido possível. No entanto, devido à natureza de desenvolvimento de software, é um desafio divulgar datas de lançamentos. Focamos na qualidade en vez da quantidade.

futurefeaturesTitle=Instantbird terá suporte à transferência de arquivo, conversas por vídeo/áudio <em>ou outras ferramentas</em>?
futurefeaturesText1=Veja mais informações em &roadmapLink;.
futurefeaturesText2=Sinta-se livre para debater conosco ideias que não foram listadas, e se podem ser interessantes, ou que possam ser implementadas como uma extensão.
