instantbirdBecause=Produzimos o Instantbird porque...
weBelieveImportantComponentOnlineLife=acreditamos que os mensageiros instantâneos fazem parte de <em>sua vida digital</em>.
weBelieve=Nós acreditamos:

deservesMoreAttention=que deve-se dar mais importância ao mensageiro instantâneo: Dada o tempo gasto usando um mensageiro instantâneo, pode-se reservar algum tempo para escolher um que <strong>se adapte a você</strong>.
solidAlternative=que deveria existir uma <strong>alternativa sólida</strong> para os mensageiros instantâneos atuais.
reclaimControl=mensageiro instantâneo é parte de sua vida digital dos quais <strong>você possa ter o controle</strong>.

shouldBeEasyReliableFunEmpowering=Ele deveria ser <strong>descomplicado, confiável, divertido e capacitado</strong>
shouldJustWork=Ele deveria <strong>funcionar</strong>! A proposta de um mensageiro instantâneo é te deixar conversar, facilitando a sua vida. Você quer usá-lo, ao invés de perder seu tempo adaptando-se a ele.
relyOnIt=Mensageiro instantâneo não é mais um brinquedo, mas uma meio de comunicação para assuntos importantes. Por isso, precisa ser <strong>estável</strong>, para garantir que <strong>você possa contar com ele</strong>.
customizeIt=Caso passe a usá-lo com frequência, você deve ser capaz de <strong>fazê-lo mais pessoal</strong>. Você precisa do <strong>poder para decidir como ele deve ser</strong>, para <strong>&customizeItLink;</strong>.
customizeItLink=personalizá-lo

respectTheUser=Um mensageiro instantâneo deve <strong>respeitar o usuário</strong>
privacy=Privacidade
privacyText=Mensageiro instantâneo trabalha com dados íntimos e pessoais, por isso é necessário ter o controle de seus dados.
freedom=Liberdade
freedomText=Não deve existir <strong>surpresas</strong> quando estiver usando um mensageiro instantâneo. Deve-se apenas <strong>fazer o que você quer</strong>.

openSource=Por isso, ele deve funcionar de forma <strong>aberta e transparente</strong>. Por esse e outros motivos que <strong>Instantbird é um software open-source</strong>.

shouldBeAccessibleAdapted=Um mensageiro instantâneo deve ser <strong>acessível</strong>, que <strong>se adapte ao usuário</strong>
adaptedToYourNeeds=<strong>Seu idioma, conehcimentos em informática, isitema operacional, ou habilidades não devem ser obstáculos</strong>; o software deve-se adaptar às suas necessidades ao invés de exigir que você se adapte a ele.

bringBackInnovation=A experiência com mensageiros instantâneos deve ser prazerosa, mas tem-se desenvolvido muito pouco com o passar dos anos. É hora de <strong>trazer de volta a inovação</strong>! Nosso objetivo é trazer para o Instantbird todas essas crenças, e  convidamos todos a ser nossos usuários.


gettingInvolved=Faça parte:

joiningUs=Se compartilha de nossas crenças, você é um potencial interessado em juntar-se ao nosso projeto. Existem <strong>numerosas maneiras de fazer parte</strong> e algumas delas não requerem um conhecimento técnico:

feedbackAndIdeas=Mande feedbacks, contribua com ideias
knowHowItWorksForYou=É importante saber como Instantbird funciona para você, para que possamos melhorá-lo de maneira a torná-lo mais útil para você.
severalWaysToSendFeedback=Existem diversas maneiras de enviar para nós o feedback, incluindo:  enviar relatórios de falhas (crash reports), &filingBugsLink;, ou falando conosco. Se ainda possui dúvidas, sinta-se a vontade para &getInTouchWithUsLink;.
filingBugsLink=arquivando bugs
getInTouchWithUsLink=entrar em contato
comeDiscussYourIdeas=Motivamos você a participar conosco com suas ideias para futuros aprimoramentos. Apreciamos isso de verdade. Poderão inserí-lo nas versões futuras, ou podem interessar a algum autor de extensões!

spreadTheWord=Espalhem as sementes!
talkAboutIt=Conte aos seus amigos, colegas e parentes sobre Instantbird: Conte para eles o que gostou e porque você acha que isso possa interessá-los. Ajude-os durante o processo de instalação (especialmente na hora de conectar suas contas). Perguntem a eles e ainda usam o Instantbird e/ou que problemas eles encontraram. Caso eles tenham encontrado erros, ceretifique-se que esses erros sejam informados para nós. (veja 'Mande feedbacks' acima).

testPreReleaseVersions=Testar versões de pre-lançamentos
alphaBetaNightly=Nós lançamos versões alpha e beta, portanto você pode enviar feedbacks sobre novos recursos. Se desejar acompanhar mais de perto o desenvolvimento, nós temos versões (nightly builds) para que você teste.
pleaseReportIssues=Por favor, relate qualquer falha que possa encontrar.

helpOtherInstantbirdUsers=Ajudem outros usuários de Instantbird!
answerQuestionsOnIRC=Se você costuma estar em nossa sala de chat no IRC com frequência, você pode tirar dúvidas de outros usuários que precisam de ajuda. Ajude-os, mesmo que pareça que os outros já possuem mais conhecimento. Se começar a ajudar alguém e descobrir que não sabe como resolver a questão, não se preocupe! Outros irão ajudá-lo!

translate=Tradução
translateInstantbirdIntoYourLanguage=Para ajudar-nos a oferecer Instantbird a um público maior, você pode &translateInstantbirdLink; para o seu idioma.
translateInstantbirdLink=traduzir Instantbird

addonDevelopment=Desenvolvimento de Extensão
createEditReviewAddons=&createAddonLink;, &reviewAddonsLink; e edite extensões, e assim permitir a outros fazer de Instantbird uma aplicação ideal. Muito obrigado.
createAddonLink=Crie
reviewAddonsLink=revise

contributeCode=Contribuir com o código
weCanHelpYou=Para aqueles que possuem mais conhecimento técnico, podem contribuir com patches.</p><p>Provavelmente terá que &compilingABuildYourselfLink;. Fale conosco durante o processo,podemos te ajudar a começar agora mesmo!
compilingABuildYourselfLink=compilar uma versão você mesmo
