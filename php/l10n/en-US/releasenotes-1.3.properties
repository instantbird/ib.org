whatsNew=What's new?

improvedAccessibility=Major <strong>accessibility improvements</strong>.

ircImprovements=IRC improvements
longMessages=Long messages will be sent in multiple parts instead of being cut off.
SASLAuth=SASL authentication is now supported, this is required for certain IP ranges or when using Tor and connecting to Freenode.

twitterImprovements=Twitter improvements
ownDescription=Your own description is now shown (and editable) above the timeline.
replyToAll=Replying to a tweet now replies to all users, just like on the Twitter website!
twitterTabIcon=The tab icon for Twitter timelines is now the Twitter bird to more explicitly differentiate a timeline from a chat window.

showNick=The "Show Nick" add-on was integrated. This highlights when a user's nickname is mentioned in a chat to easily see conversations that are occurring. We hope you will enjoy this new feature, but if you don't you can disable it by setting the advanced preference "messenger.conversations.showNicks" to false in about:config.

newXMPPNetworks=Two new social networks were added via XMPP: <strong>Odnoklassniki</strong> and <strong>VKontakte</strong>.

underTheHood=Under the Hood
basedOnLibpurpleAndMozilla=<strong>Updated:</strong> Instantbird &versionNumber; is based Mozilla &mozillaVersion; which brings great &newPossibilitiesForAddonsDevelopersLink; and uses libpurple &libpurpleVersion;. This is the last Instantbird release supporting Mac OS 10.5 and PPC as these will not be possible to support with Mozilla 17.
newPossibilitiesForAddonsDevelopersLink=new possibilities for add-on developers
memoryReporters=The memory consumed by libpurple and its dependencies is now tracked in about:memory.
andMore=And more... read the full &changeLogLink; for details of the &codeChangesCount; code changes since Instantbird 1.2.
changeLogLink=ChangeLog
