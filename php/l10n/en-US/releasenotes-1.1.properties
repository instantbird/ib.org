whatsNew=What's new?

conversationsCanBePutOnHold=Conversations can now be placed on hold:
putOnHoldFromContextMenu=A conversation can be put on hold from the context menu of the conversation tab. Conversations on hold are listed at the top of the Contacts window, where it is easy to reopen them with a double click.
noMoreMissedMessages=Closing conversation tabs cannot cause you to miss messages any more: when closing a conversation tab with unread messages, the conversation will automatically be put on hold instead of being closed.
closingChatPutsOnHold=Closing a chat room tab will put its conversation on hold instead of leaving it.
newMessageReopens=If a new message arrives in a conversation on hold, its tab will reappear automatically. (For chat rooms, this will only happen if your nick is mentioned).
unreadCount=The number of unread messages in each conversation on hold is clearly indicated; this will prove to be useful for IRC channels where you are idling!

improvedTraySupport=Improved Tray Support for Linux/Windows:
singleClickRestore=Restore the contact list with a single click on Linux.
trayIconEvenWhenNotMinimized=The Instantbird tray icon is visible even when the application is not minimized.

improvedTwitterSupport=Improved Twitter support:
twitterEntities=Twitter entities (@mentions, #hashtags and shortened links) are now supported.
retweetAndReply=Messages can now be retweeted and replied to (by using the context menu).
followUnfollow=Tweeters can be followed and unfollowed directly from the context menu of their tweets.

sametimeSupport=IBM Lotus <strong>Sametime</strong> is supported, by popular demand.

chatParticipantsTooltip=Chat participants now have tooltips
whoisInfo=Whois information for IRC is fetched and displayed automatically

tabCompletion=Tab completion for IRC nicks, Twitter usernames and commands.

interruptionsManagerAPI=The new <strong>Interruptions manager API</strong> allows add-on developers to easily create add-ons to reduce annoyances:
eventsFiltered=Events can be filtered based on their details (type, source, ...) to customize which actions are allowed to happen.

fixedICQSettings=The default ICQ settings have been updated to work with their new servers. 

unknownCommandsNoLongerSent=Unknown commands are no longer sent to IRC/XMPP chat rooms.

updated=Updated
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; is based on libpurple &libpurpleVersion; and Mozilla &mozillaVersion; which brings great &newPossibilitiesForAddonsDevelopersLink;.
newPossibilitiesForAddonsDevelopersLink=new possibilities for add-on developers

improvedStability=Improved stability
improvedStabilityDescription=the crash reports from the 1.0 release and the nightly builds have been taken into account to fix bugs that caused frequent crashes.

andMore=And more... read the full &changeLogLink; for details of the &codeChangesCount; code changes since Instantbird 1.0.
