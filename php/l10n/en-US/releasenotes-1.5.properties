whatsNew=What's new?

newTabIntro=Creating a <strong>new conversation tab</strong> has been made easier.
newTabOpeningTheTab=Clicking the '+' button in a conversation window shows a list of conversations that can be started with a single click.
newTabFrecency=The list is sorted with a frecency algorithm, taking into account how often and how recently you've talked to each contact.
newTabChannelList=This list also automatically includes the channels advertised by the IRC servers you are connected to.

newTooltips=<strong>New tooltips</strong> that better fit the style of Instantbird

improvedMUCsIntro=Improved Multi-user chats user interface:
improvedMUCsContextMenu=Participants now have context menus that allow you to open private conversations or add them as buddies.
improvedMUCsHighlightedNicks=Highlighted nicks in chat rooms now have tooltips and context menus.

improvedRTLSupport=Better support for displaying RTL languages in conversations.

hangoutMobileStatus=Google Talk and Hangouts Android users are now shown as mobile.

ircAlternateNicks=A list of alternate nicks for IRC can be configured, in case your preferred nick is taken when you connect.

retinaSupport=Retina display support on Mac OS X.

autojoinToHold=Auto-joined chat rooms that have been put on hold will stay on hold after a restart.

aboutPagesInTabs=about: pages (e.g. about:config) can now easily be opened with the /about command (e.g. /about config).

hangoutTypingFix=Google Hangouts users will no longer appear as always typing.

variousFixes=Various minor bugs and a few crashers fixed.

mozilla25=Updated to Mozilla 25.

vkontakteDropped=The vKontakte protocol was removed as the vKontakte service dropped support for connecting with an XMPP client.

tabbrowserAPILinkText=in-code documentation
tabbrowserAPI=New for developers: New API to add tab panels with arbitrary content to conversation windows: &tabbrowserAPILink;.

knownIssues=Known Issues:

nvdaMozillaBug=NVDA users should update to 2014.1 to work around a bug in the Mozilla platform that leads to "Unknown" being said when scrolling through the contact list.

bug1995LinkText=bug 1995
linkHandlerLinux=Clicking on URLs doesn't work on some newer Linux distributions, to work around this, open about:config (/about config in a conversation) and search for network.protocol-handler.warn-external, set all of these values to true. You will now be prompted for a program after clicking these links. See &bug1995Link;.

andMore=And more... read the full &changeLogLink; for details of all code changes since Instantbird 1.4.
