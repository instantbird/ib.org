whatsNew=What's new?

logViewer=The <strong>log viewer</strong> shows conversations just like the conversation view, thanks to a new JSON-based log file format that stores meta-data along with the text of the conversation.
bonjour=Support for <strong>Bonjour</strong> has been added (requires the &bonjourPrintServicesLink; on Windows or &avahiLink; on Linux).
bonjourPrintServicesLink=Bonjour Print Services

mucInterface=Improved user interface for <strong>multi-user chats</strong>:
tabComplete=<strong>Better tab completion</strong>, see our &tabCompleteBlogPostLink; for details.
tabCompleteBlogPostLink=blog post
activeNicks=It is easier to tell who is active, as only nicknames of participants who have talked are coloured in the participant list.

ircEnhancements=IRC enhancements:
channelsReconnect=Channels are automatically rejoined after reconnects.
ircStatus=Instantbird tracks the status of IRC contacts more precisely by using the WATCH or MONITOR commands, if they're supported.
ircChanServ=ChanServ messages are displayed in the channel they reference.
ircNickServ=No more noisy messages from NickServ interrupting you after a successful automatic identification on login.

encryptedPasswords=Passwords are now stored in the Mozilla password manager for improved security. As in Firefox and Thunderbird, it's possible to protect them with a master password.
popularAccounts=Easily create new accounts now that the account wizard offers a list of the most popular networks first and shows all supported networks on demand.
systemTrayStatus=Better <strong>system tray</strong> integration: you can now change the status directly from the icon's context menu.
lastReadMarker=Quickly find where you left off in a conversation: The position of the first unread message is now marked visually (and you can quickly jump there by pressing Alt-PgUp/PgDn or swiping).
conversationRestore=Restoring long conversations will now show a progress bar instead of freezing the user interface until all the messages are loaded.
contextMessages=Previously read ("context") messages are now distinguishable from new messages (when restoring from hold) in all default message styles. These styles now also respect the font setting from Preferences->Content.
keyboardNavigation=Keyboard navigation of conversations has been improved by allowing scrolling from an (empty) input textbox: just use the arrow keys, Page Up/Down, or Home/End! There are also new shortcuts for putting a conversation on hold (ESC) and opening the log viewer (Ctrl+Shift+H, like "History" on Firefox).
accessibilityImprovements=Major <strong>accessibility</strong> improvements have been made to new messages, contact groups and contacts.

addonDevelopers=For Add-on Developers:
soundPreferences=Control sound preferences more precisely: for example &advancedSoundControlsLink;.
advancedSoundControlsLink=Advanced Sound Controls
reorderContacts=Reorder the contact list: for example &sortByStatusLink;.
sortByStatusLink=Sort By Status
addNewProtocols=It's now possible to easily add new protocols using JavaScript: for example &vznetChatsLink;.
vznetChatsLink=VZnet Chats

underTheHood=Under the Hood
extensibleProtocols=We now have our own extensible JavaScript implementations for:
facebookAndGoogleProtocols=<strong>Facebook Chat</strong> and <strong>Google Talk</strong>, based on our own <strong>XMPP</strong> protocol plugin (from Google Summer of Code 2011).
ircProtocol=IRC
basedOnLibpurpleAndMozilla=<strong>Updated:</strong> Instantbird &versionNumber; is based Mozilla &mozillaVersion; which brings great &newPossibilitiesForAddonsDevelopersLink; and uses libpurple &libpurpleVersion;.
newPossibilitiesForAddonsDevelopersLink=new possibilities for add-on developers
mplLicense=The license of most of the code was updated to the &mplLink;, official builds of Instantbird &versionNumber; are distributed under the &gplLink;.
mplLink=Mozilla Public License (MPL) 2.0
gplLink=GNU Public License 2.0 or later
libqq=We're using libqq-pidgin now for <strong>QQ</strong> since QQ is no longer included in libpurple.
platformChanges=Platform changes forced us to drop support for Windows 2000 and Windows XP before Service Pack 2. Please upgrade to Windows XP SP2 or later.

andMore=And more... read the full &changeLogLink; for details of the &codeChangesCount; code changes since Instantbird 1.1.
changeLogLink=ChangeLog

