whatsNew=What's new?

logViewerDateTree=The log viewer now groups your conversations by date.

twitterImprovements=Twitter improvements
characterCounter=The character counter for Twitter has been improved to take into account automatic link shortening, allowing you to <strong>easily tweet links</strong> without worrying about their length!
twitterAPIUpgrade=Updated to the Twitter API v1.1, note that Instantbird 1.3 may stop working with Twitter on June 11th, 2013!
followedPeopleInTimeline=Twitter now includes everyone you follow as a participant in your timeline.

ircAuthImprovements=<strong>IRC authentication</strong> works better with bouncers (e.g. ZNC).
ircOverrideCerts=You can now easily override <strong>self-signed/invalid/out-of-date certificates</strong> for IRC servers.
debugLogs=Each account now keeps <strong>debug logs</strong> which can be accessed by right clicking on the account in the Account Manager and choosing "Copy Debug Logs", these contain essential information for developers to diagnose user issues. (Note that debug logs MAY contain sensitive information.)

underTheHood=Under the Hood
basedOnLibpurpleAndMozilla=<strong>Updated:</strong> Instantbird &versionNumber; is based on Mozilla &mozillaVersion; and uses libpurple &libpurpleVersion;!
droppedOldMacOSSupport=Mac OS X < 10.6 is no longer supported, please upgrade your operating system or continue using Instantbird 1.3.
