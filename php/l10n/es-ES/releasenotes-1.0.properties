whatsNew=¿Qué hay de nuevo?
redesignedContactsWindow=Ventana de contactos rediseñada:
contactMerging=Fusión de contactos
contactMergingDescription=si hablas a la misma persona en múltiples redes de MI, ahora puedes combinar los nombres de usuario de esa persona de cada red en un único contacto. Al abrir un nuevo chat, se escogerá automáticamente el nombre de usuario que está conectado y la ventana de la conversación cambiará ella sola al nombre de usuario aplicable si se cambia a una red de MI distinta.
tags=Etiquetas
tagsDescription=las etiquetas se usarán para reemplazar los grupos en la lista de amigos. Las etiquetas pueden ocultarse haciendo clic en la "x" a la derecha de la lista de amigos, todos los amigos de esta lista irán automáticamente a una etiqueta "Otros contactos", que se muestra al final de la lista de amigos.
contactsWindowCanNowBe=La ventana de contactos ahora puede ser...
closedOnMac=cerrada en Mac sin salir de Instantbird; puede ser reabierta desde el Dock.
minimizedToTrayOnWindowsAndLinux=<strong>minimizada en la bandeja del sistema</strong> en Windows y Linux. Por defecto, cerrar (pulsando la 'x') en la lista de amigos la minimizará a la bandeja; esto puede cambiarse en las preferencias.
buddyIcon=Los usuarios ahora pueden establecer su <strong>icono de amigo</strong> y el <strong>nombre mostrado</strong> de sus cuentas directamente en la lista de contactos.
contactListSorted=<strong>La lista de contactos está ordenada</strong> alfabéticamente (tanto los grupos como los contactos aparecen ordenados).
nicerAnimations=Animaciones más agradables.
twitterSupport=Compatible con Twitter
twitterSupportDescription=cuando la cuenta Twitter está conectada, se abre automáticamente una conversación con la cronología. Si la conversación se cierra por el usuario, se reabre automáticamente cuando llegan nuevos mensajes. El usuario debería desconectar la cuenta desde el administrador de cuentas para evitar que se muestren nuevos mensajes.<br />Hay una opción avanzada "palabras clave vigiladas" que permite especificar palabras a monitorizar. Esta es una lista de palabras clave separadas por coma. Coma significa O, espacio dentro de una palabra clave significa Y.
topConversationUI=Nueva <strong>barra de información en la parte superior del diálogo de la conversación</strong>, que muestra el icono del amigo, el nombre mostrado y el estado actual de tu contacto. Además, puedes cambiar la red de MI que estás usando para la conversación haciendo clic en el icono del protocolo.
updatedTabStyling=El <strong>diseño de pestañas</strong> de conversación ha sido <strong>actualizado</strong> para ajustarse a Firefox 4, y los usuarios de las versiones más recientes de Windows apreciarán algunos <strong>efectos de Aero glass</strong>.
timeBubbles=Globos, el tema de mensajes por defecto, ha recibido nuevas características relacionadas con el tiempo, visita nuestro &blogPostLink; para más detalles.
blogPostLink=artículo de blog
jumplist=(Windows 7 únicamente) <strong>Implementadas listas de accesos rápidos</strong> para cambiar rápidamente el estado.
jsProto=Bajo el capó: los plugins de protocolos ahora se pueden implementar en JavaScript.
minorImprovements=Montones de pequeñas mejoras, entre ellas:
jumpToTab=Ahora puedes saltar rápidamente a la enésima pestaña usando &lt;modificador&gt;+&lt;n&gt; en la ventana de conversaciones, donde &lt;modificador&gt; es Ctrl en Windows/Linux y Command en Mac.
helpCommand=Se ha añadido una orden de ayuda ('/help') para ver rápida y fácilmente qué órdenes hay disponibles en la conversación actual.
unknownStatus=El estado Desconocido ahora se diferencia del estado sin conexión con iconos diferentes.
darkSimple=Variante oscura del tema "Simple".
updated=Actualizado
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; está basado en libpurple &libpurpleVersion; y Mozilla &mozillaVersion; que trae grandes &newPossibilitiesForAddonsDevelopersLink; (&restartLessAddonsLink;).
newPossibilitiesForAddonsDevelopersLink=nuevas posibilidades para los desarrolladores
restartLessAddonsLink=complementos que no precisan reiniciar, por ejemplo
improvedStability=Estabilidad mejorada
improvedStabilityDescription=usamos los informes de fallos que obtuvimos de las versiones 0.2 y 0.3 y binarios diarios para corregir bugs que provocaban caídas.
andMore=Y más... lee el &changeLogLink; completo para más detalles de los &codeChangesCount; cambios en el código desde Instanbird 0.2).
changeLogLink=registro de cambios
knownIssues=Problemas conocidos
cannotReopenTwitterTimeline=Tras cerrar el cronograma de Twitter, no puede ser reabierto manualmente para enviar un tuit; se reabrirá automáticamente él solo al recibir un tuit.
