keyFeaturesNotesPageTitleSuffix=características clave
instantbirdFeatures=Características de Instantbird
awesomenessToMakeIMBetterForYou=Uniendo toda la genialidad para ofrecerte la mejor mensajería instantánea.
allYourFriendsTitle=Habla con todos tus amigos
allYourFriendsDesc1=¡Con Instantbird puedes hablar ahora con todos tus amigos en una sola aplicación!
allYourFriendsDesc2=¡Es compatible con AIM, Yahoo, MSN, Google Talk, Facebook e incluso Twitter!
troubleFreeTitle=No te causará problemas
troubleFreeDesc1=Instantbird ha sido diseñado teniendo en cuenta la máxima estabilidad y simplicidad.
troubleFreeDesc2=Disfrutarás de una interfaz de usuario nítida: ¡nada te distraerá de tus conversaciones!
troubleFreeDesc3=Nada de publicidad, no te molestará ningún contenido que no desees.
conversationsInTabsTitle=Conversaciones en pestañas
conversationsInTabsDesc1=Las conversaciones se agrupan en pestañas, lo que te asegura que no te sentirás agobiado por ventanas de conversaciones que emergen por todos sitios.
conversationsInTabsDesc2=Las pestañas son fáciles de usar: puedes arrastrarlas para reorganizarlas o mover una conversación a una ventana nueva.
customizableConversationsTitle=Conversaciones personalizables
customizableConversationsDesc1=Con algunos temas de mensajes cuidadosamente diseñados que está disponibles de manera predeterminada y cientos más que lo están como complementos, ya tienes todo los que necesitas para personalizar tus conversaciones.
customizableConversationsDesc2=¡Hagamos que sean una experiencia agradable y llena de color!
smartContactsTitle=Contactos inteligentes
smartContactsDesc1=¿Tienes varias formas de contactar con la misma persona?
smartContactsDesc2=No hay ningún problema, simplemente deja caer un contacto sobre otro e Instantbird sabrá que se trata de la misma persona.
alwaysHereForYouTitle=Siempre a tu disposición
alwaysHereForYouDesc1=Instantbird funciona en todos los equipos, ya sean Windows, Mac OS X o Linux.
alwaysHereForYouDesc2=Al ser gratuito y de código abierto, nunca tendrás que pagar por usarlo.
alwaysHereForYouDesc3=¡No tendrás que aprender a usar otro cliente de MI nunca más!
limitlessExtensibilityTitle=Extensibilidad sin límites
limitlessExtensibilityDesc1=Herramientas potentes como la búsqueda en línea o el zoom están integrados para ayudarte a sacar lo máximo de tus conversaciones.
limitlessExtensibilityDesc2=Hay más disponibles como complementos, gracias a la extensibilidad sin límites de Instantbird.
