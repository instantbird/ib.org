faqPageTitleSuffix=Preguntas frecuentes
faq=Preguntas frecuentes
summary=Resumen

installing=Instalación

useexistingaccountsTitle=¿Tendré que proporcionar nueva información de contacto a mis amigos?
useexistingaccountsText=No, con Instantbird puedes usar todas las cuentas de mensajería instantánea que tengas en una sola aplicación. Si ya usas mensajería instantánea, no necesitas crear una cuenta nueva para comenzar a usar Instantbird.

systreqTitle=¿Funcionará Instantbird en mi equipo?
systreqText=Instantbird funciona actualmente en &sysReqWinVersion; o posterior, &sysReqMacVersion; o posterior y Linux. Revisa la página de &systemRequirementsLink; para tener más información.
systemRequirementsLink=requisitos del sistema

getlatestTitle=¿Qué debo descargar para obtener la última versión de Instantbird?
getlatestText=Un enlace en la &homePageLink; te seleccionará automáticamente la versión de Instantbird más adecuada para tu sistema. Si quieres seleccionar tú mismo tu sistema operativo e idioma, ve a la &downloadPageLink;.
homePageLink=página de inicio
downloadPageLink=página de descargas

installasuserTitle=¿Puedo instalar Instantbird sin ser administrador de mi equipo?
installasuserText=¡Por supuesto!

sideinstallTitle=¿Puedo instalar Instantbird y conservar mis clientes de mensajería anteriores en mi equipo?
sideinstallText=¡Por supuesto! Instantbird y otros clientes pueden coexistir en el mismo equipo sin causar ningún problema.

installwindowsTitle=¿Cómo instalo Instantbird en Windows?
installwindowsText=Instantbird está empaquetado para Windows como un instalador ejecutable. Sólo tiene que ejecutar el archivo que ha descargado y dejar que le guíe a través del proceso de instalación.

installmacTitle=¿Cómo instalo Instantbird en Mac OS X?
installmacText=Haz doble clic en la imagen de disco de Instantbird (un archivo con un nombre que termina en ".dmg") que has descargado. Luego arrastra el icono de Instantbird a la carpeta Aplicaciones.

installlinuxTitle=¿Cómo instalo Instantbird en Linux?
installlinuxText1=Extrae el contenido del archivo descargado y ejecuta el archivo llamado "instantbird". Si aparece un cuadro de diálogo que te pregunta si deseas editar o ejecutar el archivo, selecciona "ejecutar".
installlinuxText2=Actualmente solo proporcionamos binarios de 32 bits. Para poder ejecutarlos en un sistema de 64 bits, tienes que instalar las bibliotecas para compatibilidad con 32 bits que proporciona tu distribución. Por ejemplo, en Ubuntu, instala el paquete <code>ia32-libs</code> ejecutando <code>sudo apt-get install ia32-libs</code> desde la línea de comandos.

portableTitle=¿Es portable Instantbird (o sea, se puede usar desde una llave de memoria USB)?
portableText1=Si inicias Instantbird desde una llave de memoria USB, por defecto guardará tu perfil de usuario en el disco duro.
# Do NOT translate '-profile' here, it's a command line parameter.
portableText2=Puedes decirle a Instantbird que guarde tu perfil de usuario en la llave de memoria USB usando el argumento de la línea de órdenes <code>-profile</code>.
portableText3=Para hacer esto, haz clic con el botón derecho en el archivo <code>instantbird.exe</code> y selecciona "Crear acceso directo", luego en las propiedades del acceso directo, edita el destino y añádele <code> -profile ./<em>nombre_carpeta</em></code>.


updating=Actualización

autoupdateTitle=¿Hay algo que necesite hacer para seguir usando la última versión de Instantbird?
autoupdateText1=No, por defecto Instantbird buscará actualizaciones periódicamente y te pedirá permiso para actualizarse a una nueva versión, en caso de encontrarla.
autoupdateText2=Si no te gusta este comportamiento, puedes modificarlo desde el diálogo de preferencias.

forceupdateTitle=¿Qué pasa si quiero actualizar ahora?
forceupdateText=Hay una opción de menú <em>Buscar actualizaciones</em> (accesible desde el menú <em>Ayuda</em>) para que no tengas que esperar a la petición de actualización si sabes que existe una actualización.

overwriteTitle=¿Puedo instalar una nueva versión sobre una existente?
overwriteText=Sí.

addonsafterupdateTitle=¿Seguirán funcionando mis complementos tras una actualización?
addonsafterupdateText1=Los complementos compatibles seguirán funcionando tras la actualización. Si un complemento no es compatible con la versión actualizada de Instantbird, este te propondrá comprobar si hay disponible una nueva versión del complemento para actualizarlo.
addonsafterupdateText2=Si tu complemento deja de funcionar tras una actualización, tal vez desees contactar con el autor para averiguar si está preparando una versión actualizada.


uninstalling=Desinstalación

removeTitle=¿Cómo puedo desinstalar Instantbird?
removeText1=En Windows, si has usado el instalador, puedes desinstalar Instantbird del panel de control igual que desinstalarías cualquier otra aplicación.
removeText2=En los demás casos, sólo tienes que eliminar la carpeta de Instantbird.
removeText3=Eliminar Instantbird no borrará tus cuentas, historial de charlas, extensiones u otros complementos. Estos datos se guardan en tu &profileFolderLink;.
profileFolderLink=carpeta del perfil
removeText4=Cualquier versión de Instantbird que instales tras eliminar Instantbird continuará usando los datos de esa carpeta.

using=Uso
severalaccountsTitle=¿Puedo usar varias cuentas a la vez?
severalaccountsText1=Sí, puedes estar conectado al mismo tiempo a varias cuentas de cualquiera de los protocolos admitidos.
severalaccountsText2=Usa el <em>Administrador de cuentas</em> (accesible desde el menú <em>Herramientas</em>) para añadir otra cuenta.

supportedprotocolsTitle=¿Con qué protocolos es compatible?
supportedprotocolsText3=Actualmente Instantbird admite por defecto: AIM, Bonjour, Facebook Chat, Gadu-Gadu, Google Talk, Groupwise, ICQ, IRC, MSN, MySpaceIM, Netsoul, Odnoklassniki, QQ, Simple, Twitter, VKontakte, XMPP, Yahoo y Yahoo JAPÓN.
supportedprotocolsText2=Pueden instalarse plugins con protocolos adicionales como &addonsLink;.
addonsLink=complementos

facebookusernameTitle=Cuando intento conectarme a mi cuenta de Facebook obtengo el mensaje de error <code>ID XMPP no válido</code>. ¿Cuál es el problema?
facebookusernameText=Has introducido como nombre de usuario la dirección de correo que usas para iniciar sesión en el sitio web de Facebook. Facebook chat espera que uses tu nombre de usuario único en este campo. Ve a &facebookLink; para comprobarlo.

facebookauthorizationTitle=Cuando intento conectarme a mi cuenta de Facebook obtengo el mensaje de error <code>No autorizado</code>. ¿Cuál es el problema?
facebookauthorizationText=Necesitas activar las conexiones XMPP a tu cuenta de Facebook.
facebookauthorizationText1=Visita &facebookChatLink; mientras estás conectado a tu cuenta de Facebook para activar el acceso XMPP.
facebookChatLink=Facebook Chat
facebookauthorizationText2=Cierra sesión en el sitio web de Facebook.
facebookauthorizationText3=Inicia sesión de nuevo en el sitio web de Facebook.
facebookauthorizationText4=Conecta tu cuenta Facebook en Instantbird ("Herramientas" > "Cuentas" y pulsa el botón "Conectar" en tu cuenta Facebook) y debería completarse correctamente.

getaddonsTitle=¿Dónde puedo conseguir complementos (extensiones y temas)?
getaddonsText=Puedes buscar complementos desde la pestaña <em>Obtener complementos</em> del administrador de complementos (accesible desde el menú <em>Herramientas</em>) donde verás algunos complementos recomendados. Para ver más, puedes ir a &addonsWebsiteLink; donde puedes también explorar complementos experimentales y publicar valoraciones.
addonsWebsiteLink=sitio web de complementos de Instantbird

logsenabledTitle=¿Crea Instantbird registros de mis conversaciones y chats?
logsenabledText=Sí, Instantbird crea archivos de registro por defecto. Usa las opciones en el panel <em>Privacidad</em> en el diálogo <em>Opciones</em> para configurarlo a tu gusto. Si te gusta echar un vistazo a los archivos mismos, usa el botón <em>Mostrar carpeta de registros...</em> en el mismo panel.

logfolderTitle=¿Dónde se guardan los registros?
logfolderText=El nombre y ruta de los archivos de registro es como sigue: <code><em>&profileLink;</em>/logs/<em>protocol</em>/<em>amigo o nombre de chat</em>/<em>fecha y hora</em>.txt</code> (sustituye las partes en cursiva por valores reales).
profileLink=ruta al perfil

profilefolderTitle=¿Dónde está mi carpeta del perfil?
profilefolderText1=Está situado en una de las siguientes ubicaciones dependiendo de tu sistema operativo:
profilefolderTextCopyAndPaste=copia y pega exactamente esto en el explorador de Windows
profilefolderTextReuse=Cualquier versión de Instantbird que instales tras eliminar Instantbird continuará usando los datos de esta carpeta del perfil.

aboutconfigTitle=¿Puedo acceder a about:config para ajustar en detalle algunas preferencias?
aboutconfigText=Si bien te aconsejamos no hacerlo, about:config está disponible desde la pestaña <em>Avanzado</em> del diálogo de preferencias.


development=Desarrollo

whyTitle=¿Por qué hacéis Instantbird?
whyText=Te ofrecemos Instantbird porque &weBelieveLink;.
weBelieveLink=creemos que la mensajería instantánea es un componente importante de tu vida digital

licenseTitle=¿Qué licencia tiene Instantbird?
licenseText1=Instantbird está licenciado bajo los términos de la licencia GNU GPL versión 2.0 o posterior (porque usa libpurple, que está licenciado bajo GPL). Sin embargo, la mayoría del código fuente también está licenciado con la Mozilla Public License (MPL), versión 2.0.

getthesourceTitle=¿Dónde está el código fuente?
getthesourceText=Hay disponible un tarball del código fuente de cada versión publicada en la &downloadPageLink;. El último código de desarrollo puede obtenerse desde nuestro repositorio de código Mercurial siguiendo las &buildInstructionsLink;.
buildInstructionsLink=instrucciones de compilación

teamTitle=¿Quién hace Instantbird?
teamText=Somos un &teamLink; de personas altamente motivadas, pero esperamos que un montón de gente, incluyéndote a ti, se unan a nosotros para hacer este producto incluso mejor.
teamLink=un pequeño equipo

mozillaTitle=¿Patrocina Mozilla el proyecto?
mozillaText1=La fundación Mozilla no nos ha ayudado financieramente.
mozillaText2=El logo "Basado en Mozilla" en nuestra página significa que Instantbird se apoya en código y tecnologías desarrolladas por la comunidad Mozilla. Estamos muy agradecidos a la comunidad Mozilla en su conjunto por la tecnología increíble sobre la que se basa Instantbird.

getinvolvedTitle=¿Cómo puedo involucrarme?
getinvolvedText=Hay varias maneras de tomar parte en el proyecto. No necesitas ser un programador informático para ayudarnos. Visita &getInvolvedLink; para más detalles.
getInvolvedLink=involucrarse

translateTitle=¿Puedo ayudar a traducirlo a mi idioma?
translateText=¡Sí! Visita la &translationWikiPageLink; para tener más información.
translationWikiPageLink=página del wiki sobre traducción

createaddonsTitle=¿Cómo puedo crear complementos?
createaddonsText=Visita la &extensionsWikiPageLink;.
extensionsWikiPageLink=página del wiki sobre extensiones

fxaddonsTitle=¿Pueden funcionar los complementos de Firefox/Thunderbird en Instantbird?
fxaddonsText=No 'tal cual', pero la mayoría de ellos pueden ser adaptados. Visita la &portingFirefoxExtensionsPageLink;.
portingFirefoxExtensionsPageLink=página sobre portar extensiones de Firefox

followTitle=¿Cómo puedo seguir el esfuerzo de desarrollo actual?
followText1=Para estar informado de las noticias importantes, probablemente querrás seguir &blogLink;.
blogLink=nuestro blog
followText2=Si quieres seguir nuestras discusiones, eres bienvenido a unirte a nosotros en nuestra sala de chat de IRC: &ircRoomLink;.
ircRoomLink=#instantbird en el servidor irc.mozilla.org
followText3=A diario se generan &nightlyBuildsLink; para que la gente pueda ayudarnos a probar las características que han sido añadidas recientemente. Te animamos a usarlas, pero ¡cuidado! Puede que no sean estables, y si decides usarlas, se supone que lo harás para ayudarnos a probar las novedades más recientes, no sólo para ser un crío guay que ha sido el primero en conseguir un juguete. Así que, si encuentras fallos, por favor &reportBugLink; (&filingABugLink;: lo que debería contener un bug) en lugar de quejarte.
reportBugLink=repórtalos
nightlyBuildsLink=binarios diarios
filingABugLink=Registrar un bug

whatsnextTitle=¿Qué va a haber en la próxima versión?
whatsnextText=Visita la &roadmapLink;.
roadmapLink=hoja de ruta

whenTitle=¿Cuándo se publicará la próxima versión importante?
whenText=Estamos entusiasmados con este proyecto y nos agrada que compartas nuestro deseo de avanzar lo más rápido posible. Sin embargo, debido a la naturaleza del desarrollo de software, sería problemático dar fechas límite y consideramos más importante mantener la calidad.

futurefeaturesTitle=¿Permitirá Instantbird transferencia de archivos/chat de vídeo/<em>inserta aquí tu característica favorita</em>?
futurefeaturesText1=Visita la &roadmapLink;.
futurefeaturesText2=No dudes en comentarnos aquellas cosas que no aparecen aquí para saber si estamos interesados o si pueden ser implementadas como complementos.
