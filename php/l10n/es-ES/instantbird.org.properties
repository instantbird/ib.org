instantbirdBecause=Te traemos Instantbird porque...
weBelieveImportantComponentOnlineLife=Creemos que la mensajería instantánea es un componente importante de <em>tu</em> vida digital.
weBelieve=Creemos:
deservesMoreAttention=Que el software de mensajería instantánea merece más atención: dada la cantidad de tiempo que paamos usando la mensajería instantánea a diario, merece la pena emplear unos minutos en elegir el software que <strong>resulta apropiado para ti</strong>.
solidAlternative=Que debería existir <strong>una sólida alternativa</strong> al software de mensajería instantánea más popular.
reclaimControl=La mensajería instantánea es una parte de tu vida on-line de la cual <strong>puedes reclamar el control</strong>.
shouldBeEasyReliableFunEmpowering=Debería ser <strong>fácil de usar, fiable, divertido y potenciador para ti</strong>
shouldJustWork=¡Debería <strong>funcionar sin más</strong>! El propósito de un software de mensajería es permitirte comunicarte, sin entrometerse en tu camino. Quieres usarlo, no pasar tu tiempo peleándote con él.
relyOnIt=La mensajería instantánea ya no es un nuevo juguete, sino una manera viable de comunicación para asuntos críticos, por lo que debería ser <strong>muy estable</strong>, para asegurar que <strong>puedes confiar en ella</strong>.
customizeIt=Tanto si pasas mucho tiempo con él como si no, deberías poder <strong>adaptarlo a ti</strong>. Necesitas <strong>poder para decidir cómo debería ser</strong>, para <strong>&customizeItLink;</strong>.
customizeItLink=personalizarlo
respectTheUser=Un programa de mensajería instantánea debería <strong>respetar al usuario</strong>
privacy=Privacidad
privacyText=porque la mensajería instantánea involucra datos íntimos o confidenciales, deberías tener el control de cómo se maneja tu información.
freedom=Libertad
freedomText=no debería haber <strong>sorpresas</strong> al usarlo. Debería <strong>hacer justo lo que quieres</strong>.
openSource=Para asegurar que esto será siempre así, la manera en la que funciona debería ser <strong>abierta, transparente</strong>. Esto es por lo que importa que <strong>Instantbird sea software de código abierto</strong>.
shouldBeAccessibleAdapted=Un programa de mensajería instantánea debería <strong>accesible</strong>, <strong>adaptado al usuario</strong>
adaptedToYourNeeds=<strong>Tu idioma, conocimientos de tecnología, sistema operativo o capacidades no deberían ser una barrera</strong>; el software debe adaptarse a tus necesidades en lugar de obligarte a que te adaptes tú.
bringBackInnovation=La experiencia de usuario de la mensajería instantánea debería ser deliciosa, pero ha evolucionado muy poco durante los últimos años. ¡Es el <strong>momento de retomar la innovación</strong>! Nuestra meta es proporcionar todas estas ideas en Instantbird, y agradecemos la colaboración de todos nuestros usuarios.
gettingInvolved=Involucrarse:
joiningUs=Si compartes nuestras ideas, puede que te interese unirte a nosotros. Hay <strong>muchas maneras de involucrarse</strong> y algunas de ellas no requieren que tengas ningún conocimiento técnico:
feedbackAndIdeas=Proporcionar opiniones, colaborar con ideas
knowHowItWorksForYou=Es esencial que sepamos qué tal te funciona Instantbird, para que podamos mejorarlo de modo que lo hagamos más útil para ti.
severalWaysToSendFeedback=Hay varias maneras de enviar opiniones, incluyendo: enviar informes de fallos, &filingBugsLink;, o hablar con nosotros. Si tienes alguna pregunta, no dudes en &getInTouchWithUsLink;.
filingBugsLink=cursar bugs
getInTouchWithUsLink=contactar con nosotros
comeDiscussYourIdeas=No dudes en venir y discutir con nosotros las ideas que tengas para futuras mejoras. Lo apreciamos de verdad. ¡Pueden ser incluidas en una próxima versión o resultar de interés a algunos autores de complementos!
spreadTheWord=¡Haz correr la voz!
talkAboutIt=Habla a tus amigos, colegas y parientes de Instantbird: cuéntales lo que te gusta de él y por qué piensas que pueden estar interesados en probarlo. Ayúdales durante el proceso de instalación (especialmente a configurar sus cuentas). Pregúntales unos días más tarde si aún lo usan y si tienen algún problema con él. Si encontraron problemas, asegúrate de que ya los conocemos (mira 'Ofrece opiniones' más arriba).
testPreReleaseVersions=Prueba versiones previas
alphaBetaNightly=Publicamos versiones alfa y beta para que puedas dar tu opinión sobre las nuevas características. Si quieres seguir el desarrollo más de cerca, tenemos binarios diarios para que los pruebes.
pleaseReportIssues=Por favor, informa de cualquier problema que encuentres.
helpOtherInstantbirdUsers=¡Ayuda a otros usuarios de Instantbird!
answerQuestionsOnIRC=Si te pasas por nuestra sala de chat en IRC, puede que veas preguntas de otros usuarios que necesitan ayuda. No dudes en ayudarles incluso si crees que otras personas pueden tener más conocimientos que tú. Si comienzas ayudando a alguien y descubres que no sabes la solución, ¡no te preocupes! ¡Otros continuarán tu trabajo!
translate=Traducir
translateInstantbirdIntoYourLanguage=Para ayudarnos a ofrecer Instantbird a una audiencia más amplia, puedes &translateInstantbirdLink; a tu propio idioma.
translateInstantbirdLink=traducir Instantbird
addonDevelopment=Desarrollo de complementos
createEditReviewAddons=&createAddonLink;, &reviewAddonsLink; y edita complementos y, de esta manera, da a otros la posibilidad de sentir que su Instantbird se adapta a ellos incluso más, gracias a ti.
createAddonLink=Crear
reviewAddonsLink=revisar
contributeCode=Colaborar con código
weCanHelpYou=Para aquellos de vosotros con más conocimientos técnicos, podéis animaros y proporcionar parches.</p><p>Probablemente queráis comenzar por &compilingABuildYourselfLink;. Hablad con nosotros durante el proceso, ¡podemos ayudaros a iniciaros más deprisa!
compilingABuildYourselfLink=compilar un binario tú mismo
