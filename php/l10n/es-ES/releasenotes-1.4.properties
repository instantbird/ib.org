whatsNew=¿Qué novedades hay?

logViewerDateTree=El visor de registros ahora agrupa por fechas tus conversaciones.

twitterImprovements=Mejoras en Twitter
characterCounter=El contador de caracteres para Twitter se ha mejorado para que tenga en cuenta el acortado automático de enlaces, lo que te permite <strong>tuitear enlaces fácilmente</strong> sin tener que preocuparte por la longitud.
twitterAPIUpgrade=Actualizado a la API v1.1 de Twitter: ten en cuenta que Instantbird 1.3 puede dejar de funcionar con Twitter a partir del 11 de junio de 2013.
followedPeopleInTimeline=La cronología de Twitter ahora incluye a todos los que sigues como participantes.

ircAuthImprovements=<strong>Autenticación con IRC</strong> funciona mejor con "bouncers" (por ejemplo ZNC).
ircOverrideCerts=Ahora puedes personalizar fácilmente el tratamiento de los <strong>certificados\nautofirmados/no válidos/caducados</strong> de servidores IRC
debugLogs=Cada cuenta conserva <strong>registros de depuración</strong> a los que se puede acceder haciendo clic con el botón derecho sobre la cuenta en el Administrador de cuentas y eligiendo "Copiar registros de depuración". Dichos registros contienen información esencial para que los desarrolladores puedan diagnosticar incidencias de los usuarios. (Ten en cuenta que los registros de depuración contendrán información confidencial).

