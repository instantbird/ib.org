whatsNew=¿Qué hay de nuevo?
improvedAccessibility=Importantes <strong>mejoras de accesibilidad</strong>.
ircImprovements=Mejoras en IRC
longMessages=Los mensajes largos se enviarán en múltiples partes en lugar de ser cortados.
SASLAuth=Ahora se permite la identificación SASL, lo que es necesario para ciertos rangos de IP o al usar Tor y conectarse a Freenode.
twitterImprovements=Mejoras en Twitter
ownDescription=Ahora se muestra (y puede editarse) tu propia descripción sobre la cronología.
replyToAll=¡Responder a un tuit ahora responde a todos los usuarios, exactamente igual que en el sitio web de Twitter!
twitterTabIcon=El icono de la pestaña de las cronologías de Twitter ahora es el pájaro de Twitter, para diferenciar más explícitamente una ventana de cronología de una de chat.
showNick=Se ha integrado el complemento "Mostrar apodo". Esto resalta las menciones del apodo de un usuario en un chat para ver fácilmente qué conversaciones están teniendo lugar. Esperamos que disfrutes esta nueva característica, pero en caso contrario puedes desactivarla fijando la preferencia avanzada "messenger.conversations.showNicks" a falso en about:config.
newXMPPNetworks=Se han añadido nos nuevas redes sociales a través de XMPP: <strong>Odnoklassniki</strong> y <strong>VKontakte</strong>.
underTheHood=Bajo el capó
basedOnLibpurpleAndMozilla=<strong>Actualizado:</strong> Instantbird &versionNumber; está basado en Mozilla &mozillaVersion; lo que trae magníficas &newPossibilitiesForAddonsDevelopersLink; y usa libpurple &libpurpleVersion;. Ésta es la última versión de Instantbird compatible con Mac OS 10.5 y PPC ya que éstos no serán compatibles con Mozilla 17.
newPossibilitiesForAddonsDevelopersLink=nuevas posibilidades para los desarrolladores de complementos
memoryReporters=La memoria consumida por libpurple y sus dependencias ahora está monitorizado en about:memory.
andMore=Y más... lee el &changeLogLink; completo para más detalles de los &codeChangesCount; cambios en el código desde Instanbird 1.2.
