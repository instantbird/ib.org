whatsNew=¿Qué hay de nuevo?
logViewer=El <strong>visor de registro</strong> muestra las conversaciones igual que la vista de conversaciones, gracias a un nuevo formato de archivo de registro basado en JSON que guarda los metadatos junto con el texto de la conversación.
bonjour=Se ha añadido compatibilidad con <strong>Bonjour</strong> (requiere los &bonjourPrintServicesLink; en Windows o &avahiLink; en Linux).
bonjourPrintServicesLink=Servicios de impresión Bonjour
mucInterface=Interfaz de usuario mejorada para los <strong>chats multiusuario</strong>:
tabComplete=<strong>Mejor completado con el tabulador</strong>, lee nuestro &tabCompleteBlogPostLink; para más detalles.
tabCompleteBlogPostLink=artículo de blog
activeNicks=Es más fácil saber quién está activo, ya que sólo los apodos de los participantes que han hablado aparecen coloreados en la lista de participantes.
ircEnhancements=Mejoras en el IRC:
channelsReconnect=Se vuelve a entrar en los canales automáticamente tras reconectarse.
ircStatus=Instantbird registra el estado de los contactos IRC de manera más precisa a través del uso de las órdenes WATCH o MONITOR, si están implementadas.
ircChanServ=Los mensajes de ChanServ se muestran en el canal al que hacen referencia.
ircNickServ=No más mensajes incómodos de NickServ interrumpiéndote tras una identificación automática correcta.
encryptedPasswords=Las contraseñas se guardan ahora en el administrador de contraseñas de Mozilla para mejorar la seguridad. Como en Firefox y Thunderbird, es posible protegerlas con una contraseña maestra.
popularAccounts=Crea fácilmente nuevas cuentas ahora que el asistente de cuentas ofrece primero una lista de las redes más populares y muestra todas las redes compatibles cuando se solicita.
systemTrayStatus=Mejor integración con la <strong>bandeja del sistema</strong>: ahora puedes cambiar el estado directamente desde el menú contextual del icono.
lastReadMarker=Encuentra rápidamente dónde dejaste una conversación: la posición del primer mensaje no leído se marca ahora visualmente (y puedes saltar rápidamente allí pulsando Alt-RePág/AvPág o desplazándote).
conversationRestore=Restaurar conversaciones largas mostrará ahora una barra de progreso en lugar de bloquear la interfaz de usuario hasta que todos los mensajes se hayan cargado.
contextMessages=Los mensajes leídos previamente ("el contexto") se pueden distinguir ahora de los nuevos mensajes (cuando se restauran del modo en espera) en todos los estilos de mensajes incluidos. Estos estilos también respetan ahora la configuración de tipografía establecida en Preferencias -> Contenido.
keyboardNavigation=La navegación con teclado de las conversaciones ha sido mejorada permitiendo el desplazamiento desde la caja de texto (vacía): ¡sólo tienes que usar las teclas del cursor, Av./Re Pág. o Inicio/Fin! También hay nuevos atajos para poner una conversación en espera (ESC) y abrir el visor del registro (Ctrl+Mayús+H, como "Historial" en Firefox).
accessibilityImprovements=Se han hecho grandes mejoras en <strong>accesibilidad</strong> en los nuevos mensajes, contactos y grupos de estos.
addonDevelopers=Para los desarrolladores de complementos:
soundPreferences=Controlas las preferencias de sonido de manera más precisa: por ejemplo &advancedSoundControlsLink;.
advancedSoundControlsLink=Controles de sonido avanzados
reorderContacts=Reordena la lista de contactos: por ejemplo, &sortByStatusLink;.
sortByStatusLink=Ordenar por estado
addNewProtocols=Ahora es posible añadir fácilmente nuevos protocolos usando JavaScript: por ejemplo, &vznetChatsLink;.
vznetChatsLink=Chats VZnet
underTheHood=Bajo el capó
extensibleProtocols=Ahora tenemos nuestras propias implementaciones JavaScript extensibles para:
facebookAndGoogleProtocols=<strong>Facebook Chat</strong> y <strong>Google Talk</strong>, basados en nuestro propio plugin de protocolo <strong>XMPP</strong> (del Verano de código de Google 2011).
ircProtocol=IRC
basedOnLibpurpleAndMozilla=<strong>Actualizado:</strong> Instantbird &versionNumber; está basado en Mozilla &mozillaVersion; que incorpora grandes &newPossibilitiesForAddonsDevelopersLink; y usa libpurple &libpurpleVersion;.
newPossibilitiesForAddonsDevelopersLink=nuevas posibilidades para los desarrolladores
mplLicense=La licencia de la mayoría del código ha sido actualizada a la &mplLink;, los binarios oficiales de Instantbird &versionNumber; se distribuyen bajo la &gplLink;.
mplLink=Licencia Pública Mozilla (MPL) 2.0
gplLink=Licencia Pública GNU 2.0 o posterior
libqq=Ahora estamos usando libqq-pidgin para <strong>QQ</strong> ya que QQ ya no se incluye en libpurple.
platformChanges=Los cambios en la plataforma nos han obligado a eliminar la compatibilidad con Windows 2000 y Windows XP anterior al Service Pack 2. Por favor, actualiza a Windows XP Service Pack 2 o posterior.
andMore=Y más... lee el &changeLogLink; completo para más detalles de los &codeChangesCount; cambios en el código desde Instanbird 1.1.
changeLogLink=registro de cambios
knownIssues=Problemas conocidos
freenodeSSL=Problemas de reconexión SSL en freenode (&bug1100Link;).
bug1100Link=bug 1100
selfSignedCerts=Manejo de certificados autofirmados o no válidos (&bug1292Link;).
bug1292Link=bug 1292
