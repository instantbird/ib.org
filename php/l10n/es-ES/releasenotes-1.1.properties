whatsNew=¿Qué hay de nuevo?
conversationsCanBePutOnHold=Las conversaciones ahora se pueden poner en espera:
putOnHoldFromContextMenu=Una conversación se puede poner en espera desde el menú contextual de la pestaña de conversaciones. Las conversaciones en espera se listan en la parte superior de la ventana de contactos, donde es fácil reabrirlas con un doble clic.
noMoreMissedMessages=Cerrar pestañas de conversación ya no hará que pierdas mensajes: al cerrar una pestaña de conversación con mensajes no leídos, la conversación se pondrá automáticamente en espera en lugar de ser cerrada.
closingChatPutsOnHold=Al cerrar una pestaña de sala de chat se pondrá su conversación en espera en lugar de abandonarla.
newMessageReopens=Si llega un nuevo mensaje en una conversación en espera, su pestaña reaparecerá automáticamente (en las salas de chat, esto sólo sucederá si se menciona tu apodo).
unreadCount=El número de mensajes no leídos en cada conversación en espera se indica claramente; ¡esto resultará muy útil en los canales IRC en los que estás a la escucha!
improvedTraySupport=Compatibilidad mejorada con la bandeja del sistema de Linux/Windows:
singleClickRestore=Restaura la lista de contactos con un solo clic en Linux.
trayIconEvenWhenNotMinimized=El icono de Instantbird en la bandeja del sistema es visible incluso cuando la aplicación no está minimizada.
improvedTwitterSupport=Compatibilidad mejorada con Twitter:
twitterEntities=Ahora se admiten las entidades Twitter (@menciones, #hashtags y enlaces acortados).
retweetAndReply=Ahora los mensajes pueden ser retuiteados y respondidos (usando el menú contextual).
followUnfollow=Puedes comenzar y terminar de seguir a los tuiteros directamente desde el menú contextual de sus tuits.
sametimeSupport=Se ha añadido compatibilidad con IBM Lotus <strong>Sametime</strong> por petición popular.
chatParticipantsTooltip=Los participantes en un chat ahora tienen consejos emergentes
whoisInfo=La información whois en IRC se recupera y muestra automáticamente
tabCompletion=Autocompletado con el tabulador de los apodos en IRC, los nombres de Twitter y las órdenes.
interruptionsManagerAPI=La nueva <strong>API del administrador de interrupciones</strong> permite a los desarrolladores de complementos crear fácilmente complementos para reducir las molestias:
eventsFiltered=Los eventos pueden filtrarse basándose en sus detalles (tipo, origen...) para personalizar qué acciones se permite que ocurran.
fixedICQSettings=Los valores predeterminados de ICQ han sido actualizados para funcionar con sus nuevos servidores.\u0020
unknownCommandsNoLongerSent=Las órdenes desconocidas ya no se envían a las salas de chat de IRC/XMPP.
updated=Actualizado
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; está basado en libpurple &libpurpleVersion; y Mozilla &mozillaVersion; que trae grandes &newPossibilitiesForAddonsDevelopersLink;.
newPossibilitiesForAddonsDevelopersLink=nuevas posibilidades para los desarrolladores
improvedStability=Estabilidad mejorada
improvedStabilityDescription=los informes de fallos de la versión 1.0 y los binarios diarios han sido tomados en consideración para corregir los fallos que causaban errores frecuentes.
andMore=Y más... lee el &changeLogLink; completo para más detalles de los &codeChangesCount; cambios en el código desde Instanbird 1.0.
changeLogLink=Registro de cambios
