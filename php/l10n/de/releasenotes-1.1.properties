whatsNew=Was gibt es neues?

conversationsCanBePutOnHold=Gespräche können nun geparkt werden:.
putOnHoldFromContextMenu=Ein Gespräch kann nun aus dem Kontextmenü heraus geparkt werden. Geparkte Gespräche werden oben im Kontaktlisten-Fenster angezeigt, wo sie einfach per Doppelklick wieder geöffnet werden können.
noMoreMissedMessages=Das Schließen von Gesprächs-Tabs führt nun nicht mehr zu verpassten Nachrichten: Wenn man ein Fenster mit ungelesenen Nachrichten schließt, wird das Gespräch automatisch geparkt anstatt geschlossen.
closingChatPutsOnHold=Das Schließen von Chat-Fenstern fügt den Chatraum zu den geparkten Gesprächen hinzu, anstatt ihn zu verlassen.
newMessageReopens=Wenn eine neuen Nachricht in einem geparkten Gespräch ankommt, wird es automatisch wieder geöffnet (Bei Chat-Räumen geschieht dies nur, wenn Ihr Alias erwähnt wird).
unreadCount=Die Anzahl der ungelesenen Nachrichten für jedes geparktes Gespräch wird deutlich angezeigt. Das wird sich besonders in IRC-Chat-Räumen als nützlich erweisen, wenn man gerade nicht aktiv ist!.

improvedTraySupport=Verbessertes Infobereichssymbol für Linux/Windows:
singleClickRestore=Das Kontakt-Fenster lässt sich nun unter Linux mit einem einzigen Klick wiederherstellen.
trayIconEvenWhenNotMinimized=Das Instantbird-Symbol ist nun auch sichtbar, wenn die Anwendung nicht minimiert ist.

improvedTwitterSupport=Verbesserte Twitter-Umsetzung:
twitterEntities=Twitter-Objekte (@Erwähnungen, #Hashtags and verkürzte Links) werden nun unterstützt.
retweetAndReply=Nachrichten können nun bequem beantwortet und retweetet werden (über das Kontext-Menü).
followUnfollow=Twitter-Accounts kann man nun direkt aus dem Kontext-Menü der Tweets folgen und entfolgen.

sametimeSupport=Auf vielfachen Wunsch wird nun IBM Lotus <strong>Sametime</strong> unterstützt.

chatParticipantsTooltip=Infos über Chat-Teilnehmer in Tooltips
whoisInfo=Die „Whois“-Informationen für IRC werden abgerufen und als Tooltip automatisch angezeigt.

tabCompletion=Tab-Vervollständigung für IRC-Alias, Twitter-Accounts und Befehle.

interruptionsManagerAPI=Die neue <strong>Interruptions-Manager-API</strong> erlaubt Add-on-Entwicklern einfach neue Add-ons zu schreiben, die Störungen reduzieren können:
eventsFiltered=Events können nach verschiedenen Details (Type, Source, …) gefiltert werden, so kann genau eingestellt werden, welche Aktionen zulässig sind.

fixedICQSettings=Die Standard-ICQ-Einstellungen wurden an die neuen Server angepasst.

unknownCommandsNoLongerSent=Unbekannte Befehle werden nicht mehr an IRC/XMPP-Chaträume gesendet.

updated=Aufgefrischt
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; basiert nun auf libpurple &libpurpleVersion; und Mozilla &mozillaVersion;. Das bietet viele neue &newPossibilitiesForAddonsDevelopersLink;.
newPossibilitiesForAddonsDevelopersLink=Möglichkeiten für Add-on-Entwickler.
improvedStability=Verbesserte Stabilität
improvedStabilityDescription=Die Crash-Reports von der 1.0-Veröffentlichtung und den Nightlys wurden ausgewertet und es wurden Bugs behoben die regelmäßig zu Abstürzen geführt haben.

andMore=Und mehr… Lesen Sie das komplette &changeLogLink; für Details zu den &codeChangesCount;-Code-Änderungen seit Instantbird 1.0.
changeLogLink=ChangeLog
