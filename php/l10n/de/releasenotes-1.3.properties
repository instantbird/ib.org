whatsNew=Was gibt es neues?

improvedAccessibility=Die <strong>Barrierefreiheit</strong> wurde stark verbessert.

ircImprovements=IRC-Verbesserungen
longMessages=Lange Nachrichten werden nun in mehrerer Teilen versendet und nicht mehr gekürzt.
SASLAuth=SASL-Authentifizierung wird nun unterstützt. Dies wird für bestimmte IP-Bereiche, bei der Verwendung von TOR oder zum Verbinden mit Freenode-Servern benötigt.

twitterImprovements=Twitter-Verbesserungen
ownDescription=Die eigene Beschreibung wird nun über der Timeline angezeigt und ist editierbar.
replyToAll=Eine Antwort auf einen Tweet schließt nun alle Teilnehmer ein, genau wie auf der Twitter-Webseite.
twitterTabIcon=Das Tab-Icon für die Twitter-Timeline ist nun der Twitter-Vogel um sie deutlicher von den anderen Chat-Tabs zu unterscheiden.

showNick=Das Add-on "Show Nick" wurde integriert. Nun werden die Spitznamen von Teilnehmen hervorgehoben, sobald sie in einem Chat erwähnt werden. Wir hoffen das diese Funktion allen gefällt, aber sie lässt sich auch in den "Erweiterten Einstellungen" deaktiveren. Dazu muss nur "messenger.conversations.showNicks" auf "false" gesetzt werden.

newXMPPNetworks=Zwei neue soziale Netzwerke werden nun via XMPP unterstützt: <strong>Odnoklassniki</strong> und <strong>VKontakte</strong>.

underTheHood=Unter der Haube
basedOnLibpurpleAndMozilla=<strong>Aktualisiert:</strong> Instantbird &versionNumber; basiert auf Mozilla &mozillaVersion; mit vielen &newPossibilitiesForAddonsDevelopersLink; und verwendet Libpurple &libpurpleVersion;. Dies ist die letzte Instantbird-Version, die Mac OS 10.5 und PPC unterstützt, da es ab Mozilla 17 nicht mehr möglich ist sie zu unterstützen.
newPossibilitiesForAddonsDevelopersLink=neuen Möglichkeiten für Add-on-Entwickler
memoryReporters=Der von Libpurple und dessen Abhängigkeiten belegte Speicher wird nun in about:memory erfasst.
andMore=Und mehr… lesen Sie das komplette &changeLogLink; für die Einzelheiten der &codeChangesCount; Code-Änderungen seit Instantbird 1.2.
changeLogLink=ChangeLog
