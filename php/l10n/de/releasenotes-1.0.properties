whatsNew=Was gibt es neues?

redesignedContactsWindow=Umgestaltetes Kontaktlisten-Fenster:
contactMerging=Zusammenführen von Kontakten
contactMergingDescription=Falls Sie mit der selben Person über verschiedene Instant-Messaging-Netzwerken in Kontakt stehen, können Sie nun die Benutzernamen dieser Person von allen IM-Diensten zu einem einzigen Kontakt verschmelzen. Wenn ein neuer Chat geöffnet wird, wird automatisch das Netzwerk gewählt in dem Ihr Gegenüber gerade online ist und das Gesprächsfenster wird automatisch die Verbindung umschalten, falls zu einem anderen Dienst gewechselt wird.
tags=Schlagwörter
tagsDescription=Schlagwörter ersetzen die Gruppen in der Kontaktliste, jeder Kontakt lässt sich einem oder mehreren Schlagwörtern zuordnen. Einzelne Schlagwörter lassen sich durch einen Klick auf das »x« an der rechten Seite verbergen. Alle Kontakte die online sind, aber zu keinem sichtbaren Schlagwort gehören werden in dem Schlagwort »Weitere Kontakte« am Ende der Liste zugeordnet.
contactsWindowCanNowBe=Das Konktaklisten-Fenster kann nun …
closedOnMac=auf dem Mac geschlossen werden ohne Instantbird zu beenden; es kann vom Dock wieder geöffnet werden.
minimizedToTrayOnWindowsAndLinux=in Windows und Linux <strong>in den Infobereich minimiert</strong> werden. Als Standard wird die Kontaktliste beim Schließen in den Infobereich minimier, dies kann jedoch über die Einstellungen verändert werden.
buddyIcon=Benutzer können nun ein <strong>Avatar-Bild</strong> und den <strong>Anzeigenamen</strong> ihrer Konten direkt im Kontaktlisten-Fenster ändern.
contactListSorted=<strong>Die Kontaktliste ist sortiert.</strong> Sowohl Schlagwörter, als auch Kontakte erscheinen nun alphabetisch sortiert.
nicerAnimations=Hübschere Animationen.

twitterSupport=Twitter-Unterstützung
twitterSupportDescription=Wenn ein Twitter-Konto verbunden wird, erscheint automatisch die Timeline. Wenn das Fenster bzw. der Tab geschlossen wird, öffnet sie sich automatisch, wenn ein neuer Tweet eintrifft. Der Benutzer sollte die Verbindung im Konten-Menü trennen um keine weiteren Nachrichten zu empfangen.<br />Es gibt eine „Folgen“-Funktion, die es ermöglicht einzelne Schlagwörter in die Timeline aufzunehmen. Dies ist eine kommaseparierte Liste, Komma heißt ODER, Leerzeichen heißt UND.

topConversationUI=Eine neue <strong>Info-Toolbar oben an dem Gesprächsfenster</strong>, die den Kontakt-Status, den Avatar, den Anzeigennamen anzeigt. Zusätzlich kann der verwendete IM-Dienst durch einen Klick auf das Protokoll-Icon geändert werden.
updatedTabStyling=Das <strong>Aussehen der Tabs</strong> wurde <strong>aktualisiert</strong> um Firefox 4 zu gleichen, und Benutzer von aktuellen Windows-Versionen werden einige <strong>Aero-Glass-Effekte</strong> zu schätzen wissen.
timeBubbles=Bubbles, das Standard-Theme, hat einige zeitbezogene Funktionen hinzubekommen, siehe unseren &blogPostLink; für weitere Details.
blogPostLink=Blog-Beitrag

jumplist=(nur Windows 7) <strong>Unterstützung von Jump List</strong> um schnell den Status zu wechseln.

jsProto=Unter der Haube: Protokoll-Plugins können nun in JavaScript implementiert werden.

minorImprovements=Viele kleine Verbesserungen, darunter:
jumpToTab=Man kann nun schnell zu dem x-tem Tab zu springen, über &lt;Modifier&gt;+&lt;x&gt; im Gesprächsfentster, wobei &lt;Modifier&gt; Strg bei Windows/Linux und Command auf Mac ist.
helpCommand=Ein Hilfe-Befehl ('/help') wurde hinzugefügt, so dass man nun schnell und einfach die Befehle sehen kann, die  in der aktuellen Konversation zur Verfügung stehen.
unknownStatus=Ein unbekannter Status wird nun vom Offline-Status durch verschiedene Icons unterschieden.
darkSimple=Eine dunkle Variante des "Simple"-Themes.

updated=Aufgefrischt
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; basiert nun auf libpurple &libpurpleVersion; und Mozilla &mozillaVersion;, die tolle &newPossibilitiesForAddonsDevelopersLink; bietet (&restartLessAddonsLink;).
newPossibilitiesForAddonsDevelopersLink=neue Möglichkeiten für Add-on-Entwickler
restartLessAddonsLink=z.B. neustartlose Add-ons

improvedStability=Verbesserte Stabilität
improvedStabilityDescription=Wir haben die Absturzmeldungen die wir von den Veröffentlichungen der Versionen 0.2 und 0.3, sowie den Nightly-Builds ausgewertet, um Bugs zu beheben, die zu Abstürzen führten.

andMore=Und viel mehr … lesen Sie das komplette &changeLogLink; für die Details zu den &codeChangesCount; Code-Änderungen seit Instantbird 0.2.
changeLogLink=ChangeLog

knownIssues=Bekannte Probleme
cannotReopenTwitterTimeline=Nach dem Schließen der Twitter-Timeline kann sie nicht mehr manuell geöffnet werden, um einen Tweet zu senden. Die Timeline öffnet sich jedoch automatisch wieder, wenn einen neue Nachricht eintrifft.