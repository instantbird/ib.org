instantbirdBecause=Wir geben Ihnen Instantbird, weil …
weBelieveImportantComponentOnlineLife=wir glauben, dass Instant-Messaging ein wichtiger Teil <em>Ihres</em> Online-Lebens ist.
weBelieve=Wir glauben, dass …

deservesMoreAttention=… eine Instant-Messaging-Software mehr Aufmerksamkeit verdient: Die Zeit, die man mit Instant-Messaging jeden Tag verbringt, ist ein paar Minuten für die Auswahl einer Instant-Messaging-Software, die sich <strong>für Sie richtig anfühlt</strong>, wert.
solidAlternative=… es eine <strong>zuverlässige Alternative</strong> zu den bereits verfügbaren Instant-Messaging-Clients geben sollte.
reclaimControl=… Instant-Messaging ein Teil Ihres Online-Lebens ist, über das <strong>Sie die Kontrolle haben</strong> sollten.

shouldBeEasyReliableFunEmpowering=Es sollte <strong>einfach zu verwenden, zuverlässig, Spaß machen und mehr Anpassungen zulassen</strong>
shouldJustWork=Es sollte <strong>einfach funktionieren</strong>! Dier Sinn einer Instant-Messaging-Software ist es Ihnen bei der Kommunikation zu helfen und nicht Ihnen im Weg zu stehen.
relyOnIt=Instant-Messaging ist nicht länger ein Spielzeug, sondern ein praktisches Hilfsmittel für Kommunikation in wichtigen Angelegenheiten. Daher hat es <strong>sehr stabil</strong> zu sein, um sicherzustellen, dass man sich <strong>darauf verlassen kann</strong>.
customizeIt=Egal ob Sie viel oder wenig Zeit damit verbringen, Sie sollen in der Lage sein <strong>es an sich selbst anzupassen</strong>. Sie brauchen die <strong>Möglichkeit zu entscheiden wie es sein soll</strong>, um <strong>&customizeItLink;</strong>.
customizeItLink=es anzupassen

respectTheUser=Ein Instant-Messanger sollte <strong>den Benutzer respektieren</strong>
privacy=Privatsphäre
privacyText=weil Instant-Messanging private oder vertrauliche Daten betrifft, sollten Sie die Kontrolle darüber haben, wie Ihre Daten verwendet werden.
freedom=Freiheit
freedomText=es sollte <strong>keine Überraschungen</strong> geben, wenn Sie es benutzen. Es sollte <strong>einfach nur das tun, was Sie wollen</strong>.

openSource=Um dies zu sichern, sollten die Abläufe <strong>offen und transparent</strong> sein. Darum ist es wichtig, dass <strong>Instantbird Open-Source-Software ist</strong>.

shouldBeAccessibleAdapted=Ein Instant-Messanger sollte <strong>zugänglich</strong> sein und sich <strong>an den Benutzer anpassen</strong>
adaptedToYourNeeds=<strong>Ihre Sprache, Wissen über Computer, Betriebssysteme oder die Leistungsfähigkeit sollten kein Hinderniss sein</strong>; die Software sollte sich an Ihre Bedürfnisse anpassen, satt Sie zum Anpassen zu zwingen

bringBackInnovation=Die Benutzererfahrung beim Instant-Messaging sollte reizvoll sein, aber es hat sich nur sehr wenig in den letzten Jaher weiterentwickelt. Es ist nun <strong>wieder die Zeit für Innovationen</strong>! Unser Ziel ist es, all diese Überzeugungen in Instantbird umzusetzen und wir begrüßen jeden Beitrag unserer Benutzer!


gettingInvolved=Mitmachen:

joiningUs=Falls sie unser Überzeugung teilen, könnte es sein, dass Sie daran interessiert sind bei uns mitzumachen. Es gibt <strong>viele Wege mitzumachen</strong> und für einige braucht man keine technische Fähigkeiten.

feedbackAndIdeas=Gib feedback, trage mit Ideen bei
knowHowItWorksForYou=Es ist absolut wichtig, dass wir wissen wie Instantbird für dich funktioniert. Nur so können wir ihn so verbessern können, dass er Dir mehr nützt und besser gefällt.
severalWaysToSendFeedback=Es gibt einige Wege uns Rückmeldungen zu schicken: Senden von Crash-Meldungen, &filingBugsLink;, oder mit uns zu reden. Falls Du Fragen hast, zögere nicht &getInTouchWithUsLink;.
filingBugsLink=Bugs melden
getInTouchWithUsLink=uns zu kontaktieren.
comeDiscussYourIdeas=Zögere nicht mit deinen Ideen zu uns zu kommen und über sie zu diskutieren. Wir freuen uns wirklich darauf, deine Vorschläge könnten es in eine zukünftige Veröffentlichung schaffen, oder ein paar Add-on-Programmierer interessieren.

spreadTheWord=Erzähle es weiter!
talkAboutIt=Rede mit deinen Freunden, Kollegen und Verwandten über Instantbird: Sag ihnen was dir daran gefällt und warum du glaubst, dass sie interessiert sein könnten. Hilf ihnen beim Einrichten (besonders beim Einrichten der Konten). Und frag sie ein paar Tage später, ob sie ihn immernoch verwenden und/oder ob es Probleme gab. Stell sicher, dass wir von den Probleme erfahren, falls es welche gab (siehe oben „Gib Feedback“.

testPreReleaseVersions=Teste Vorveröffentlichungen
alphaBetaNightly=Wir geben Alpha- und Beta-Version frei, damit Du uns deine Meinung zu den neuen Funktionen geben kannst. Falls Du der Entwicklung direkt folgen willst, haben wir auch Nightlys für Dich zu Testen.
pleaseReportIssues=Bitte melde alle Probleme, die Du finden kannst.

helpOtherInstantbirdUsers=Hilf anderen Instanbird-Benutzern!
answerQuestionsOnIRC=Falls Du in unserem IRC-Raum bist, wirst Du vielleicht Fragen von Benutzer sehen, die Hilfe brauchen. Zögere nicht ihnen zu helfen, auch wenn du glaubst, dass andere mehr Wissen haben. Keine Sorge, wenn Du anfängst anderen zu helfen und feststellst, dass du die Lösung nicht kennst, werden andere einspringen.

translate=Übersetzen
translateInstantbirdIntoYourLanguage=Um uns zu helfen Instantbird der breiten Masse näher zu bringen, kannst Du Instantbird in Deine Sprache &translateInstantbirdLink;.
translateInstantbirdLink=übersetzen

addonDevelopment=Add-on-Entwicklung
createEditReviewAddons=&createAddonLink;, &reviewAddonsLink; und bearbeite Add-ons und gib anderen dadurch die Möglichkeit, dass ihr Instantbird noch besser zu ihnen passt.
createAddonLink=Schreibe
reviewAddonsLink=prüfe

contributeCode=Trage zum Code bei
weCanHelpYou=Die von euch, die mehr technisches Wissen mitbringen, können darüber hinausgehen und Patches beitragen.</p><p>Du möchtest vielleicht damit anfangen &compilingABuildYourselfLink;. Sprich mit uns, wir helfend Dir schneller voran zu kommen.
compilingABuildYourselfLink=Instantbird selbst zu kompilieren
