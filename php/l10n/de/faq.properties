faqPageTitleSuffix=Frequently Asked Questions
faq=Häufig gestellte Fragen
summary=Zusammenfassung

installing=Installation

useexistingaccountsTitle=Muss ich meinen Freunden/ neue Kontakt-Informationen mitteilen?
useexistingaccountsText=Nein, mit Instantbird können Sie alle bestehenden Instant-Messaging-Konten mit einem einzigen Programm verwenden. Wenn Sie bereits Instant-Messaging verwenden, müssen sie keine neuen Konten einrichten um Instantbird benutzen zu können.

systreqTitle=Wird Instantbird auf meinem Rechner laufen?
systreqText=Instantbird unterstützt zur Zeit &sysReqWinVersion; oder neuer, &sysReqMacVersion; oder neuer und Linux. Auf der Seite &systemRequirementsLink; finden Sie weitere Details.
systemRequirementsLink=Systemvoraussetzungen

getlatestTitle=Was sollte ich herunterladen um die neuste Version von Instantbird zu erhalten?
getlatestText=Der Download-Link auf der &homePageLink; gibt automatisch die Version von Instantbird an, die für Ihr System am besten geeignet scheint. Falls Sie selbst das Betriebssystem und die Sprache auswählen wollen gehen Sie bitte auf &downloadPageLink;.
homePageLink=Startseite
downloadPageLink=Download-Seite

installasuserTitle=Kann ich Instantbird ohne Administrator-Rechte installieren?
installasuserText=Ja!

sideinstallTitle=Kann ich Instantbird installieren und meinen vorigen Instant-Messaging-Client auf dem Rechner behalten?
sideinstallText=Natürlich! Instantbird und andere IM-Clients können parallel auf einem Rechner betrieben werden ohne Probleme zu verursachen.

installwindowsTitle=Wie installiere ich Instantbird auf Windows?
installwindowsText=Instantbird wird für Windows in einem Installationspaket angeboten. Einfach die heruntergeladene Datei ausführen und sich durch die Installationsroutine führen lassen.

installmacTitle=Wie installiere ich Instantbird auf Mac OS X?
installmacText=Doppelklick auf die heruntergeladene Diskimage-Datei von Instantbird (eine Datei mit der Endung „.dmg“). Danach das Instantbird-Icon zu dem Programm-Ordner ziehen.

installlinuxTitle=Wie installiere ich Instantbird auf Linux?
installlinuxText=Das heruntergeladene Archiv entpacken und die Datei „Instantbird“ ausführen. Wenn ein Popup-Dialog fragt, ob die Datei editiert oder ausgeführt werden soll, „ausführen“ wählen.

portableTitle=Ist Instantbird portabel (also von einem USB-Stick ausführbar)?
portableText1=Wenn Instantbird von einem USB-Stick ausgeführt wird, wird das Profil standardmäßig auf der Festplatte gespeichert.
# Do NOT translate '-profile' here, it's a command line parameter.
portableText2=Instantbird kann ein auf dem USB-Stick gespeichertes Profil zugewiesen werden, in dem man ihn mit dem Parameter <code>-profile</code> startet.
portableText3=Dazu einen Rechtsklick auf die Datei <code>instantbird.exe</code> und „Verknüpfung erstellen“ auswählen. Dann bei den Eigenschaften dieser Verknüpfung das Ziel bearbeiten und <code> -profile ./<em>Name-des-Profilorders</em></code> anhängen.


updating=Aktualisieren

autoupdateTitle=Muss ich irgendetwas tun, um immer die neuste Version von Instantbird zu verwenden?
autoupdateText1=Nein, standardmäßig prüft Instantbird regelmäßig auf Aktualisierungen, und wird eine Bestätigung für die Aktualisierung fordern, falls eine neue Version gefunden wurde. 
autoupdateText2=Dieses Verhalten kann in den Einstellungen verändert werden.

forceupdateTitle=Was wenn ich jetzt updaten möchte?
forceupdateText=Es gibt im Menü den Punkt <em>Nach Updates suchen</em> (über das <em>Hilfe</em>-Menü aufrufbar) damit man nicht auf die Aufforderung zur Aktualisierung warten muss.

overwriteTitle=Kann ich über eine bestehende Version drüber installieren? 
overwriteText=Ja.

addonsafterupdateTitle=Werden meine Add-ons nach einem Update weiter funktionieren?
addonsafterupdateText1=Kompatibele Add-ons werden nach einem Update weiter arbeiten. Wenn ein Add-on nicht mehr kompatibel ist, wird Instantbird eine Überprüfung nach einer neueren Version und gegebenfalls ein Update des Add-ons vorschlagen.
addonsafterupdateText2=Fall das Add-on nach einen Update nicht mehr funktioniert, können Sie den Autor des Add-ons kontaktieren um herauszufinden, ob eine aktualisierte Version geplant ist.


uninstalling=Deinstallation

removeTitle=Wie kann ich Instanbird entfernen?
removeText1=Mit Windows, falls der Installer verwendet wurde, kann Instantbird über die Systemsteuerung deinstalliert werden, wie jedes andere Programm auch.
removeText2=Ansonsten reicht es, die Instantbird-Ordner zu entfernen.
removeText3=Die Deinstallation von Instantbird wird weder die Verbindungen, den gespeicherten Verlauf, noch die Add-ons löschen. Diese Daten befinden sich im &profileFolderLink;.
profileFolderLink=Profilordner
removeText4=Jede Instantbird-Version die nach dem Entfernen von Instantbird installiert wird wird die Daten dieses Ordner verwenden.

using=Anwendung
severalaccountsTitle=Kann ich mehrere Konten auf einmal verwenden?C
severalaccountsText1=Ja, es können mehrere Konten von beliebigen unterstützten Protokollen auf einmal verbunden sein.
severalaccountsText2=Über die <em>Kontenverwaltung</em> (erreichbar über des Menü <em>Extras</em>) können weitere Konten hinzugefügt werden.

supportedprotocolsTitle=Welche Protokolle werden unterstützt?
supportedprotocolsText1=Zur Zeit unterstützt Instantbird standartmäßig die foldenden: AIM, Bonjour, Facebook Chat, Gadu-Gadu, Google Talk, Groupwise, ICQ, IRC, MSN, MySpaceIM, Netsoul, Odnoklassniki, QQ, Simple, Twitter, VKontakte, XMPP, Yahoo and Yahoo JAPAN.
supportedprotocolsText2=Zusätzliche Protokoll-Plugins können als &addonsLink; installiert werden.
addonsLink=Add-ons

facebookusernameTitle=Beim Versuch ein Facebook-Konto zu verbinden erscheint der Fehler <code>Invalid XMPP ID</code>. Was ist das Problem?
facebookusernameText=Es wurde wahrscheinlich die E-Mail-Adresse, die auch zum Einloggen auf der Facebook-Webseite dient, als Benutzername verwendet. Facebook-Chat erfordert jedoch die Eingabe des speziellen Benutzernamen in diesem Feld. Der Benutzername kann unter folgendem Link angezeigt werden: &facebookLink;

facebookauthorizationTitle=Beim Versuch ein Facebook-Konto zu verbinden erscheint der Fehler <code>Not Authorized</code>. Was ist das Problem?
facebookauthorizationText=You need to enable XMPP connections to your Facebook account.
facebookauthorizationText1=Visit &facebookChatLink; while logged into your Facebook account to enable XMPP access.
facebookChatLink=Facebook Chat
facebookauthorizationText2=Log out of the Facebook website.
facebookauthorizationText3=Log back into the Facebook website.
facebookauthorizationText4=Connect your Facebook account in Instantbird ("Tools" > "Accounts" and hit the "Connect" button on your Facebook account) and it should complete successfully.

getaddonsTitle=Where can I get add-ons (extensions and themes)?
getaddonsText=You can search for add-ons from the <em>Get Addons</em> tab of the Addons manager (accessible from the <em>Tools</em> menu) where you will see some recommended add-ons. For more, you can go to &addonsWebsiteLink; where you can also browses experimental add-ons and post reviews.
addonsWebsiteLink=Instantbird's add-on website

logsenabledTitle=Is Instantbird creating logs of my conversations and chats?
logsenabledText=Yes, Instantbird is creating log files by default. Use the settings on the <em>Privacy</em> pane in the <em>Options</em> dialog to configure it to your liking. If you like to have a look at the files themselves, use the <em>Show log folder...</em> button on the same pane.

logfolderTitle=Where are the logs stored?
logfolderText=The name and path of the log files are as follows: <code><em>&profileLink;</em>/logs/<em>protocol</em>/<em>buddy or chat name</em>/<em>date and time</em>.txt</code> (replace the parts in italic by actual values).
profileLink=path to profile

profilefolderTitle=Where is my profile folder?
profilefolderText1=It is located in one of the following locations depending on your operating system:
profilefolderTextCopyAndPaste=copy and paste this exactly in the Windows explorer
profilefolderTextReuse=Any version of Instantbird that you install after removing Instantbird will continue to use the data from this profile folder.

aboutconfigTitle=Can I access about:config to fine tune some preferences?
aboutconfigText=While we discourage using it, about:config is accessible from the <em>Advanced</em> tab of the preferences dialog.


development=Development

whyTitle=Why are you making Instantbird?
whyText=We bring you Instantbird because &weBelieveLink;.
weBelieveLink=we believe instant messaging is an important component of your online life

licenseTitle=How is Instantbird licensed?
licenseText=Instantbird is licensed to you under the terms of the GNU GPL license version 2.0 or later (because it uses libpurple which is GPL licensed). However, most of the source code is also licensed with the Mozilla Public License (MPL), version 2.0.

getthesourceTitle=Where is the source code?
getthesourceText=A tarball of the source code of each released version is available from the &downloadPageLink;. The latest development code can be obtained from our Mercurial code repository by following the &buildInstructionsLink;.
buildInstructionsLink=build instructions

teamTitle=Who makes Instantbird?
teamText=We are &teamLink; of highly motivated individuals, but we hope a lot of people, including you, will join us to make this project even better.
teamLink=a small team

mozillaTitle=Is Mozilla sponsoring the project?
mozillaText1=The Mozilla foundation has not helped us financially.
mozillaText2=The "Powered by Mozilla" logo on our frontpage means that Instantbird relies on code and technologies that are developed by the Mozilla community. We are very grateful to the Mozilla community as a whole for the amazing technologies on which Instantbird is based.

getinvolvedTitle=How can I get involved?
getinvolvedText=There are several ways to take part in the project. You don't need to be a computer programmer to help us. See &getInvolvedLink; for details.
getInvolvedLink=get involved

translateTitle=Can I help translating into my language?
translateText=Yes! See the &translationWikiPageLink; for details.
translationWikiPageLink=translation wiki page

createaddonsTitle=How can
 I create add-ons?
createaddonsText=See the &extensionsWikiPageLink;.
extensionsWikiPageLink=extensions wiki page

fxaddonsTitle=Can Firefox/Thunderbird add-ons work in Instantbird?
fxaddonsText=Not 'out of the box', but most of them can be adapted. See the &portingFirefoxExtensionsPageLink;.
portingFirefoxExtensionsPageLink=porting Firefox extensions page

followTitle=How can I follow the current development effort?
followText1=To stay informed of the important news, you probably want to follow &blogLink;.
blogLink=our blog
followText2=If you want to follow our discussions, you are welcome to join us in our IRC chatroom: &ircRoomLink;.
ircRoomLink=#instantbird on the irc.mozilla.org server
followText3=&nightlyBuildsLink; are produced everyday so that people can help us testing the features that have just been added. Feel free to use them, but watch out! They may not be stable, and if you decide to use them, you are expected to do so to help us test the bleeding edge features, not just be a cool kid who's got the new toy first. So if there are bugs, please &reportBugLink; (&filingABugLink;: what a bug report should contain) instead of complaining.
reportBugLink=report them
nightlyBuildsLink=Nightly builds
filingABugLink=Filing a bug

whatsnextTitle=What's going to be in the next version?
whatsnextText=See the &roadmapLink;.
roadmapLink=roadmap

whenTitle=When will the next major version be released?
whenText=We are very excited about this project and pleased that you share our desire to move forward as fast as possible. However, owing to the nature of software development, it could be problematic to give deadlines and we see maintaining quality as more important.

futurefeaturesTitle=Will Instantbird support file transfer/video chat/<em>insert your favorite feature here</em>?
futurefeaturesText1=See the &roadmapLink;.
futurefeaturesText2=Feel free to discuss with us things that aren't listed to know if we are interested or if the they can be implemented as add-ons.
