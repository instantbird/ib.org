keyFeaturesNotesPageTitleSuffix=Schlüsselfunktionen

instantbirdFeatures=Instantbird Funktionen
awesomenessToMakeIMBetterForYou=Bringt all das zusammen, was Instant-Messaging besser macht.

allYourFriendsTitle=Schreib all deinen Freunden
allYourFriendsDesc1=Mit Instantbird erreichen Sie all Ihre Freunde mit nur einer Anwendung!
allYourFriendsDesc2=AIM, Yahoo, MSN, Google Talk, Facebook und sogar Twitter werden unterstützt!

troubleFreeTitle=Problemlos
troubleFreeDesc1=Instantbird wurde mit Blick auf Stabilität und Einfachheit entwickelt.
troubleFreeDesc2=Genießen Sie die aufgeräumte Benutzeroberfläche: Nichts lenkt vom Gespräch ab!
troubleFreeDesc3=Keine Werbung, keine Belästigung durch unerwünschte Inhalte.

conversationsInTabsTitle=Gesprächsverläufe in Tabs
conversationsInTabsDesc1=Gesprächsverläufe werden in Tabs (Karteireitern) gruppiert, um sicherzustellen, dass Sie nicht mit plötzlich auftauchenden Fenstern überhäuft werden.
conversationsInTabsDesc2=Die Tabs sind einfach zu verwenden: Sie können zum Umordnen verschoben werden, oder ein Gespräch in ein neues Fenster verwandeln.

customizableConversationsTitle=Individualisierbare Gesprächsverläufe
customizableConversationsDesc1=Mit einigen sorgfältig entworfenen Nachrichten-Themen, die standardmäßig verfügbar sind, und hunderten, die als Add-on heruntergeladen werden können, gibt es alles was man braucht, um die Gesprächsverläufe nach Belieben anzupassen.
customizableConversationsDesc2=Verwandeln Sie Ihre Konversationen in eine farbenfrohe, angenehme Erfahrung.

smartContactsTitle=Intelligente Kontakte
smartContactsDesc1=Gibt es mehrere Möglichkeiten dieselbe Person zu erreichen?
smartContactsDesc2=Kein Problem, einfach die Kontakte aufeinander ziehen und Instantbird wird verstehen, dass es sich um dieselbe Person handelt.

alwaysHereForYouTitle=Immer für Sie da
alwaysHereForYouDesc1=Instantbird wird auf all Ihren PCs laufen, egal ob unter Windows, Mac OS X oder Linux.
alwaysHereForYouDesc2=Für die Verwendung muss nie bezahlt werden, da es kostenlos und Open-Source ist.
alwaysHereForYouDesc3=Sie müssen sich nie wieder an einen anderen IM-Client gewöhnen müssen.

limitlessExtensibilityTitle=Unbegrenzte Erweiterbarkeit
limitlessExtensibilityDesc1=Mächtige Werkzeuge wie die Inline-Suche oder Zoom sind bereits integriert und helfen das Beste aus den Gesprächen zu holen.
limitlessExtensibilityDesc2=Weitere Werkzeuge sind dank Instantbirds unbegrenzter Erweiterbarkeit als Add-on verfügbar!

