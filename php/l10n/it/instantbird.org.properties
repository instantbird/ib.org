instantbirdBecause=Ti diamo Instantbird perchè...
weBelieveImportantComponentOnlineLife=Crediamo che la messaggistica istantanea sia una parte importante della <em>tua vita</em> in rete.
weBelieve=Crediamo che:

deservesMoreAttention=Il software di messaggistica istantanea abbia bisogno di più attenzione: Vista la quantità di tempo dedicata ogni giorni alla mesaggistica, è utile spendere qualche minuto per scegliere il software che sembra <strong>giusto per te</strong>.
solidAlternative=Ci dovrebbe essere <strong>una valida alternativa</strong> ai programmi di messaggistica istantanea che sono già diffusi.
reclaimControl=La messaggistica istantanea sia una parte delle tua vita in rete <strong>di cui puoi riprendere il controllo</strong>.

shouldBeEasyReliableFunEmpowering=Dovrebbe essere un'esperienza <strong>facile da usare, affidabile, divertente e produttiva</strong>
shouldJustWork=Dovrebbe semplicemente <strong>funzionare</strong>! Lo scopo di un software di messaggistica è quello di lasciarti comunicare, senza mettersi in mezzo. Tu vuoi usarlo, non perdere tempo per fargli fare quello che vuoi.
relyOnIt=La messaggistica istantanea non è più una novità, ma un mezzo di comunicazione credibile per necessità critiche, quindi deve essere <strong>estremamente affidabile</strong>, per permetterti di <strong>contare su di esso</strong>.
customizeIt=Che tu ci spenda molto tempo oppure no, dovresti poterlo rendere il <strong>tuo personale</strong> mezzo di comunicazione. Devi avere il potere di <strong>decidere come sarà</strong>, di <strong>&customizeItLink;</strong>.
customizeItLink=personalizzarlo

respectTheUser=Un client di messaggistica deve <strong>rispettare l'utente</strong>
privacy=Privacy
privacyText=poichè la messaggistica istantanea riguarda dati riservati o confidenziali, devi mantenere il controllo su come questi dati vengono gestiti.
freedom=Freedom
freedomText=non ci deve essere <strong>alcuna sorpresa</strong> quando lo usi. Deve semplicemente <strong>fare quello che vuoi tu</strong>.

openSource=Per garantire che sia sempre così, il modo in cui funziona dev'essere <strong>aperto, trasparente</strong>. Ecco perchè è importante che Instantbird sia un software <strong>open-source</strong>.

shouldBeAccessibleAdapted=Un programma di messaggistica istantanea dev'essere <strong>accessibile</strong>, <strong>adattabile all'utente</strong>
adaptedToYourNeeds=<strong>La tua lingua, la conoscenza informatica, il sistema operativo, le tue capacità non devono essere delle barriere</strong>; Il software deve adattarsi alle tue necessità invece che costringere te ad adeguarti.

bringBackInnovation=L'esperienza della messaggistica istantanea deve essere piacevole, ma si è evoluta molto poco negli ultimi anni. E' tempo di <strong>riportare innovazione</strong>! Il nostro scopo è portare tutte queste nostre convinzioni in Instantbird, ed ogni aiuto dagli utenti è benvenuto.


gettingInvolved=Essere coinvolti:

joiningUs=Se condividi le nostre convinzioni, vorrai probabilmente unirti a noi. Ci sono <strong>numerosi modi per essere coinvolti</strong> ed alcuni di loro non richiedono alcuna conoscenza tecnica:

feedbackAndIdeas=Dacci dei giudizi, inoltraci delle idee
knowHowItWorksForYou=E' essenziale che sappiamo come trovi Instantbird e come lo usi, in modo che possiamo migliorarlo in aspetti che ti sono utili.
severalWaysToSendFeedback=Ci sono diversi modi per ritornare informazioni utili, tra cui: inviare dei crash report, &filingBugsLink;, oparlare direttamente con noi. Se hai delle domande, non esitare a &getInTouchWithUsLink;.
filingBugsLink=sottoporre dei bug
getInTouchWithUsLink=metterti in contatto
comeDiscussYourIdeas=Non esitare a discutere con noi le idee che hai per eventuali futuri miglioramenti. Lo apprezzeremo. E' possibile che diventino caratteristiche di una versione futura, o interessare qualche sviluppatore di componenti aggiuntivi!

spreadTheWord=Passaparola!
talkAboutIt=Racconta ai tuoi amici, ai colleghi e ai tuoi vicini di Instantbird: digli cosa ti piace e perchè pensi che possa essere utile per loro. Aiutali nella fase di impostazione (soprattutto nella configurazione dell'account!). Qualche giorno dopo domanda se lo usano ancora o se hanno problemi ad usarlo. Se hanno avuto problemi, assicurati che ne veniamo a conoscenza (vedi 'Dacci dei giudizi...' sopra).

testPreReleaseVersions=Prova le versioni di test
alphaBetaNightly=Rilasciamo versioni alfa e beta in modo da farti provare le nuove funzionalità ed avere commenti. Se vuoi seguire da vicino lo sviluppo, puoi provare le versioni "nightly".
pleaseReportIssues=Per favore raccontaci dei problemi che incontri.

helpOtherInstantbirdUsers=Aiuta altri utenti di Instantbird!
answerQuestionsOnIRC=Se visiti la nostra chat su IRC, potrai leggere domande da altri utenti che hanno bisogno di aiuto. Non esitare ad aiutarli anche se credi che altri ne sappiano più di te. Se inizi ad aiutare qualcuno e scopri di non avere la risposta, non preoccuparti! Altri ti aiuteranno!

translate=Traduci Instantbird
translateInstantbirdIntoYourLanguage=Per aiutarci ad offrire Instantbird ad un bacino sempre più grande di utenti, puoi &translateInstantbirdLink; nella tua lingua.
translateInstantbirdLink=tradurre Instantbird

addonDevelopment=Sviluppo di componenti aggiuntivi
createEditReviewAddons=&createAddonLink; o &reviewAddonsLink; i componenti aggiuntivi e dai agli altri la possibilità di sentire che il loro Instantbird è ancora più adatto a loro, grazie a te.
createAddonLink=Crea
reviewAddonsLink=recensisci

contributeCode=Invia del codice
weCanHelpYou=Se poi hai delle più conoscenze di programmazione, puoi inviarci delle patch al codice.</p><p>Per iniziare vai a "&compilingABuildYourselfLink;". Contattaci durante la fase di compilazione, possiamo aiutarti a farlo più velocemente!
compilingABuildYourselfLink=compila il codice sorgente
