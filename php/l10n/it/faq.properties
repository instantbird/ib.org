faqPageTitleSuffix=Domande Frequenti
faq=Domande Frequenti
summary=Sommario

installing=Installazione

useexistingaccountsTitle=Devo inviare nuove informazioni di contatto ai miei amici?
useexistingaccountsText=No, con Instantbird puoi usare tutti i tuoi account di messaggistica esistenti in una sola applicazione. Se usi già la messaggistica istantanea, non hai bisogno di creare un nuovo account per iniziare ad usare Instantbird.

systreqTitle=Instantbird funzionerà sul mio computer?
systreqText=Instantbird attualmente supporta &sysReqWinVersion; o successivi, &sysReqMacVersion; o successivi, e Linux. Leggi la pagine dei &systemRequirementsLink; per maggiori dettagli.

systemRequirementsLink=requisiti di sistema

getlatestTitle=Cosa devo scaricare per ottenere l'ultima versione di Instantbird?
getlatestText=Un collegamento sulla &homePageLink; selezionerà automaticamente la versione di Instantbird più adatta al tuo sistema. Se vuoi selezionare manualmente il sistema operativo e la lingua, vai alla &downloadPageLink;.
homePageLink=homepage
downloadPageLink=pagina di download

installasuserTitle=Posso installare Instantbird senza essere amministratore del mio computer?
installasuserText=Assolutamente si!

sideinstallTitle=Posso installare Instantbird e mantenere sul computer miei precedenti client di messaggistica?
sideinstallText=Assolutamente si! Instantbird ed gli altri client possono convivere sullo stesso computer senza causare nessun problema.

installwindowsTitle=Come posso installare Instantbird su Windows?
installwindowsText=Instantbird è rilasciato per Windows come un eseguibile auto installante. Semplicemente lancia il file che hai scaricato e lasciati guidare dal processo di installazione.

installmacTitle=Come posso installare Instantbird su Mac OS X?
installmacText=Fai doppio click sull'immagine disco di Instantbird (un file che finisce per ".dmg") che hai scaricato. Poi trascina l'icona di Instantbird nella cartella Applicazioni.

installlinuxTitle=Come posso installare Instantbird su Linux?
installlinuxText=Estrai il contenuto dell'archivio scaricato, e lancia il file che si chiama "instantbird". Se una finestra ti chiede se vuoi lanciare o modificare il file, scegli di lanciarlo.

portableTitle=Instantbird è portatile (usabile da una chiavetta USB)?
portableText1=Se lanci Instantbird da una chiavetta USB, salverà il tuo profilo sull'hard disk del computer per impostazione predefinita.
# Do NOT translate '-profile' here, it's a command line parameter.
portableText2=Puoi impostare Instantbird per salvare il tuo profilo sulla chiavetta USB usando l'opzione <code>-profile</code> da riga di comando.
portableText3=Per fare questo, clicca con il tasto destro sul file <code>instantbird.exe</code> e seleziona "crea scorciatoia", poi nelle proprietà della scorciatoia, aggiungi <code> -profile ./<em>foldername</em></code> dopo "instantbird.exe".


updating=Aggiornamento

autoupdateTitle=C'è qualcosa che devo fare per usare sempre l'ultima versione di Instantbird?
autoupdateText1=No, Instantbird si connetterà periodicamente per verificare che ci siano aggiornamenti e ti chiederà il permesso per installare una nuova versione, se questa viene trovata.
autoupdateText2=Se questo non ti piace, puoi sempre cambiarlo nella finestrra delle preferenze.

forceupdateTitle=E se voglio aggiornare subito?
forceupdateText=C'è una voce di menù <em>Controlla aggiornamenti</em> (accessibile dal menù <em>Aiuto</em>) che ti permette di aggiornare subito Instantbird, senza attendere il controllo periodico.

overwriteTitle=Posso installare una nuova versione sopra una installazione esistente?
overwriteText=Si.

addonsafterupdateTitle=I miei componenti aggiuntivi funzioneranno sempre dopo l'aggiornamento?
addonsafterupdateText1=I componenti aggiuntivi compatibili funzioneranno sempre. Se un componente non è più compatibile con la nuova versione di Instantbird, Instantbird ti proporrà di controllare se esiste una versione più recente del componente e di aggiornarlo.
addonsafterupdateText2=Se il tuo componente non funziona più dopo un aggiornamento, contattane l'autore per sapere se sta lavorando per aggiornare il componente..


uninstalling=Disinstallazione

removeTitle=Come posso rimuovere Instantbird?
removeText1=Su Windows, se hai usato il pacchetto auto installante, puoi disinstallare Instantbird dal pannello di controllo come disinstalleresti un qualsiasi altro programma.
removeText2=In tutti gli altri casi, puoi semplicemente eliminare la cartella di Instantbird.
removeText3=La rimozione di Instantbird non eliminerà i tuoi account, lo storico delle conversazioni, le estensioni e gli altri componenti. Questi dati sono salvati nella tua &profileFolderLink;.
profileFolderLink=cartella di profilo
removeText4=Ogni versione di Instantbird che installi successivamente continuerà ad usare i dati presenti in quella cartella.

using=Uso
severalaccountsTitle=Posso usare più di un account per volta?
severalaccountsText1=Si, ti puoi connettere contemporaneamente a più di un account del tipo supportato da Instantbird.
severalaccountsText2=Usa la <em>Gestione account</em> (accessibile dal menù <em>Strumenti</em>) per aggiungere un altro account.

supportedprotocolsTitle=Quali protocolli sono supportati?
supportedprotocolsText1=Attualmente Instantbird supporta: AIM, Bounjour, Facebook Chat, Gadu-Gadu, Google Talk, Groupwise, ICQ, IRC, MSN, MySpaceIM, Netsoul, Odnoklassniki, QQ, Simple, Twitter, VKontakte, XMPP, Yahoo e Yahoo Giappone.

supportedprotocolsText2=Estensioni per protocolli addizionali possono essere installati come &addonsLink;.
addonsLink=componenti aggiuntivi

facebookusernameTitle=Quando provo a connettermi a Facebook vierne visualizzato l'errore <code>ID XMPP non valido</code>. Qual'è il problema?
facebookusernameText=Hai usato come username l'indirizzo email che usi per entrare nel sito web di Facebook. La chat di Facebook si aspetta che tu usi il tuo username univoco in questo campo. Vai su &facebookLink; per controllarlo.

facebookauthorizationTitle=Quando provo a connettermi al mio account Facebook si presenta l'errore <code>Non Autorizzato</code>. Qual'è il problema?
facebookauthorizationText=Devi abilitare le connessioni XMPP per il tuo account Facebook.
facebookauthorizationText1=Visita la &facebookChatLink; mentre sei dentro Facebook per abilitare l'accesso XMPP.
facebookChatLink=Chat Facebook
facebookauthorizationText2=Esegui la disconnessione dal sito di Facebook.
facebookauthorizationText3=Esegui di nuovo l'accesso al sito di Facebook.
facebookauthorizationText4=Connetti il tuo account Facebook dentro Instantbird ("Strumenti" > "Account" e clicca sul pulsante "Connetti" sul tuo account Facebook), dovrebbe completarsi con successo.


getaddonsTitle=Dove posso trovare i componenti aggiuntivi (estensioni e temi)?
getaddonsText=Puoi cercare i componenti dalla scheda <em>Esplora</em> della gestione componenti aggiuntivi (accessibile dal menù <em>Strumenti</em>) dove troverai alcuni componenti aggiuntivi raccomandati. Per vederne di più, puoi andare sul &addonsWebsiteLink; dove puoi anche sfogliare i componenti sperimentali e lasciare i tuoi commenti.
addonsWebsiteLink=sito componenti aggiuntivi di Instantbird

logsenabledTitle=Instantbird conserva la cronologia delle mie conversazioni?
logsenabledText=Si, Instantbird mantiene la cronologia per impostaizone predefinita. Usa le impostazioni nella scheda <em>Privacy</em> nella finestra <em>Preferenze</em> per configurarlo come preferisci. Se vuoi controllare la cronologia, usa il pulsante <em>Mostra cartella cronologia...</em> nella stessa scheda.

logfolderTitle=Dove è conservata la cronologia?
logfolderText=Il nome ed il percorso dei file di cronologia sono i seguenti: <code><em>&profileLink;</em>/logs/<em>protocollo</em>/<em>nome contatto o conversazione</em>/<em>data e ora</em>.txt</code> (sostituisci le parti in corsivo con i valori reali).
profileLink=percorso del profilo

profilefolderTitle=Dov'è la cartella del mio profilo?
profilefolderText1=Si trova in una delle seguenti posizioni, a seconda del tuo sistema operativo:
profilefolderTextCopyAndPaste=copia e incolla esattamente questo in Windows explorer
profilefolderTextReuse=Ogni versione di Instantbird che installi successivamente continuerà ad usare i dati presenti in quella cartella.

aboutconfigTitle=Posso accedere a about:config per specificare meglio le mie preferenze?
aboutconfigText=Anche se lo sconsigliamo, about:config è accessibile dalla scheda <em>Avanzate</em> della finestra delle preferenze.


development=Sviluppo

whyTitle=Perchè sviluppate Instantbird?
whyText=Ti diamo Instantbird perchè &weBelieveLink;.
weBelieveLink=crediamo che la messaggistica istantanea sia una parte importante della tua vita in rete

licenseTitle=Con quale licenza è rilasciato Instantbird?
licenseText=Instantbird è rilasciato secondo i termini della licenza GNU GPL versione 2.0 o successive (per il fatto che usa libpurple che è rilasciato secondo GPL). Comunque, la maggior parte del codice sorgente è rilasciato anche secondo la licenza Mozilla (MPL), versione 2.0.

getthesourceTitle=Dov'è il codice sorgente?
getthesourceText=Un archivio con il codice sorgnete di ogni versione rilasciata è disponibile alla pagina &downloadPageLink;. L'ultima versione del codice in sviluppo può essere scaricata dal nostro archivio Mercurial seguendo le &buildInstructionsLink;.
buildInstructionsLink=instruzioni per la compilazione

teamTitle=Chi fa Instantbird?
teamText=Siamo &teamLink; di persone molto motivate, ma speriamo che molti altri, insieme a te, si uniranno a noi per rendere questo progetto ancora migliore.
teamLink=una piccola squadra

mozillaTitle=Mozilla è sponsor del progetto?
mozillaText1=La fondazione Mozilla non ci ha aiutato finanziariamente.
mozillaText2=Il logo "Basato su Mozilla" sul nostro sito significa che Instantbird è basato su codice e tecnologie sviluppate dalla comunità Mozilla. Siamo molto riconoscenti verso tutta la comunità Mozilla per le fantastiche tecnologie sulle quali Instantbird è basato.

getinvolvedTitle=Come posso contribuire?
getinvolvedText=Ci sono molti modi di entrare a far parte del progetto. No c'è bisogno di essere un programmatore di computer per aiutarci. There are several ways to take part in the project. You don't need to be a computer programmer to help us. Vai a See &getInvolvedLink; per maggiori dettagli.
getInvolvedLink=partecipa

translateTitle=Posso aiutarvi traducendo Instantbird nella mia lingua?
translateText=Si! Vai alla &translationWikiPageLink; per maggiori dettagli.
translationWikiPageLink=pagina wiki delle traduzioni

createaddonsTitle=Come posso creare componenti aggiuntivi?
createaddonsText=Leggi la &extensionsWikiPageLink;.
extensionsWikiPageLink=pagina wiki delle estensioni

fxaddonsTitle=I componenti aggiuntivi per Firefox/Thunderbird funzionano con Instantbird?
fxaddonsText=Non automaticamente, ma la maggior parte può essere adattata. Leggi la &portingFirefoxExtensionsPageLink;.
portingFirefoxExtensionsPageLink=pagina di adattamento componenti di Firefox

followTitle=Come posso seguire l'attuale sviluppo?
followText1=Per rimanere informato su importanti novità sullo sviluppo, probabilmente vorrai seguire il &blogLink;.
blogLink=nostro blog
followText2=Se vuoi seguire le nostre discussioni, ti invitiamo ad unirti alla nostra chat su IRC: &ircRoomLink;.
ircRoomLink=#instantbird sul server irc.mozilla.org
followText3=Le &nightlyBuildsLink; vengono pubblicate ogni giorno affinchè tu possa seguire e lo sviluppo e collaudare le nuove funzionalit che sono state aggiunte di recente. Sentiti libero di usarle, ma attento! Possono essere instabili e, se decidi di usarle, ti preghiamo di farlo per aiutarci a provare le future funzionalità, non solo per avere l'ultimo giocattolino a tua disposizione. Quindi se trovi un bug, per favore &reportBugLink; (&filingABugLink; come si deve invece di lamentarti).
reportBugLink=segnalalo
nightlyBuildsLink=Versioni "nightly"
filingABugLink=Inviando un bug

whatsnextTitle=Cosa ci sarà nella prossima versione?
whatsnextText=Leggi la &roadmapLink;.
roadmapLink=roadmap

whenTitle=Quando uscirà la nuova versione?
whenText=Siamo molto coinvolti in questo progetto e compiaciuti che tu condivida con noi il desiderio di andare avanti il più velocemente possibile. Comunque, vista la natura dello sviluppo del software, ci possono essere problemi a rispettare le scadenze. Consideriamo infatti la qualità più importante della velocità di rilascio.

futurefeaturesTitle=Instantbird supporterà il trasferimento file, le chat video, <em>la mia funzione preferita</em>?
futurefeaturesText1=Leggi la &roadmapLink;.
futurefeaturesText2=Sentiti libero di discutere con noi le cose che non sono elencate per sapere se possono essere implementate come componente aggiuntivo.
