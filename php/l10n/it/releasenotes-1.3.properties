whatsNew=Che c'è di nuovo?

improvedAccessibility=Grandi <strong>miglioramenti sull'accessibilità</strong>.

ircImprovements=Miglioramenti IRC
longMessages=I messaggi lunghi verranno inviati divisi in più parti invece che tagliati.
SASLAuth=Adesso l'autenticazione SASL è supportata, cosa richiesta per alcuni IP o quando si usa TOR o Freenode.

twitterImprovements=Miglioramenti Twitter
ownDescription=La tua descrizione adesso è visibile (e modificabile) sopra la conversazione.
replyToAll=La risposta ad un tweet adesso arriva a tutti gli utenti, proprio come sul sito Twitter!
twitterTabIcon=L'icona dei tab delle conversazioni Twitter è quello ufficiale, per meglio distinguerle dalle altre finestre chat.

showNick=Il componente aggiuntivo "Mostra Soprannome" è stato integrato. Questo sottolinea se un soprannome è citato in una chat e identifica meglio le conversazioni in corso. Se non vi piace questa nuova funzione potete disattivarla nelle impostazioni avanzate, impostando a "false" la voce "messenger.conversations.showNicks" di about:config.

newXMPPNetworks=Due nuovi social network sono stati aggiunti grazie ad XMPP: <strong>Odnoklassniki</strong> e <strong>VKontakte</strong>.

underTheHood=Dietro le quinte
basedOnLibpurpleAndMozilla=<strong>Aggiornato:</strong> Instantbird &versionNumber; è basato su Mozilla &mozillaVersion; che porta nuove &newPossibilitiesForAddonsDevelopersLink; e usa libpurple &libpurpleVersion;. Questa è l'ultima versione di Instantbird che supporta Mac OS 10.5 e PPC in quanto non potranno essere supportati da Mozilla 17.
newPossibilitiesForAddonsDevelopersLink=funzionalità per gli sviluppatori di componenti aggiuntvi
memoryReporters=La memoria impiegata da libpurple e le sue dipendenze adesso è riportata in about:memory.
andMore=E ancora... Leggi il &changeLogLink; completo per tutti i dettagli sulle &codeChangesCount; modifiche al codice rispetto a Instantbird 1.2.
changeLogLink=ChangeLog
