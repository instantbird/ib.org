whatsNew=Che c'è di nuovo?

redesignedContactsWindow=Finestra contatti ridisegnata:
contactMerging=Contatti unificati
contactMergingDescription=Se parli con la stessa persona su diverse reti IM, puoi unire le diverse utenze di quella persona in un singolo contatto. Quando apri una nuova conversazione, l'utenza che risulta essere in rete sarà scelta automaticamente e la finestra della conversazione passerà automaticamente alla nuova utenza appena la persona cambierà rete.
tags=Etichette
tagsDescription=Le etichette sostituiscono i gruppi nell'elenco contatti. Le etichette possono essere nascoste cliccando sulla "x" sul lato destro dell'elenco contatti, tutti i contatti di questa etichetta finiranno automaticamente tra gli "Altri contatti" in fondo alla tua lista.
contactsWindowCanNowBe=La finestra contatti adesso può essere ...
closedOnMac=<strong>chiusa senza uscire da Instantbird</strong> sul MAC; può essere riaperta dalla Dock.
minimizedToTrayOnWindowsAndLinux=<strong>minimizzata nell'area di notifica</strong> su Windows e Linux. Normalmente chiudere (cliccare la 'x') sulla finestra contatti la minimizzerà nell'area di notifica, puoi configurare questo comportamento nelle preferenze.
buddyIcon=Gli utenti adesso possono impostare la loro <strong>immagine</strong> ed il loro <strong>nome visualizzato</strong> direttamente dalla lista contatti.
contactListSorted=<strong>La lista contatti è ordinata</strong> alfabeticamente (sia i gruppi che i contatti appariranno in ordine).

nicerAnimations=Le animazioni sono più gradevoli.

twitterSupport=Supporto per Twitter
twitterSupportDescription=Appena connesso all'account Twitter, si apre automaticamente una conversazione su linea temporale. Se la conversazione viene chiusa, viene automaticamente riaperta all'arrivo di nuovi messaggi. L'utente deve disconnettere l'account Twitter dalla gestione account se non vuole più visualizzare messaggi. <br />C'è un'opzione avanzata (Segui) che permette di scegliere specifiche parole da seguire. E' un elenco di parole separato da virgole. La virgola significa OR, lo spazio tra due parole significa AND.

topConversationUI=Nuova <strong>barra delle informazioni in cima alla finestra conversazione</strong> che mostra l'icona del contatto, il nome visualizzato e lo stato attuale del tuo contatto. In più puoi cambiare la rete che stai usando per la conversazione cliccando sull'icona del protocollo.
updatedTabStyling=Lo <strong>stile delle schede</strong> della conversazione è stato <strong>aggiornato</strong> per renderlo uguale a Firefox 4, e gli utenti di una recente versione di Windows apprezzeranno alcuni <strong>effetti Aero glass</strong>.
timeBubbles=Bolle, il tema messaggi predefinito, ha alcune novità relative alla linea temporale, leggi il nostro &blogPostLink; per i dettagli.
blogPostLink=blog

jumplist=<strong>Supporto Jumplist</strong> per cambiare il tuo stato velocemente (solo per Windows 7).

jsProto=Sotto pelle: I plugin per nuovi protocolli adesso possono essere implementati in JavaScript.

minorImprovements=Molti miglioramenti minori, tra cui:
jumpToTab=Adesso puoi velocemente passare all n-esima scheda usando  &lt;tasto&gt;+&lt;n&gt; nella finestra della conversazione, dove &lt;tasto&gt; è CTRL su Windows/Linux e COMMAND su Mac.
helpCommand=Un comando di aiuto ('/help') è stato aggiunto per vedere velocemente e facilmente i comandi disponibili per l'attuale tipo di conversazione.
unknownStatus=Lo stato Sconosciuto è stato reso differente da quello Non in rete, usando icone diverse.
darkSimple=Variante scura del tema "Semplice".

updated=Aggiornato
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; è basato su libpurple &libpurpleVersion; e su Mozilla &mozillaVersion; il che porta &newPossibilitiesForAddonsDevelopersLink;  di componenti aggiuntivi (per esempio &restartLessAddonsLink;).
newPossibilitiesForAddonsDevelopersLink=nuove possibilità per gli sviluppatori
restartLessAddonsLink=componenti senza necessità di riavvio

improvedStability=Stabilità migliorata
improvedStabilityDescription=abbiamo usato i crash report ottenuti durante l'uso delle versioni 0.2 e 0.3 e delle versioni "nightly" per eliminare bug che causavano dei crash.

andMore=E ancora... leggi l'intero &changeLogLink; per tutti i &codeChangesCount; cambiamenti nel codice dalla versione 0.2).
changeLogLink=ChangeLog

knownIssues=Problemi conosciuti
cannotReopenTwitterTimeline=Dopo aver chiuso la linea temporale Twitter, non può essere riaperta manualmente per inviare un tweet, si riaprirà automaticamente all'arrivo di un altro tweet.
