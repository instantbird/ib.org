keyFeaturesNotesPageTitleSuffix=caratteristiche principali

instantbirdFeatures=Caratteristiche di Instantbird
awesomenessToMakeIMBetterForYou=Abbiamo assemblato per te le funzionalità più straordinarie per offrirti una esperienza di messaggistica sempre migliore.

allYourFriendsTitle=Parla con tutti i tuoi amici
allYourFriendsDesc1=Con Instantbird puoi parlare con tutti i tuoi amici da una sola applicazione!
allYourFriendsDesc2=AIM, Yahoo, MSN, Google Talk, Facebook e anche Twitter sono supportati!

troubleFreeTitle=Senza problemi
troubleFreeDesc1=Instantbird è stato disegnato e sviluppato pensando soprattutto a stabilità e semplicità.
troubleFreeDesc2=Apprezzerai la sua interfaccia pulita: senza comandi complicati, niente ti distrarrà dalle tue conversazioni!
troubleFreeDesc3=Niente pubblicità, nessun contenuto indesiderato a interromperti.

conversationsInTabsTitle=Conversazioni in schede
conversationsInTabsDesc1=Le conversazioni sono raggruppate in schede, non riceverai nessun popup inaspettato.
conversationsInTabsDesc2=Le schede sono facili da usare: puoi trascinarle per metterle in ordine, o spostare una conversazione in una nuova finestra.

customizableConversationsTitle=Conversazioni personalizzate
customizableConversationsDesc1=Con alcuni temi attentamente disegnati sono disponibili di default e centinaia come componenti aggiuntivi, c'è tutto per rendere una conversazione molto "personale".
customizableConversationsDesc2=Trasformiamo la messaggistica in un'esperienza colorata e piacevole!

smartContactsTitle=Contatti unificati
smartContactsDesc1=Hai molti indirizzi per contattare la stessa persona?
smartContactsDesc2=Nessun problema, trascina un contatto sopra l'altro e Instantbird capirà che è la stessa persona.

alwaysHereForYouTitle=Sempre qui per te
alwaysHereForYouDesc1=Instantbird funzionerà su tutti i tuoi computer, siano Windows, Mac OS X oppure Linux.
alwaysHereForYouDesc2=Essendo gratuito e "open source", non dovrai mai pagare niente per usarlo.
alwaysHereForYouDesc3=Non avrai più bisogno di usare un altro client di messaggistica!

limitlessExtensibilityTitle=Nessun limite alle possibilità
limitlessExtensibilityDesc1=Potenti strumenti come la ricerca in linea per trarre il massimo dalle tue conversazioni.
limitlessExtensibilityDesc2=Molti altri sono disponibili come componenti aggiuntivi, non ci sono limiti per Instantbird!

