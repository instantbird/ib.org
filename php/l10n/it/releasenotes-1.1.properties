whatsNew=Cosa c'è di nuovo?

conversationsCanBePutOnHold=Le conversazioni possono essere messe in attesa:
putOnHoldFromContextMenu=Una conversazione può essere messa in attesa dal menù contestuale della scheda Conversazioni. Le conversazioni in attesa sono elencate nella porte alta della finestra Contatti, dove possono essere riprese con un doppio click.
noMoreMissedMessages=Le schede Conversazione si possono chiudere senza perdere messaggi: quendo viene chiusa una conversazione con messaggi non letti, la conversazione viene automaticamente messa in attesa invece di venire chiusa.
closingChatPutsOnHold=Chiudere una scheda chat room mette la conversazione in attesa, invece di abbandonarla.
newMessageReopens=Se arriva un messaggio mentre una conversazione è in attesa, la sua scheda riapparirà automaticamente. (Per le chat room, questo avverrà solo se il il messaggio è rivolto a te).
unreadCount=Il numero dei messaggi non letti di ogni conversazione in attesa è chiaramente indicato; questo ti tornerà utile per i canali IRC incustoditi!

improvedTraySupport=Supporto migliorato per la system tray di Linux e Windows:
singleClickRestore=Ripristina la lista Contatti con un singolo click su Linux.
trayIconEvenWhenNotMinimized=L'icona di Instantbird nella suystem tray è visibile anche quando l'applicazione non è minimizzata.

improvedTwitterSupport=Supporto migliorato per Twitter:
twitterEntities=Le entità Twitter (le citazioni @, i tag # ed i link accorciati) adesso sono supportate.
retweetAndReply=Dal menù contestuale puoi rispondere ai messaggi, oppure ritwittarli.
followUnfollow=Gli utenti Twitter possono essere seguiti o abbandonati direttamente dal menù contestuale dei loro tweet.

sametimeSupport=Lotus <strong>Sametime</strong> di IBM è supportato, a grande richiesta.

chatParticipantsTooltip=I partecipanti di una chat hanno i loro tooltip
whoisInfo=Le informazioni Whois per una IRC sono scaricate e mostrate automaticamente

tabCompletion=Autocompletamento per i nickname IRC, i nomi utente Twitter ed i comandi.

interruptionsManagerAPI=La nuova <strong>API Interruptions manager</strong> permette agli sviluppatori dei componenti aggiuntivi di creare facilmente estensioni:
eventsFiltered=Gli eventi possono venire filtrati in base ai loro dettagli (tipo, provenienza, ...) per personalizzare le azioni permesse.

fixedICQSettings=Le impostazioni predefinite di ICQ sono state aggiornate per funzionare con i nuovi server. 

unknownCommandsNoLongerSent=I comandi IRC/XMPP sconosciuti non vengono più inviati nelle chat room.

updated=Aggiornato
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; è basato su libpurple &libpurpleVersion; e Mozilla &mozillaVersion; che portano &newPossibilitiesForAddonsDevelopersLink;.
newPossibilitiesForAddonsDevelopersLink=nuove possibilità per gli sviluppatori di componenti aggiuntivi

improvedStability=Stabilità migliorata
improvedStabilityDescription=i crash reports delle versioni 1.0 e nightly sono stati analizzati per risolvere i bug che frequentemente causavano il crash dell'applicazione.

andMore=E ancora... leggi il &changeLogLink; completo per ulteriori dettagli su &codeChangesCount; cambiamenti al codice rispetto a Instantbird 1.0.
