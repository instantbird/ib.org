whatsNew=Cosa c'è di nuovo?

logViewer=Il <strong>log viewer</strong> mostra le conversazioni proprio come la vista conversazioni, grazie al nuovo formato di file di log basato su JSON che archivia i meta-dati insieme al testo delle conversazioni.
bonjour=Aggiunto il supporto per <strong>Bonjour</strong> (richiede &bonjourPrintServicesLink; su Windows o &avahiLink; su Linux).
bonjourPrintServicesLink=Servizi Stampa Bonjour

mucInterface=Migliorata l'intefaccia utente per le <strong>chat multi-utente</strong>:
tabComplete=Migliorato l'<strong>autocompletamento</strong>, vedi il nostro &tabCompleteBlogPostLink; per ulteriori dettagli.
tabCompleteBlogPostLink=blog post
activeNicks=Facilitata l'individuazione degli utenti attivi, solo i nomi dei partecipanti che hanno parlato sono colorati nella lista partecipanti.

ircEnhancements=Miglioramenti IRC:
channelsReconnect=I canali sono automaticamente riconnessi.
ircStatus=Instantbird controlla lo stato dei partecipanti in modo più preciso usando i comandi WATCH e MONITOR, se supportati.
ircChanServ=I messaggi ChanServ sono visualizzati nel loro canale di riferimento.
ircNickServ=No sarai più interrotto da noiosi messaggi NickServ dopo un login con identificazione automatica.

encryptedPasswords=Le password adesso sono archiviate nel gestore password Mozilla per maggiore sicurezza. Come in Firefox e Thunderbird, è possibile proteggerle con una password principale.
popularAccounts=Crea nuovi account facilmente ora che la creazione guidata offre una lista dei protocolli più usati prima e tutti gli altri su richiesta.
systemTrayStatus=Miglior integrazione con la <strong>system tray</strong>: adesso puoi cambiare il tuo stato direttamente dal menù contestuale dell'icona.
lastReadMarker=Riprendi velocemente una conversazione da dove l'hai lasciata: La posizione del primo messaggio non letto adesso è evidenziata (e ci puoi arrivare velocemente premendo Alt-PgUp/PgDn oppure con uno swipe).
conversationRestore=Il ripristino di lunghe conversazioni adesso mostra una barra di avanzamento invece di bloccare l'interfaccia finchè i messaggi non sono caricati.
contextMessages=I messaggi letti in precedenza adesso sono facilmente distinguibili di nuovi messaggi in tutti gli stili di visualizzazione. Questi stili adesso rispettano l'impostazione dei caratteri in Preferenze->Contenuto.
keyboardNavigation=La navigazione delle conversazioni con la tastiera è stata migliorata, permettendo lo scrolling dalla casella di input: usa semplicemente le frecce, Page Up/Down, o Home/End! Ci sono poi nuove scorciatoie per mettere le conversazioni in attesa (ESC) e aprire il log viewer (Ctrl+Shift+V, come "Cronologia" su Firefox).
accessibilityImprovements=Grandi miglioramenti nell'<strong>accessibilità</strong> dei nuovi messaggi, i contatti e i gruppi.

addonDevelopers=Per gli sviluppatori di Componenti Aggiuntivi:
soundPreferences=Controlla le preferenze audio in modo più preciso: per esempio usando &advancedSoundControlsLink;.
advancedSoundControlsLink=Controlli Avanzati Audio
reorderContacts=Riordina la lista dei contatti: per esempio usando &sortByStatusLink;.
sortByStatusLink=Ordina per Stato
addNewProtocols=Adesso è possibile aggiungere facilmente nuovi prpotocolli usando JavaScript: per esempio &vznetChatsLink;.
vznetChatsLink=VZnet Chats

underTheHood=Under the Hood
extensibleProtocols=Ci sono nuove implementazioni JavaScript per:
facebookAndGoogleProtocols=<strong>Chat Facebook</strong> e <strong>Google Talk</strong>, basate sul protocollo <strong>XMPP</strong> (da Google Summer Code 2011).
ircProtocol=IRC
basedOnLibpurpleAndMozilla=<strong>Aggiornato:</strong> Instantbird &versionNumber; è basato su Mozilla &mozillaVersion; che porta  &newPossibilitiesForAddonsDevelopersLink; e usa libpurple &libpurpleVersion;.
newPossibilitiesForAddonsDevelopersLink=nuove possibilità per gli sviluppatori di componenti aggiuntivi
mplLicense=La licenza di gran parte del codice è stata aggiornata alla &mplLink;, le versioni ufficiali di Instantbird &versionNumber; sono distribuite sotto la &gplLink;.
mplLink=Mozilla Public License (MPL) 2.0
gplLink=GNU Public License 2.0 or successive
libqq=Usiamo libqq-pidgin per <strong>QQ</strong> visto che QQ non è più incluso in libpurple.
platformChanges=I cambiamenti della piattafdorma ci hanno spinto a lasciare il supporto per Windows 2000 e per Windows XP prima del Service Pack 2. Prego aggiorna a Windows XP SP2 or successivi.

andMore=E ancora... leggi il &changeLogLink completo; per dettagli sui &codeChangesCount; cambiamenti al codice da Instantbird 1.1.
changeLogLink=ChangeLog

knownIssues=Problemi noti
freenodeSSL=Riconnessioni SSL su freenode (&bug1292Link;).
bug1292Link=bug 1292
selfSignedCerts=Certificati auto firmati o invalidi (&bug1100Link;).
bug1100Link=bug 1100
