whatsNew=Čo je nové?

redesignedContactsWindow=Návrh zoznamu kontaktov:
contactMerging=Zlučovanie kontaktov
contactMergingDescription=Ak hovoríte s jedným človekom na viac IM sieťach, môžete skombinovať jednotlivé používateľské mená do jediného kontaktu. Pri otvorení nového chatu bude automaticky vybraná tá sieť, na ktorej je užívateľ online, a konverzácie sa automaticky prepne na inú vo chvíli, kedy sa zmení sieť aj váš kamarát, s ktorým ste práve v kontakte.
tags=Tagy
tagsDescription=Tagy nahrádzajú skupiny v zozname kamarátov. Môžu byť skrývány kliknutím na "x", všetky kontakty budú následne automaticky presunuté do "Ďalšie kontakty", ktoré sa zobrazí na spodnom konci zoznamu.
contactsWindowCanNowBe=Okno kontaktov môže teraz byť ...
closedOnMac=zatvorené na Macu bez ukončenia Instantbirdu a znovu otvorené z Doku.
minimizedToTrayOnWindowsAndLinux=<strong>minimalizované do systémovej oblasti</strong> na Windows a Linuxe. Pri východiskovom zatvorení ('x') sa Kontakty minimalizujú; túto predvoľbu si môžete prispôsobiť v Možnostiach.
buddyIcon=Používatelia si teraz môžu nastaviť <strong>ikonu</strong> a <strong>zobrazované meno</strong> svojich účtov priamo v zozname kontaktov.
contactListSorted=<strong>Zoznam kontaktov je radený</strong> abecedne (skupiny aj jednotlivé kontakty).
nicerAnimations=Krajšie animácie.

twitterSupport=Podpora Twitteru
twitterSupportDescription=Keď je Twitter účet pripojený, automaticky sa otvorí konverzácie časovej osi. Ak ju zatvoríte, automaticky sa znovu objaví pri prijatí novej správy. Na odvrátenie tomuto otvorenie by užívateľ mal účet odpojiť v správcovi účtov.<br />Protokol obsahuje možnosť sledovania kľúčových slov formou zoznamu separovaného čiarkami. Čiarka znamená 'alebo', medzera ako súčasť kľúčového slova znamená 'a'.

topConversationUI=Nová <strong>informačná lišta v konverzačném okne</strong> zobrazuje ikonu kamaráta, jeho meno a aktuálny stav. Ďalej tu môžete zmeniť používanú IM sieť jednoduchým kliknutím.
updatedTabStyling=<strong>Vzhľad panelov</strong> konverzácie bol <strong>aktualizovaný</strong> podľa Firefoxu 4, užívatelia posledných Windows ocenia niektoré <strong>Aero glass efekty</strong>.
timeBubbles=Bubliny, predvolený štýl správ, získal nové vlastnosti - prečítajte si náš &blogPostLink;.
blogPostLink=príspevok na blogu

jumplist=(Windows 7) <strong>Podpora vyskakovacie ponuky</strong> pre rýchlu zmenu stavu.

jsProto=Pod pokrievkou: Zásuvné moduly (pluginy) protokolov môžu byť implementované v JavaScriptu.

minorImprovements=Mnoho ďalších menších vylepšení, medzi nimi:
jumpToTab=Môžete rýchlo preskočiť do <i>n-teho</i> panelu chatu okne pomocou &lt;modifikátor&gt;+&lt;n&gt;, kde &lt;modifikátor&gt; je Ctrl na Windows/Linux a Command na Macu.
helpCommand=Bol pridaný príkaz '/help' pre rýchle zistenie, ktoré príkazy sú pre aktuálnu konverzáciu dostupné.
unknownStatus=Neznámy stav je teraz odlišovaný od offline rozdielnou ikonou.
darkSimple=Temný variant "prostého" vzhľadu.

updated=Aktualizované
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; je založený na knižnici libpurple &libpurpleVersion; a Mozille &mozillaVersion;, čo prináša &newPossibilitiesForAddonsDevelopersLink; (&restartLessAddonsLink;).
newPossibilitiesForAddonsDevelopersLink=nové možnosti pre vývojárov doplnkov
restartLessAddonsLink=napr. inštalácia bez nutnosti reštartu

improvedStability=Zlepšená stabilita
improvedStabilityDescription=využili sme hlásenie o pádoch z verzií 0.2, 0.3 a nočných zostavení (nightly builds) k opravenie chýb, ktoré tieto pády spôsobovali.

andMore=A viac... prečítajte si celý &changeLogLink; pre viac detailov o &codeChangesCount; zmenách v kóde od vydania Instantbirdu 0.2.
changeLogLink=protokol o zmenách

knownIssues=Známe problémy
cannotReopenTwitterTimeline=Po zatvorení časovej osi Twitteru ju nie je možné ručne otvoriť pre odoslanie tweetu, otvorí sa len automaticky po prijatí tweetu.
