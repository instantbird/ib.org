linkHandlerLinux=Kliknutie na URL nefunguje na niektorých novších Linuxových distribúciách. Pre obídenie tejto chyby otvorte about:config (/about config v konverzácii) a vyhľadajte predvoľby network.protocol-handler.warn-external a nastavte hodnoty na true. Teraz budete pri kliknutí na odkaz opýtaní na program, v ktorom chcete odkaz otvoriť. Viac &bug1995Link;.

