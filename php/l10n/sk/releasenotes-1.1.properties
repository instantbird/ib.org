whatsNew=Čo je nové?

conversationsCanBePutOnHold=Konverzácie je možné uchovať pridržaním v zozname:
putOnHoldFromContextMenu=Konverzácia môže byť pridržaná voľbou z kontextovej ponuky karty. Podržané konverzácie sú radené na začiatku okná s kontaktmi, odkiaľ môžu byť ľahko znovu otvorené dvojklikom.
noMoreMissedMessages=Zatvorenie karty konverzácie už nespôsobí zmiznutie správ: pri zatvorení karty konverzácie s neprečítanými správami sa táto konverzácia automaticky umiestni do zoznamu přidržených.
closingChatPutsOnHold=Zatvorenie karty chatovacej miestnosti umiestni konverzáciu do zoznamu přidržených namiesto aby ste ju opustili.
newMessageReopens=Ak sa v podržané konverzácii objaví nová správa, karta sa automaticky znovu objaví (v chatovacej miestnosti len vtedy, ak je spomenutá prezývka).
unreadCount=Počet neprečítaných správ je u přidržených konverzáciách viditeľne indikovaný, čo je veľmi užitočné napríklad pri neprítomnosti v IRC kanáloch!

improvedTraySupport=Vylepšená podpora systémovej oblasti pre Linux / Windows:
singleClickRestore=Obnovenie zoznamu kontaktov jednoduchým kliknutím na Linuxe.
trayIconEvenWhenNotMinimized=Ikona Instantbirdu je viditeľná aj vtedy, ak nie je aplikácia minimalizovaná.

improvedTwitterSupport=Vylepšená podpora Twitteru:
twitterEntities=Podpora Twitter entít (@mentions, #hashtags) a skrátených odkazov.
retweetAndReply=Na správy je možné odpovedať a retweetovat je pomocou kontextovej ponuky.
followUnfollow=Užívateľa je možné nasledovať alebo nasledovanie zrušiť priamo z kontextovej ponuky ich tweetov.

sametimeSupport=Podpora protokolu IBM Lotus <strong>Sametime</strong>.

chatParticipantsTooltip=Účastníci chatu majú teraz popisky
whoisInfo=Informácie pre IRC sú zachytávané a zobrazované automaticky

tabCompletion=Panely pre IRC prezývky a používateľské mená a príkazy Twitteru.

interruptionsManagerAPI=Nové <strong>Interruptions manager API</strong> umožňuje vývojárom jednoduchšie vytvárať doplnky pre obmedzenie nechcených udalostí:
eventsFiltered=Udalosti môžu byť filtrované podľa detailov (typ, zdroj, ...).

fixedICQSettings=Predvolené nastavenie ICQ bolo aktualizované na nové servery.

unknownCommandsNoLongerSent=Neznáme príkazy už nie sú naďalej zasielané do IRC/XMPP chatovacích miestností.

updated=Aktualizované
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; je založený na knižnici libpurple &libpurpleVersion; a Mozille &mozillaVersion;, čo prináša &newPossibilitiesForAddonsDevelopersLink;.
newPossibilitiesForAddonsDevelopersLink=nové možnosti pre vývojárov doplnkov

improvedStability=Zlepšená stabilita
improvedStabilityDescription=využili sme hlásenie o pádoch od vydania verzie 1.0 a nočných zostavení (nightly builds) k opravenie chýb, ktoré tieto pády spôsobovali.

andMore=A viac... prečítajte si celý &changeLogLink; pre viac detailov o &codeChangesCount; zmenách v kóde od vydania Instantbirdu 1.0.
changeLogLink=protokol o zmenách
