instantbirdBecause=Prinášame vám Instantbird pretože...
weBelieveImportantComponentOnlineLife=Veríme, že instant messaging je dôležitou súčasťou <em>vášho</em> online života.
weBelieve=Veríme:

deservesMoreAttention=Že softvér pre instant messaging si zaslúži viac pozornosti: Čas strávený každodenným užívaním instant messagingu je cennejší než tých pár minút potrebných na vybratie softvéru, ktorý <strong>vám bude vyhovovať</strong>.
solidAlternative=Že tu má byť <strong>spoľahlivá alternatíva</strong> k základnému softvéru pre instant messaging.
reclaimControl=Instant messaging je časť vášho online života, nad ktorým môžete <strong>získať kontrolu</strong>.

shouldBeEasyReliableFunEmpowering=Má byť <strong>ľahko použiteľný, spoľahlivý a zábavný</strong>
shouldJustWork=Jednoducho <strong>má fungovať</strong>! Účel takéhoto softvéru je nechať vás komunikovať bez toho, aby vám stál v ceste. Chcete ho používať, nie tráviť čas bojom proti nemu.
relyOnIt=Instant messaging už nie je nová hračka, ale slúži ako spôsob komunikácie aj v závažných situáciách, preto má byť <strong>veľmi stabilný</strong>, aby ste sa na neho <strong>mohli spoľahnúť</strong>.
customizeIt=Či už s ním trávite veľa alebo málo času, mali by ste byť schopní si ho <strong>upraviť podľa seba</strong>. Potrebujete <strong>možnosť sami rozhodnúť, aký má byť</strong>, a možnosť si ho <strong>&customizeItLink;</strong>.
customizeItLink=prispôsobiť

respectTheUser=Klient pre instant messaging má <strong>rešpektovať užívateľa</strong>
privacy=Súkromie
privacyText=pretože instant messaging vyžaduje osobné alebo dôverné dáta, mali by ste ich mať plne pod kontrolou.
freedom=Sloboda
freedomText=pri jeho používaní by vás nemalo <strong>nič prekvapiť</strong>. Mal by robiť <strong>presne to, čo vy chcete</strong>.

openSource=Pre zabezpečenie všetkého, spôsob, akým pracuje, má byť <strong>otvorený a transparentný</strong>. Preto záleží na tom, že <strong>Instantbird je open-source softvér</strong>.

shouldBeAccessibleAdapted=Klient pre instant messaging má byť <strong>dostupný</strong> a <strong>upraviteľný pre každého užívateľa</strong>
adaptedToYourNeeds=<strong>Váš jazyk, znalosti počítače, operačný systém alebo vaše schopnosti by nemali byť hranicou</strong>; softvér sa má prispôsobiť vašim potrebám, nie vy jemu.

bringBackInnovation=Zážitok užívateľa instant messagingu má byť nezabudnuteľný, ale počas niekoľkých posledných rokov sa zmenil len málo. Je opäť čas na <strong>zlepšenie a inovácie</strong>! Naším cieľom je, aby Instantbird odpovedal tomuto presvedčenie, a vítame každú správu od užívateľov.


gettingInvolved=Zapojte sa:

joiningUs=Ak zdieľate naše presvedčenie, mohli by ste mať záujem sa k nám prepojiť. Je <strong>mnoho možností ako sa zapojiť</strong>, niektoré ani nevyžadujú žiadne technické znalosti:

feedbackAndIdeas=Pošlite spätnú väzbu, prispejte svojimi nápadmi
knowHowItWorksForYou=Základným kameňom je, aby sme vedeli, ako Instantbird pracuje pre vás. Môžeme ho potom vylepšovať vo všetkých smeroch, ktoré ho pre vás urobia ešte užitočnejším.
severalWaysToSendFeedback=Máme niekoľko spôsobov, ako nám môžete odovzdať spätnú väzbu: odoslanie hlásenia o páde, &filingBugsLink;, alebo nám jednoducho napíšte. Ak máte nejakú otázku, neváhajte &getInTouchWithUsLink;.
filingBugsLink=vloženie bugu
getInTouchWithUsLink=nás kontaktovať
comeDiscussYourIdeas=Neváhajte s nami diskutovať o nápadoch, ktoré máte, a navrhovať budúce vylepšenia. Veľmi to oceníme. Môžeme ich realizovať v niektorom z budúcich vydaní, alebo môžu zaujať niektorého autora doplnkov!

spreadTheWord=Dajte o nás vedieť ďalej!
talkAboutIt=Povedzte o Instantbirdu svojim priateľom, kolegom a príbuzným: Povedzte im, čo na ňom máte radi, alebo prečo si myslíte, že by ich mohol zaujať. Môžete im pomôcť s inštaláciou (napr. s nastavením účtov). Za pár dní sa ich spýtajte, či ho stále používajú, alebo majú nejaké problémy. Ak sa s nejakým stretnú, dajte nám vedieť (viď. 'Pošlite spätnú väzbu' vyššie).

testPreReleaseVersions=Testovacie verzie
alphaBetaNightly=Vydávame alfa a beta verzie, aby ste nám mohli poslať spätnú väzbu aj o pripravovaných nových funkciách. Ak chcete sledovať vývoj Instantbirdu bližšie, máme pre vás k vyskúšaniu nočná zostavenia.
pleaseReportIssues=Nahláste nám prosím akýkoľvek problém, ktorý nájdete.

helpOtherInstantbirdUsers=Pomôžte ostatným užívateľom Instantbirdu!
answerQuestionsOnIRC=Ak sa budete nachádzať v našej IRC miestnosti, môžete tu uvidieť otázky od ostatných užívateľov, ktorí potrebujú pomoc. Neváhajte im pomôcť aj keď si myslíte, že ostatní ľudia majú viac zanlostí. Ak niekomu začnete pomáhať a zistíte, že nepoznáte riešenie, nebojte sa! Ostatní vám vypomohou!

translate=Preklad
translateInstantbirdIntoYourLanguage=Aby ste nám pomohli ponúknuť Instantbird širšej verejnosti, môžete &translateInstantbirdLink; do vášho jazyka.
translateInstantbirdLink=preložiť Instantbird

addonDevelopment=vývoj doplnkov
createEditReviewAddons=&createAddonLink;, &reviewAddonsLink; a úpravou doplnkov dáte ostatným možnosť pocítiť, ako im Instantbird vyhovuje, vďaka vám.
createAddonLink=Vytváraním
reviewAddonsLink=hodnotením

contributeCode=Prispejte kódom
weCanHelpYou=Tí, ktorí majú väčšie technické znalosti, môžu pripravovať opravy.</p><p>Pravdepodobne začnete najlepšie &compilingABuildYourselfLink;. Napíšte nám počas tohto procesu, môžeme vám pomôcť začať rýchlejšie!
compilingABuildYourselfLink=kompiláciou vlastného zostavenie
