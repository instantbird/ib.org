showNick=Bol integrovaný doplnok "Show Nick", ktorý pre lepšiu orientáciu zvýrazňuje prezývky, ak sú spomenuté v chate. Veríme, že vám bude táto funkcia prínosná. Ak si ju prajete vypnúť, môžete tak urobiť nastavenia predvoľby "messenger.conversations.showNicks" v Editore predvolieb na false.

