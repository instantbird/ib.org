whatsNew=Čo je nové?

logViewer=Pri <strong>prezeranie záznamov</strong> sa konverzácie zobrazujú rovnakým spôsobom, ako keď si so svojimi kontaktmi píšete. To je možné vďaka novému formátu ukladanie založenom na JSON, ktorý ukladá meta-data zároveň s textom konverzácie.
bonjour=Bola pridaná podpora pre protokol <strong>Bonjour</strong> (vyžaduje &bonjourPrintServicesLink; pre Windows alebo &avahiLink; na Linux).
bonjourPrintServicesLink=Bonjour Print Services

mucInterface=Vylepšené užívateľské rozhranie pre <strong>chatovanie s viacerými kontaktmi</strong>:
tabComplete=Lepšie <strong>ovládanie panelov</strong>, pre viac informácií si prečítajte &tabCompleteBlogPostLink; .
tabCompleteBlogPostLink=článok na blogu
activeNicks=Je jednoduchšie zistiť, kto je aktívny, pretože samotné prezývky tých, ktorí hovoria, sú v zozname zafarbené.

ircEnhancements=Vylepšenia IRC:
channelsReconnect=Do kanálov znova vstúpite hneď po pripojení.
ircStatus=Instantbird sleduje stav IRC kontaktov presnejšie vďaka príkazom WATCH alebo MONITOR.
ircChanServ=Správy ChanServ sa zobrazujú v kanáli, ku ktorému sa vzťahujú.
ircNickServ=Už vás nebudú vyrušovať žiadne zbytočné správy od NickServ po úspešnej automatickej identifikácii počas prihlasovania.

encryptedPasswords=Pre zvýšenie bezpečnosti sú heslá ukladané v Správcovi hesiel, aký používa Mozilla. Rovnako ako vo Firefoxe a Thunderbirde umožňuje ich ochranu hlavným heslom.
popularAccounts=Ľahšie vytvárajte nové účty pomocou sprievodcu, ktorý vám ponúkne zoznam najpopulárnejších sietí, ďalej môžete zobraziť aj všetky ostatné podporované protokoly.
systemTrayStatus=Vylepšená integrácia do <strong> oznamovacej oblasti </ strong>: svoju stavovú správu môžete meniť priamo z kontextovej ponuky.
lastReadMarker=Rýchlo zistíte, kde ste skončili v konverzácii: Teraz je viditeľne zvýraznená prvá neprečítaná správa od chvíle, kedy ste prestali konverzáciu sledovať, a môžete na ňu rýchlo preskočiť stlačením Alt+PgUp/PgDn.
conversationRestore=Počas obnovy dlhých konverzácií sa zobrazuje jej stav. Pri načítaní všetkých správ už nedochádza k žiadnemu zamŕzaniu rozhranie.
contextMessages=Skôr prečítané ("kontextové") správy sú teraz rozoznateľné od nových správ (pri obnovení podržané konverzácie) vo všetkých východiskových vzhľadoch správ. Tieto štýly tiež zohľadňujú nastavenie fontov písma z hlavnej ponuky Možnosti->Obsah.
keyboardNavigation=Navigácia v konverzáciách pomocou klávesnice bola vylepšená o scrollovanie z (prázdneho) pole pre text: stačí použiť Page Up/Down, Home/End alebo šípky! Boli pridané aj nové klávesové skratky pre pridržanie konverzácie (ESC) a zobrazenie záznamov (Ctrl+Shift+H, ako "História" vo Firefoxe).
accessibilityImprovements=Hlavné zlepšenie <strong>prístupnosti</strong> prináša zmeny pre nové správy, skupiny kontaktov a kontakty samotnej.

addonDevelopers=Pre vývojáre doplnkov:
soundPreferences=Presnejšie ovládanie zvuku: napr. &advancedSoundControlsLink;.
advancedSoundControlsLink=Advanced Sound Controls
reorderContacts=Preskupovanie zoznamu kontaktov: napr. &sortByStatusLink;.
sortByStatusLink=zoradenie podľa stavu
addNewProtocols=Je možné jednoduchšie pridávanie nových protokolov pomocou JavaScriptu: napr. &vznetChatsLink;.
vznetChatsLink=VZnet Chats

underTheHood=Pod pokrievkou
extensibleProtocols=Máme svoje vlastné rozšíriteľné JavaScriptové implementácie pre:
facebookAndGoogleProtocols=<strong>Facebook Chat</strong> a <strong>Google Talk</strong> založené na našom <strong>XMPP</strong> module (z Google Summer of Code 2011).
ircProtocol=IRC
basedOnLibpurpleAndMozilla=<strong>Aktualizované:</strong> Instantbird &versionNumber; je založený na Mozille &mozillaVersion; čo prináša &newPossibilitiesForAddonsDevelopersLink; a používa libpurple &libpurpleVersion;.
newPossibilitiesForAddonsDevelopersLink=nové možnosti pre vývojáre doplnkov
mplLicense=Licencia väčšiny kódu bola aktualizovaná na &mplLink;, oficiálne zostavenie Instantbirdu &versionNumber; sú šírené pod &gplLink;.
mplLink=Mozilla Public License (MPL) 2.0
gplLink=GNU Public License 2.0 alebo novší
libqq=Teraz používame libqq-pidgin pre <strong>QQ</strong>, pretože protokol QQ už nie je obsiahnutý v libpurple.
platformChanges=Zmeny platformy nás donútili ukončiť podporu pre Windows 2000 a Windows XP bez Service Packu 2. Prejdite prosím na Windows XP SP2 alebo novší.

andMore=A oveľa viac... prečítajte si celý &changeLogLink; pre viac detailov o &codeChangesCount; zmenách v kóde od vydania Instantbirdu 1.1.
changeLogLink=zoznam zmien

