faqPageTitleSuffix=Často kladené otázky
faq=Často kladené otázky
summary=Súhrn

installing=Inštalácia

useexistingaccountsTitle=Bude potrebné poskytnúť mojim priateľom nové kontaktné informácie?
useexistingaccountsText=Nie, s Instantbirdom môžete využiť všetky svoje existujúce instant messaging účty v jedinej aplikácii. Ak už instant messaging používate, nie je potrebné vytvárať nový účet pre používanie Instantbirdu.

systreqTitle=Bude Instantbird fungovať na mojom počítači?
systreqText=Instantbird v súčasnosti podporuje &sysReqWinVersion; alebo novší, &sysReqMacVersion; alebo novší a Linux. Pre viac informácií si prečítajte &systemRequirementsLink;.
systemRequirementsLink=systémové požiadavky

getlatestTitle=Čo si mám stiahnuť, aby som získal najnovšiu verziu Instantbirdu?
getlatestText=Tlačidlo na stiahnutie na &homePageLink; automaticky vyberie verziu, ktorá zodpovedá vášmu systému. Ak si sami chcete vybrať váš operačný systém a jazyk, prejdite na &downloadPageLink;.
homePageLink=domovskej stránke
downloadPageLink=stránku na stiahnutie

installasuserTitle=Môžem Instantbird nainštalovať na počítač bez toho aby som mal administrátorské práva?
installasuserText=Samozrejme!

sideinstallTitle=Môžem nainštalovať Instantbird a pritom si na počítači nechať pôvodného IM klienta?
sideinstallText=Iste! Instantbird a ďalší klienti môžu byť nainštalovaní na jednom počítači bez toho, aby boli spôsobené nejaké problémy.

installwindowsTitle=Ako nainštalujem Instantbird na Windows?
installwindowsText=Instantbird je pre Windows zabalený ako spustiteľný inštalátor. Stačí spustiť súbor, ktorý ste si stiahli, a nechať sa viesť sprievodcom inštalácie.

installmacTitle=Ako nainštalujem Instantbird na Mac OS X?
installmacText=Dvakrát kliknite na obraz disku Instantbirdu (súbor s koncovkou ".dmg"), ktorý ste si stiahli. Potom pretiahnite ikonu Instantbirdu do priečinka Aplikácií.

installlinuxTitle=Ako nainštalujem Instantbird na Linux?
installlinuxText1=Extrahujte obsah stiahnutého archívu a spustite súbor nazvaný "instantbird". Ak sa vás vyskakovacie dialóg spýta, či chcete súbor upraviť alebo spustiť, vyberte "spustiť".
installlinuxText2=Aktuálne poskytujeme iba 32-bitové zostavenie. Pre jeho spustenie na 64-bitovom systéme bude potrebné stiahnuť knižnice zaisťujúce 32-bitovú kompatibilitu pre vašu distribúciu. Napríklad pre Ubuntu nainštalujte balík <code>ia32-libs</code> spustením <code>sudo apt-get install ia32-libs</code> z príkazového riadku.

portableTitle=Je Instantbird prenosný (spustiteľný z USB flash disku)?
portableText1=Ak spustíte Instantbird z USB disku, v predvolenom nastavení sa bude váš používateľský profil ukladať na pevný disk v počítači.
# Do NOT translate '-profile' here, it's a command line parameter.
portableText2=Môžete Instantbirdu povedať, aby ukladal váš používateľský profil na USB disk, použitím argumentu <code>-profile</code> v príkazovom riadku.
portableText3=Kliknite pravým tlačidlom na súbor <code>instantbird.exe</code> a zvoľte "Vytvořit zástupce", potom vo vlastnostiach zástupcu upravte cieľ a na koniec cesty pridajte argument <code> -profile ./<em>názovzložkysprofilom</em></code>.


updating=Aktualizácia

autoupdateTitle=Musím niečo robiť, aby som vždy používal poslednú verziu Instantbirdu?
autoupdateText1=Nie, v predvolenom nastavení Instantbird pravidelne kontroluje dostupnosť aktualizácií a požiada vás o súhlas, ak nájde novú verziu.
autoupdateText2=Ak vám toto správanie nevyhovuje, môžete ho upraviť v okne možností.

forceupdateTitle=Čo keď budem chtět aktualizovať teraz?
forceupdateText=V hlavnej ponuke je položka <em>Skontrolovať aktualizácie</em> (dostupná v menu <em>Nápoveda</em>), takže nemusíte čakať na ponúknutie aktualizácie, ak viete, že aktualizácia je už dostupná.

overwriteTitle=Môžem nainštalovať novšiu verziu cez už existujúce?
overwriteText=Áno.

addonsafterupdateTitle=Budú moje doplnky stále fungovať aj po aktualizácii?
addonsafterupdateText1=Kompatibilné doplnky fungovať budú. Ak doplnok nie je kompatibilný s aktualizovanou verziou Instantbirdu, Instantbird skontroluje, či nie je dostupná novšia verzia doplnku a aktualizuje ho.
addonsafterupdateText2=Ak doplnok po aktualizácii nebude naďalej fungovať, môžete kontaktovať jeho autora a zistiť tak, či na novej verzii pracuje.


uninstalling=Odinštalovanie

removeTitle=Ako môžem Instantbird odstrániť?
removeText1=Ak ste pri inštalácii vo Windows použili inštalátor, môžete Instantbird odinštalovať z Ovládacích panelov ako každú inú apliakci.
removeText2=V ostatných prípadoch len odstráňte priečinok Instantbird.
removeText3=Odstránením Instantbirdu sa neodstráni vaše účty, záznamy konverzácií, rozšírenie alebo ďalšie doplnky. Tieto dáta sú uložené vo vašej &profileFolderLink;.
profileFolderLink=zložke s profilom
removeText4=Akákoľvek verzia Instantbirdu, ktorú opäť nainštalujete po jeho odstránení, bude ďalej používať dáta z tohto priečinka profilu.

using=Používanie
severalaccountsTitle=Môžem používať niekoľko účtov naraz?
severalaccountsText1=Áno, môžete byť pripojení k niekoľkým účtom od akéhokoľvek podporovaného protokolu v rovnakú chvíľu.
severalaccountsText2=Pre pridanie ďalšieho účtu použite <em>Správca účtov</em> (dostupný v menu <em>Nástroje</em>).

supportedprotocolsTitle=Aké protokoly sú podporované?
supportedprotocolsText3=Aktuálne Instantbird v základe podporuje: AIM, Bonjour, Facebook Chat, Gadu-Gadu, Google Talk, Groupwise, ICQ, IRC, MSN, MySpaceIM, Netsoul, Odnoklassniki, QQ, Simple, Twitter, VKontakte, XMPP, Yahoo a Yahoo JAPAN.
supportedprotocolsText2=Pluginy pre pridanie ďalšieho protokolu môžu byť nainštalované ako &addonsLink;.
addonsLink=doplnky

facebookusernameTitle=Keď sa pokúsim pripojiť k Facebook účtu, vráti sa mi chybové hlásenie <code>Neplatné/Invalid XMPP ID</code>. Čo je to za problém?
facebookusernameText=Ako svoje užívateľské meno ste vložili e-mailovú adresu, ktorú používate na prihlásenie na stránky Facebooku. Facebook chat ale využíva svoje vlastné užívateľské meno. Pozrite sa na &facebookLink; a skontrolujte ho.

facebookauthorizationTitle=Keď sa pokúsim pripojiť k Facebook účtu, vráti sa mi chybové hlásenie <code>Not Authorized</code>. Čo je to za problém?
facebookauthorizationText=Musíte povoliť XMPP pripojenie k vášmu Facebook účtu.
facebookauthorizationText1=Pre povolenie XMPP pripojenie navštívte &facebookChatLink; po prihlásení k vášmu Facebook účtu.
facebookChatLink=Facebook Chat
facebookauthorizationText2=Odhláste sa zo stránok Facebooku.
facebookauthorizationText3=Prihláste sa späť na Facebook.
facebookauthorizationText4=Pripojenie vášho Facebook účtu v Instantbirdu ("Nástroje" > "Účty" a kliknite na tlačidlo "Pripojiť") by teraz malo prebehnúť úspešne.


getaddonsTitle=Kde môžem získať doplnky (rozšírenie a vzhľady)?
getaddonsText=Môžete sa pozrieť do panelu <em>Získanie doplnkov</em> v Správcovi doplnkov (dostupný v menu <em>Nástroje</em>), kde uvidíte niektoré odporúčané doplnky. Pre viac doplnkov sa pozrite na &addonsWebsiteLink;, kde môžete prechádzať aj experimentálne doplnky a recenzie.
addonsWebsiteLink=stránku doplnkov pre Instantbird

logsenabledTitle=Ukladá Instantbird záznamy mojich konverzácií a chatu?
logsenabledText=Áno, Instantbird v predvolenom nastavení záznamy vytvára. Ich nastavenie si môžete prispôsobiť v paneli <em>Súkromie/em> v okne <em>Možnosti</em>. Ak by ste sa radi pozreli na súbory samotné, kliknite v spomínanom paneli na tlačidlo <em>Otvoriť priečinok záznamov...</em>.

logfolderTitle=Kde sú záznamy uložené?
logfolderText=Názov a umiestnenie súborov záznamov sú nasledovné: <code><em>&profileLink;</em>/logs/<em>protokol</em>/<em>vaše meno</em>/<em>dátum a čas</em>.txt</code> (kurzívou písané časti umiestnenia sú nahradené zodpovedajúcimi hodnotami).
profileLink=umiestnenie profilu

profilefolderTitle=Kde je má zložka s profilom?
profilefolderText1=Nachádza sa v jednom z nasledujúcich umiestnení podľa vášho operačného systému:
profilefolderTextCopyAndPaste=skopírujte a vložte presne toto do riadku Adresa v prieskumníkovi Windows
profilefolderTextReuse=Akákoľvek verzia Instantbirdu, ktorú opäť nainštalujete po jeho odstránení, bude ďalej používať dáta z tejto zložky profilu.

aboutconfigTitle=Môžem použiť stránku about:config pre vyladenie niektorých predvolieb?
aboutconfigText=Hoci ju neodporúčame používať, stránka about:config je dostupná z panela <em>Rozšírené</em> v okne možností.


development=Vývoj

whyTitle=Prečo ste Instantbird urobili?
whyText=Prinášame vám Instantbird, pretože &weBelieveLink;.
weBelieveLink=veríme, že instant messaging je dôležitou súčasťou vášho online života

licenseTitle=Ako je Instantbird licencovaný?
licenseText1=Instantbird je licencovaný GNU GPL licenciou verzia 2.0 alebo neskorší (pretože používa libpurple, ktorá je licencovaná GPL). Avšak väčšina zdrojového kódu je licencovaná tiež Mozilla Public License 2.0 (MPL).

getthesourceTitle=Kde je zdrojový kód?
getthesourceText=Zdrojový kód každej vydanej verzie je dostupný &downloadPageLink;. Posledný vývojový kód môže byť získaný z Mercurial repozitára podľa nasledujúcich &buildInstructionsLink;.
buildInstructionsLink=inštrukcií pre zostavenie

teamTitle=Kto robí Instantbird?
teamText=Sme &teamLink; vysoko motivovaných ľudí, ale veríme, že mnoho ľudí, vrátane vás, sa k nám ešte pripojí a pomôžu tento projekt vylepšiť.
teamLink=malý tím

mozillaTitle=Sponzoruje tento projekt Mozilla?
mozillaText1=Nadácia Mozilla nám nepomáha finančne.
mozillaText2=Logo "Powered by Mozilla" znamená, že Instantbird vychádza z kódu a technológií, ktoré sú vyvinuté komunitou Mozilla. Mozilla komunite sme veľmi vďační za túto úžasnú technológiu, na ktorej je Instantbird založený.

getinvolvedTitle=Ako sa môžem zapojiť?
getinvolvedText=Je veľa možností, ako sa stať súčasťou projektu. Nepotrebujete byť počítačovým programátorom, aby ste nám pomohli. Podrobnosti nájdete na stránke &getInvolvedLink;.
getInvolvedLink=ako sa zapojiť

translateTitle=Môžem pomôcť s prekladom do svojho jazyka?
translateText=Áno! Pre viac detailov si prečítajte &translationWikiPageLink;.
translationWikiPageLink=túto wiki stránku o preklade

createaddonsTitle=Ako môžem vytvárať doplnky?
createaddonsText=Prečítajte si &extensionsWikiPageLink;.
extensionsWikiPageLink=wiki stránku o rozšíreniach

fxaddonsTitle=Môžu doplnky z Firefoxu/Thunderbirdu fungovať pre Instantbird?
fxaddonsText='Sami od seba' nie, ale väčšina z nich môže byť prispôsobená. prečítajte si &portingFirefoxExtensionsPageLink;.
portingFirefoxExtensionsPageLink=stránku o úprave doplnkov Firefoxu

followTitle=Ako môžem sledovať postup aktuálneho vývoja?
followText1=Ak chcete byť informovaní o dôležitých novinkách, sledujte &blogLink;.
blogLink=náš blog
followText2=Ak chcete sledovať naše diskusie, radi vás uvítame v našej IRC miestnosti: &ircRoomLink;.
ircRoomLink=#instantbird na serveri irc.mozilla.org
followText3=Denne sú zostavované &nightlyBuildsLink;, takže nám môžete pomôcť vyskúšať funkcie, ktoré boli práve pridané. Nebojte sa ich použiť, ale pozor! Táto zostavenie nemusí byť stabilný. Sú určené k tomu, aby ste nám pomohli testovať pripravované funcke, nie aby ste si hrali na dieťa, ktoré chce dostať novú hračku ako prvý. Ak nájdete chyby, &reportBugLink; prosím (&filingABugLink;: čo má hlásenie o bugu obsahovať) namiesto sťažovania.
nightlyBuildsLink=nočná zostavenia
reportBugLink=nahláste nám je
filingABugLink=Vloženie bugu

whatsnextTitle=Čo sa chystá na ďalšiu verziu?
whatsnextText=Prečítajte si &roadmapLink;.
roadmapLink=plán (roadmap)

whenTitle=Kedy bude vydaná ďalšia hlavná verzia?
whenText=Sme veľmi potešení, že zdieľate naše nadšenie pre posun vpred čo možno najrýchlejšie. Avšak je tiež potrebný prirodzený vývoj softvéru. Môže byť problematické určiť konečné termíny a my považujeme udržanie kvality za dôležitejšie.

futurefeaturesTitle=Bude Instantbird podporovat přenos souborů/video chat/<em>jinou moji oblíbenou funkci</em>?
futurefeaturesText1=Prečítajte si &roadmapLink;.
futurefeaturesText2=Neváhajte s nami diskutovať o veciach, ktoré tu nie sú uvedené, a zistiť, či nás zaujmú alebo môžu byť implementované formou doplnkov.
