keyFeaturesNotesPageTitleSuffix=kľúčové vlastnosti

instantbirdFeatures=Vlastnosti Instantbirdu
awesomenessToMakeIMBetterForYou=Prináša so sebou neskutočné možnosti ako vylepšiť instant messaging.

allYourFriendsTitle=Komunikujte so všetkými svojimi priateľmi
allYourFriendsDesc1=S Instantbirdom môžete komunikovať so všetkými priateľmi pomocou jedinej aplikácie!
allYourFriendsDesc2=Podporuje ICQ, Facebook Chat, MSN, Jabber, Google Talk a dokonce Twitter!

troubleFreeTitle=Bezproblémový
troubleFreeDesc1=Instantbird je navrhnutý tak, aby poskytoval čo najväčšiu stabilitu a zároveň jednoduché ovládanie, aké si len dokážete predstaviť.
troubleFreeDesc2=Užívajte si prehľadné rozhranie: od konverzácií vás nič nevyruší!
troubleFreeDesc3=Žiadne reklamy vás nebudú obťažovať nežiaducim obsahom.

conversationsInTabsTitle=Konverzácie v kartách
conversationsInTabsDesc1=Konverzácie sú zoskupené v kartách, čo zaistí, že nebudete zaplavení spleťou okien, ktorá by na vás všade vyskakovala.
conversationsInTabsDesc2=Karty sa ľahko používajú: prostým pretiahnutím môžete zmeniť ich poradie, alebo presunúť konkrétnu konverzáciu do nového okna.

customizableConversationsTitle=Prispôsobiteľné konverzácie
customizableConversationsDesc1=S niekoľkými starostlivo navrhnutými predvolenými štýlmi a ďalšími dostupnými vo forme doplnkov si môžete vzhľad konverzácií prispôsobiť podľa potreby.
customizableConversationsDesc2=Zmeňte konverzácie v nádherný a farebný zážitok!

smartContactsTitle=Chytré kontakty
smartContactsDesc1=Máte niekoľko kontaktov pre jednu osobu?
smartContactsDesc2=Žiadny problém, stačí presunúť jeden kontakt na druhý a Instantbird bude hneď vedieť, že sa jedná o rovnakú osobu.

alwaysHereForYouTitle=Vždy pripravený
alwaysHereForYouDesc1=Instantbird pobeží na všetkých vašich počítačích. Je jedno, či využívate Windows, Mac OS X alebo Linux.
alwaysHereForYouDesc2=Je zadarmo a Open-Source, nikdy tak za neho nebudete musieť platiť.
alwaysHereForYouDesc3=Už sa nebudete musieť znovu učiť zaobchádzať s ďalším IM klientom!

limitlessExtensibilityTitle=Neobmedzená rozšíriteľnosť
limitlessExtensibilityDesc1=Efektívne nástroje ako vyhľadávanie alebo lupa sú zabudované preto, aby vám pomohli získať z vašich konverzácií čo najviac.
limitlessExtensibilityDesc2=Ďalšie sú dostupné ako doplnky vďaka neobmedzeným možnostiam rozšíriteľnosti Instantbirdu!

