showNick="Show Nick"-tillägget har integrerats. Detta markerar när en användares namn nämns i en chatt, för att enkelt hitta förekommande konversationer. Vi hoppas att du gillar denna nya funktion. Om inte, kan du inaktivera den i konfigurationsredigeraren genom att ändra strängen "messenger.conversations.showNicks" till "false".

