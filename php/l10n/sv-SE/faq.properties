faqPageTitleSuffix=Vanliga frågor och svar
faq=Vanliga frågor och svar
summary=Sammandrag

installing=Installation

useexistingaccountsTitle=Kommer jag att behöva förse mina vänner med ny kontaktinformation?
useexistingaccountsText=Nej, med Instantbird kan du använda alla dina befinliga snabbmeddelandekonton i ett och samma program. Om du redan använder snabbmeddelanden, behöver du inte skapa nya konton för att börja använda Instantbird.

systreqTitle=Kommer Instantbird att fungera på min dator?
systreqText=Instantbird stöder för närvarande &sysReqWinVersion; eller senare, &sysReqMacVersion; eller senare, och Linux. Se &systemRequirementsLink;, för detaljerad information.
systemRequirementsLink=systemkrav

getlatestTitle=Vad skall jag ladda ner för att få den senaste versionen av Instantbird?
getlatestText=Nedladdningslänken på &homePageLink;, kommer automatiskt att välja den version av Instantbird som bäst stämmer överens med ditt system. Om du själv vill välja operativsystem och språkversion, går du till &downloadPageLink;.
homePageLink=hemsidan
downloadPageLink=nedladdningssidan

installasuserTitle=Kan jag installera Instantbird utan att vara administratör på min dator?
installasuserText=Ja, absolut!

sideinstallTitle=Kan jag installera Instantbird och ändå behålla min gamla meddelandeklient på min dator?
sideinstallText=Ja, det går bra! Instantbird och andra klienter kan samexistera på datorn utan att orsaka problem.

installwindowsTitle=Hur installerar jag Instantbird i Windows?
installwindowsText=Instantbird är paketerat i en körbar exe-fil, för Windows. Starta bara den nedladdade filen, och låt guiden leda dig genom installationsprocessen.

installmacTitle=Hur installerar jag Instantbird i Mac OS X?
installmacText=Dubbelklicka på Instantbirds den skivavbildning (en fil med filnamnstillägget ".dmg") du har laddat ner. Dra sedan Instantbird-ikonen till programmappen.

installlinuxTitle=Hur installerar jag Instantbird i Linux?
installlinuxText1=Extrahera innehållet i det nedladdade arkivet, och starta filen som heter "instantbird". Om en popup-dialog frågar om du vill redigera eller starta filen, väljer du "starta".
installlinuxText2=För tillfället tillhandahåller vi endast 32-bitars byggen. För att kunna köra detta på ett 64-bitars system, måste du installera ett 32-bitars kompatibilitetsbibliotek som tillhandahålles i din distribution. I t.ex Ubuntu, installerar du paketet <code>ia32-libs</code> genom att köra <code>sudo apt-get install ia32-libs</code> från terminal. I Ubuntu kan paketet också installeras från Programcentralen.

portableTitle=Är Instantbird portabel (körbar från USB-minne)?
portableText1=Om du startar Instantbird från ett USB-minne, kommer det som standard att lagra din användarprofil på hårddisken.
# Do NOT translate '-profile' here, it's a command line parameter.
portableText2=Du kan instruera Instantbird att lagra din användarprofil på USB-minnet genom att starta programmet med argumentet <code>-profile</code>.
portableText3=För att göra detta, högerklickar du på <code>instantbird.exe</code> och väljer "Skapa genväg". I genvägens Egenskaper, lägger du sedan till <code> -profile ./<em>mappnamn</em></code> efter sökvägen för "Mål".


updating=Uppdatering

autoupdateTitle=Är det något jag måste göra för att fortsätta använda senaste versionen av Instantbird?
autoupdateText1=Nej, Instantbird söker periodiskt efter uppdateringar, som standard, och ber om tillåtelse att uppgradera sig självt om en ny version hittas.
autoupdateText2=Tycker du inte om det här beteendet, kan du ändra det under Inställningar.

forceupdateTitle=Om jag vill uppdatera nu då?
forceupdateText=I Instantbirds hjälpmeny finns en menypost som heter <em>Sök efter uppdateringar</em>, som du kan använda för manuella uppdateringskontroller.

overwriteTitle=Kan jag installera en nyare version över den befintliga?
overwriteText=Ja.

addonsafterupdateTitle=Kommer mina Tillägg att fungera efter en uppgradering?
addonsafterupdateText1=Kompatibla tillägg kommer fortfarande att fungera efter en uppgradering. Om ett tillägg inte är kompatibelt med den uppgraderade versionen av Instantbird, kommer programmet att föreslå en sökning efter en uppdaterad tilläggsversion, och i förekommande fall uppdatera tillägget.
addonsafterupdateText2=Om ett tillägg inte fungerar efter en uppgradering, kan du kontakta tilläggets utvecklare för att ta reda på om en uppdatering är på gång.


uninstalling=Avinstallation

removeTitle=Hur kan jag ta bort Instantbird?
removeText1=I Windows kan installerad version avinstalleras från Kontrollpanelen på samma sätt som vilket annat program som helst.
removeText2=I andra fall (t.ex portabel version), kan du bara ta bort Instantbird-mappen.
removeText3=Normal avinstallation av Instantbird tar inte bort dina konton, chatthistorik, Insticksmoduler eller Tillägg. Dessa data lagras i din &profileFolderLink;.
profileFolderLink=profilmapp
removeText4=Återinstallerar du Instantbird efter en avinstallation, kommer all data från profilmappen att återanvändas av den nya installationen.

using=Användning
severalaccountsTitle=Kan jag använda flera konton samtidigt?
severalaccountsText1=Ja, du kan ansluta flera konton samtidigt, med något av de protokoll som stöds.
severalaccountsText2=Använd <em>Konton</em> (finns under <em>Verktyg</em> i menyn) för att lägga till nya konton.

supportedprotocolsTitle=Vilka protokoll stöds?
supportedprotocolsText3=Standardstödet i Instantbird innefattar: AIM, Bonjour, Facebook Chat, Gadu-Gadu, Google Talk, Groupwise, ICQ, IRC, MSN, MySpaceIM, Netsoul, Odnoklassniki, QQ, Simple, Twitter, VKontakte, XMPP, Yahoo och Yahoo JAPAN.
supportedprotocolsText2=Fler protokoll kan installeras som &addonsLink;.
addonsLink=Tillägg

facebookusernameTitle=När jag försöker ansluta mitt Facebook-konto, får jag felmeddelandet <code>Invalid XMPP ID</code>. Vad är problemet?
facebookusernameText=Du har angett e-postadressen du använder på Facebooks hemsida, som användarnamn. Facebook-chatten förväntar sig ett unikt användarnamn i namnfältet. Gå till &facebookLink; för att kontrollera det.

facebookauthorizationTitle=När jag försöker ansluta mitt Facebook-konto, får jag felmeddelandet <code>Ej autentiserad</code>. Vad är problemet?
facebookauthorizationText=Du måste aktivera XMPP-anslutningar på ditt Facebook-konto.
facebookauthorizationText1=Besök &facebookChatLink; när du är inloggad på ditt Facebook-konto för att aktivera XMPP-anslutning.
facebookChatLink=Facebook-chatt
facebookauthorizationText2=Logga ut från Facebook-sidan.
facebookauthorizationText3=Logga in igen, på Facebook-sidan.
facebookauthorizationText4=Anslut ditt Facebook-konto i Instantbird ("Verktyg" > "Konton" och tryck "Anslut" på ditt Facebook-konto) så bör det fungera.

getaddonsTitle=Var kan jag hämta tillägg (och teman)?
getaddonsText=Du kan söka efter tillägg från <em>Hämta tillägg</em> i tilläggshanteraren (finns under <em>Verktyg</em>), och du kan gå till &addonsWebsiteLink;, bläddra bland tillägg och teman.
addonsWebsiteLink=webbsidan för Instantbird's tillägg

logsenabledTitle=Loggar Instantbird mina konversationer och chattar?
logsenabledText=Ja, Instantbird skapar loggfiler som standard. Använd inställningarna under <em>Integritet</em> (finns i menyn <em>Verktyg/Alternativ</em>), för att konfigurera loggningen som du vill. Vill du ta en titt på själva loggen, kan du använda knappen <em>Visa logg-mapp...</em> i samma fönster.

logfolderTitle=Var lagras loggarna?
logfolderText=Namn och sökväg för loggfilerna är följande: <code><em>&profileLink;</em>/logs/<em>protokoll</em>/<em>kontakt- eller chatt-namn</em>/<em>datum och tid</em>.txt</code> (replace the parts in italic by actual values).
profileLink=sökväg till profilmappen

profilefolderTitle=Var finns min profilmapp?
profilefolderText1=Den finns på en av följande platser, beroende på operativsystem:
profilefolderTextCopyAndPaste=kopiera och klistra in detta, i Windows Utforskaren
profilefolderTextReuse=Varje version av Instantbird, som installeras efter en avinstallation, kommer att fortsätta använda data från den här profilmappen.

aboutconfigTitle=Kan jag komma åt about:config, för att fintrimma inställningarna?
aboutconfigText=Vi rekommenderar det inte, men about:config är åtkomlig i verktygsmenyn, <em>Alternativ/Avancerat</em>.


development=Utveckling

whyTitle=Varför utvecklar ni Instantbird?
whyText=Vi ger er Instantbird för att &weBelieveLink;.
weBelieveLink=vi tror att snabbmeddelanden är en viktig del av era online-liv.

licenseTitle=Hur är Instantbird licensierad?
licenseText1=Instantbird är licensierat under GNU GPL-licens version 2.0 eller senare (eftersom det använder libpurple, som är GPL-licensierat). Dessutom... det mesta av källkoden är också licensierad med Mozilla Public License (MPL), version 2.0.

getthesourceTitle=Var finns källkoden?
getthesourceText=En 'tarball' med källkoden för varje släppt version är tillgänglig från &downloadPageLink;. Den senaste utvecklingskoden kan hämtas från vår 'Mercurial code repository' genom att följa våra &buildInstructionsLink;.
buildInstructionsLink=kompileringsinstruktioner

teamTitle=Vem utvecklar Instantbird?
teamText=Vi är &teamLink; med motiverade individer men vi hoppas att många, inklusive dig, vill ansluta till oss för att göra projektet ändå bättre.
teamLink=ett litet team

mozillaTitle=Är projektet sponsrat av Mozilla?
mozillaText1=Mozilla foundation har inte hjälpt oss finansiellt.
mozillaText2=Logotypen "Powered by Mozilla", på vår hemsida, innebär att Instantbird är beroende av kod och teknologier som utvecklas av Mozilla-gemenskapen. Vi är väldigt tacksamma mot Mozilla-gemenskapen i sin helhet, för den fantastiska teknik som Instantbird bygger på.

getinvolvedTitle=Hur kan jag bli involverad?
getinvolvedText=Det finns flera sätt att ta del i projektet. Du måste inte vara programmerare för att hjälpa oss. Gå till &getInvolvedLink; för detaljerad information.
getInvolvedLink='Get involved'

translateTitle=Kan jag hjälpa till att översätta till mitt språk?
translateText=Ja! Gå till &translationWikiPageLink; för detaljerad information.
translationWikiPageLink='Translation wiki page'

createaddonsTitle=Hur skapar man add-ons?
createaddonsText=Gå till &extensionsWikiPageLink; för detaljerad information.
extensionsWikiPageLink='Extensions wiki page'

fxaddonsTitle=Fungerar Firefox-/Thunderbird-tillägg i Instantbird?
fxaddonsText=Inte utan åtgärd, men de flesta kan anpassas. Gå till &portingFirefoxExtensionsPageLink; för mer detaljerad information.
portingFirefoxExtensionsPageLink='Porting Firefox extensions page'

followTitle=Hur kan jag följa den aktuella utvecklingen?
followText1=För att hålla dig informerad om viktiga nyheter, kan du följa &blogLink;.
blogLink=vår blogg
followText2=Vill du följa våra diskussioner, är du välkommen in på vår IRC-kanal: &ircRoomLink;.
ircRoomLink=#instantbird på irc.mozilla.org
followText3=&nightlyBuildsLink; produceras varje dag, så att folk kan hjälpa oss testa de nya funktioner som just har lagts till. Använd dem gärna, men se upp! De är kanske inte stabila, och om du bestämmer dig för att använda dem, förväntas du göra det för att hjälpa oss testa de senaste funktionerna, inte för att bara vara en 'cool kille' med senaste leksakerna. Så om du hittar några fel... var snäll och &reportBugLink; istället för att klaga (&filingABugLink;: Vad en buggrapport bör innehålla).
reportBugLink=rapportera dem
nightlyBuildsLink='Nightly builds'
filingABugLink=Filing a bug

whatsnextTitle=Vad kommer nästa version att innehålla?
whatsnextText=Se vår &roadmapLink;.
roadmapLink='roadmap'

whenTitle=När kommer nästa stabila version att släppas?
whenText=Vi är väldigt engagerade och liksom du, angelägna om att projektet skall röra sig framåt så fort som möjligt, men med tanke på förutsättningarna för mjukvaruutveckling kan det vara problematiskt att sätta tidsgränser, särskilt som vi hellre prioriterar bibehållen kvalitet.

futurefeaturesTitle=Kommer Instantbird att stödja överföring/videosamtal/<em>din favoritfunktion</em>?
futurefeaturesText1=Se vår &roadmapLink;.
futurefeaturesText2=Du är välkommen att diskutera funktioner som inte är listade, för att se om intresse finnes eller om det går att implementera som ett tillägg.
