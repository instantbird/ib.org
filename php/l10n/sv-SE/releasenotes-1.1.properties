whatsNew=Vad är nytt?

conversationsCanBePutOnHold=Konversationer kan nu placeras i 'pausläge':
putOnHoldFromContextMenu=En konversation kan placeras i pausläge från flikens högerklicksmeny. Konversationer i pausläge visas överst i kontaktlistan, där det är lätt att åter öppna dem med ett dubbelklick.
noMoreMissedMessages=Du kan inte längre missa några meddelanden på grund av att du stänger konversationsflikar. När du stänger en flik med ett oläst meddelande, hamnar konversationen automatiskt i pausläge i stället för att stängas.
closingChatPutsOnHold=När du stänger ett chatt-rum, hamnar konversationen i pausläge i stället för att stängas helt.
newMessageReopens=Om ett nytt meddelande anländer till en konversation i pausläge, blir fliken automatiskt synlig igen. (I chatt-rum, sker det endast om ditt namn nämns).
unreadCount=Antalet olästa meddelanden visas tydligt, för varje konversation i pausläge. Detta har visat sig särskilt användbart för pausade IRC-kanaler!

improvedTraySupport=Förbättrad meddelandefältsfunktion för Linux/Windows:
singleClickRestore=Återställ kontaktlistan med ett enkelklick på Linux.
trayIconEvenWhenNotMinimized=Instantbird-ikonen är synlig i meddelandefältet även när programmet inte är minimerat.

improvedTwitterSupport=Förbättrat Twitter-stöd:
twitterEntities=Twitter-attributen (@mentions, #hashtags och kortlänkar) stöds nu.
retweetAndReply=Meddelanden kan nu vidareskickas och besvaras (via kontextmenyn).
followUnfollow=Twittrare kan följas och kopplas bort direkt från twittrets kontextmeny.

sametimeSupport=På begäran stöds nu IBM Lotus <strong>Sametime</strong>.

chatParticipantsTooltip=Chatt-deltagare har fått funktionsbeskrivningar
whoisInfo=Whois-information för IRC hämtas och visas automatiskt

tabCompletion=Fliktillägg för IRC-namn, Twitter-användarnamn och kommandon.

interruptionsManagerAPI=Den nya <strong>Interruptions manager API</strong>, låter tilläggsutvecklare enkelt skapa tillägg:
eventsFiltered=Händelser kan detaljfiltreras (typ, källa, ...) för att anpassa vilka aktiviteter som skall tillåtas.

fixedICQSettings=Standard ICQ-inställningar har uppdaterats för att fungera med deras nya server. 

unknownCommandsNoLongerSent=Okända kommandon sänds inte längre till IRC/XMPP-chattrum.

updated=Uppdaterat
basedOnLibpurpleAndMozilla=Instantbird &versionNumber; baseras på libpurple &libpurpleVersion; och Mozilla &mozillaVersion; vilket medför &newPossibilitiesForAddonsDevelopersLink;.
newPossibilitiesForAddonsDevelopersLink=nya möjligheter för tilläggsutvecklare

improvedStability=Förbättrad stabilitet
improvedStabilityDescription=Kraschrapporter från version 1.0 och 'nightly builds' har analyserats och buggar fixats, för att undvika återkommande krascher.

andMore=Och mer... läs en fullständig &changeLogLink; med detaljer om &codeChangesCount; kodjusteringar sedan Instantbird 1.0.
