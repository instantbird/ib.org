keyFeaturesNotesPageTitleSuffix=funktioner

instantbirdFeatures=Instantbirds funktioner
awesomenessToMakeIMBetterForYou=Sammanför olika typer av funktioner, för att göra dina snabbmeddelanden bättre.

allYourFriendsTitle=Håll kontakt med alla dina vänner
allYourFriendsDesc1=Med Instantbird kan du chatta med alla dina kontakter i ett och samma program!
allYourFriendsDesc2=AIM, Yahoo, MSN, Google Talk, IRC, ICQ,  Facebook och Twitter stöds!

troubleFreeTitle=Problemfritt
troubleFreeDesc1=Instantbird har skapats med stabilitet och enkelhet som mål.
troubleFreeDesc2=Du kan njuta av ett rent och snyggt användargränsnitt, inga ovidkommande inslag i dina konversationer!
troubleFreeDesc3=Ingen reklam, du slipper distraheras av oönskat innehåll.

conversationsInTabsTitle=Konversationer i flikar
conversationsInTabsDesc1=Konversationer grupperas i flikar, vilket gör att du inte störs av nya konversationsfönster som poppar upp i tid och otid.
conversationsInTabsDesc2=Flikarna är enkla att hantera. Du kan sortera dom med hjälp av 'Dra & släpp', eller flytta en konversation till ett eget fönster om du vill.

customizableConversationsTitle=Anpassningsbara konversationer
customizableConversationsDesc1=Med några omsorgsfullt designade standardteman och många, många fler tillgängliga som tillägg, har du allt du behöver för att dina konversationer skall kännas personliga.
customizableConversationsDesc2=Låt oss göra dem till en färgrik, och angenäm uplevelse!

smartContactsTitle=Smarta kontakter
smartContactsDesc1=Har du samma kontakter i flera olika nätverk?
smartContactsDesc2=Inga problem, bara 'dra och släpp' en kontakt på en annan, och Instantbird kommer att veta att det är samma person.

alwaysHereForYouTitle=Finns alltid med dig
alwaysHereForYouDesc1=Instantbird fungerar på alla dina datorer, oavsett om du kör Windows, Mac OS X eller Linux.
alwaysHereForYouDesc2=Eftersom det är 'Öppen källkod', kommer du aldrig att behöva betala för Instantbird.
alwaysHereForYouDesc3=Du behöver aldrig mer lära dig använda en ny snabbmeddelandeklient!

limitlessExtensibilityTitle=Obegränsade påbyggnadsmöjligheter
limitlessExtensibilityDesc1=Kraftfulla verktyg, som sök- eller zoom-funktionen, är integrerade för att hjälpa dig få ut mesta möjliga av dina konversationer.
limitlessExtensibilityDesc2=Fler funktioner finns tillgängliga som tillägg, tack vare Instantbirds obegränsade påbyggnadsmöjligheter!

